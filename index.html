<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>TaoHub</title>
        <meta
            name="description"
            content="TaoHub —— Tao 的 blog：记录、思考、创造，企图用 AI 解决一切。"
        />
        <!-- 有正式域名后加回这行（利于 SEO）：<link rel="canonical" href="https://你的域名/" /> -->
        <meta property="og:title" content="TaoHub · Blog" />
        <meta
            property="og:description"
            content="TaoHub —— Tao 的 blog：记录、思考、创造，企图用 AI 解决一切。"
        />
        <meta property="og:type" content="website" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='4' width='24' height='24' rx='3' fill='%23b23a2c'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='serif'>T</text></svg>"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="page">
            <!-- 报头：刊头信息栏 + 名字/签名 + 页内导航 -->
            <header class="masthead">
                <div class="folio">
                    <span>TaoHub · Blog</span>
                </div>
                <div class="mast-main">
                    <div>
                        <h1>TaopleOne</h1>
                        <p class="tagline">企图用ai解决一切</p>
                    </div>
                    <!-- 艺术签名 SVG，见 assets/signature.svg -->
                    <span class="signature">
                        <img
                            class="sig-light"
                            src="assets/signature.svg"
                            alt="tangzhengtao 的签名"
                        />
                        <img
                            class="sig-dark"
                            src="assets/signature-dark.svg"
                            alt=""
                            aria-hidden="true"
                        />
                    </span>
                </div>
                <nav class="mast-nav" aria-label="页内导航">
                    <a href="#about">关于</a>
                    <a href="#posts">文章</a>
                    <a href="#contact">联系</a>
                </nav>
            </header>

            <main>
                <!-- 一 · 关于 -->
                <section class="intro" id="about">
                    <h2><span class="no">一</span>关于</h2>
                    <p>
                        我是<strong>Tao</strong>,喜欢折腾ai这个牛马帮我干点活。
                    </p>
                </section>

                <!-- 二 · 文章（列表由 build.py 自动生成，勿手改中间部分） -->
                <section id="posts">
                    <h2><span class="no">二</span>文章</h2>
                    <ul class="toc">
                        <!-- POSTS:START -->
                        <li class="toc-empty">
                            <svg
                                class="brush"
                                viewBox="0 0 120 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="M4 13 C 28 7, 62 7, 88 11 C 100 12.8, 110 12, 116 9"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2.5"
                                    stroke-linecap="round"
                                />
                                <path
                                    d="M70 17.5 C 84 16.5, 98 15.5, 110 14"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.4"
                                    stroke-linecap="round"
                                    opacity=".55"
                                />
                            </svg>
                            <p class="e1">暂无文章</p>
                            <p class="e2">第一篇正在路上，写好后会出现在这里</p>
                        </li>
                        <!-- POSTS:END -->
                    </ul>
                </section>

                <!-- 三 · 联系 -->
                <section class="contact" id="contact">
                    <h2><span class="no">三</span>联系</h2>
                    <p>
                        写邮件给我：<a href="mailto:tangzhengtao1023@gmail.com"
                            >tangzhengtao1023@gmail.com</a
                        >
                    </p>
                    <ul>
                        <li>
                            <a
                                href="https://github.com/goaltang"
                                target="_blank"
                                rel="noreferrer"
                                >GitHub</a
                            >
                        </li>
                        <li class="sep">·</li>
                        <li>
                            <a
                                href="https://space.bilibili.com/442652191"
                                target="_blank"
                                rel="noreferrer"
                                >Bilibili</a
                            >
                        </li>
                        <li class="sep">·</li>
                        <li>
                            <!-- 抖音主页精确链接获取方法：电脑打开 douyin.com 登录后进自己主页，
                                 复制地址栏 douyin.com/user/... 替换下面的 href；
                                 或 APP 主页→分享→复制链接（v.douyin.com/xxx）。
                                 当前链接为抖音号用户搜索页，国内访客点击即可看到你的账号。 -->
                            <a
                                href="https://www.douyin.com/search/94016900?type=user"
                                target="_blank"
                                rel="noreferrer"
                                >Douyin</a
                            >
                        </li>
                        <li class="sep">·</li>
                        <li>
                            <a
                                href="https://steamcommunity.com/profiles/76561198846127248"
                                target="_blank"
                                rel="noreferrer"
                                >Steam</a
                            >
                        </li>
                    </ul>
                </section>
            </main>

            <footer>
                <span>© 2026 TaoHub</span>
            </footer>
        </div>
    </body>
</html>
