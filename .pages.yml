media:
  - name: images
    label: 文章图片
    input: posts/images
    output: /posts/images
    categories: [image]
    rename: safe

content:
  - name: posts
    label: 文章
    type: collection
    path: posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}.md"
    view:
      fields: [title, published, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: 首页摘要
        type: text
        required: true
      - name: published
        label: 公开此文章
        type: boolean
        default: false
        description: 关闭时只保存在仓库中；公开构建不会包含文章和其图片。
      - name: body
        label: 正文
        type: rich-text
        options:
          media: images
          format: markdown

actions:
  - name: deploy-site
    label: 发布网站
    workflow: deploy.yml
    ref: main
    confirm:
      title: 确认发布？
      message: 发布作品集和已标记公开的文章；草稿不会出现在网站上。
      button: 发布
