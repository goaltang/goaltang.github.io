ss="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>实验台、支架、标尺与闩销</span></span><span class="iso-caption">理想阿特伍德机示意，不是某台实测装置。轻绳跨过无摩擦滑轮连接两只吊架，所以两边以同一加速度 a = (m1 − m2) / (m1 + m2) · g 运动，绳张力 T = 2 m1 m2 / (m1 + m2) · g。每只吊架 50 g，每片砝码 20 g。标尺上一厘米对应一厘米位移，g 取 9.81 m/s²。表盘指针显示 a，范围 −5 到 +5 m/s²，左侧下降为正。闩销把两边托盘锁在同一高度；松开后较重一侧下落，直到碰到挡块停下。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }

    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);

        else if (run) {

}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);

    const normals = ring.map(([ax, ay], index) => {

// model.mjs — ideal Atwood machine. Pure numbers: no drawing.
//
// Two masses share one light string over a frictionless pulley.
//   a = (m1 − m2) / (m1 + m2) · g     positive when the left mass descends
//   T = 2 m1 m2 / (m1 + m2) · g
//
// Masses are a 50 g hanger plus up to five 20 g slotted discs.
// Travel is in centimetres. One drawing unit is one centimetre.
// Schematic, not a measured rig: the pulley and the string are massless.

const G = 9.81; // m/s²
const HANGER_G = 50;
const DISC_G = 20;
const DISC_MIN = 0;
const DISC_MAX = 5;
const STROKE = 36; // cm, each way from the latched level
const CM_PER_M = 100;

const INITIAL = { n1: 3, n2: 1 };

const A_EPS = 0.02; // m/s², treated as balanced
const V_EPS = 0.2; // cm/s

const clampDiscs = (n) => Math.max(DISC_MIN, Math.min(DISC_MAX, Math.round(n)));

const grams = (discs) => HANGER_G + clampDiscs(discs) * DISC_G;

const kilograms = (discs) => grams(discs) / 1000;

/** Optional `fault` is only for the checker: "swap" flips the sign of a, "g" pretends a = g. */
function predict(discs1, discs2, fault = null) {
  const g1 = grams(discs1);
  const g2 = grams(discs2);
  const m1 = g1 / 1000;
  const m2 = g2 / 1000;
  const sum = m1 + m2;
  let a = ((m1 - m2) / sum) * G;
  const T = ((2 * m1 * m2) / sum) * G;
  if (fault === "swap") a = -a;
  if (fault === "g") a = G;
  return { m1, m2, g1, g2, a, T };
}

function pack(pred, s, v, phase) {
  return { s, v, phase, a: pred.a, T: pred.T, g1: pred.g1, g2: pred.g2, m1: pred.m1, m2: pred.m2 };
}

/** Where a released machine rests once every transient is over. Reduced motion jumps here. */
function atRest(discs1, discs2, released) {
  const pred = predict(discs1, discs2);
  if (!released) return pack(pred, 0, 0, "latched");
  if (Math.abs(pred.a) < A_EPS) return pack(pred, 0, 0, "balanced");
  return pack(pred, Math.sign(pred.a) * STROKE, 0, "stopped");
}

/**
 * Advance one step. `s` is how far the left hanger has descended, in cm.
 * Released motion is the ideal acceleration. Latched motion is the hand
 * returning both hangers to the level stop (not free fall).
 */
function step(state, discs1, discs2, dt, released) {
  const pred = predict(discs1, discs2);
  const h = Math.max(0, Math.min(dt, 1 / 20));
  if (!released) {
    const k = 5.5; // 1/s, about a second to climb back from the bumper
    let v = -state.s * k;
    let s = state.s + v * h;
    if (Math.abs(s) < 0.06) return pack(pred, 0, 0, "latched");
    return pack(pred, s, v, "resetting");
  }
  const aCm = pred.a * CM_PER_M;
  let v = state.v + aCm * h;
  let s = state.s + v * h;
  if (s > STROKE) {
    s = STROKE;
    if (v > 0) v = 0;
  } else if (s < -STROKE) {
    s = -STROKE;
    if (v < 0) v = 0;
  }
  let phase = "running";
  if ((s === STROKE || s === -STROKE) && v === 0) phase = "stopped";
  else if (Math.abs(pred.a) < A_EPS && Math.abs(v) < V_EPS) phase = "balanced";
  return pack(pred, s, v, phase);
}

function describe(state) {
  const phaseZh = {
    latched: "闩住",
    running: "运行中",
    stopped: "已停",
    balanced: "平衡",
    resetting: "复位中",
  }[state.phase] || state.phase;
  const dir = Math.abs(state.a) < A_EPS ? "两侧相等" : state.a > 0 ? "左侧下降" : "右侧下降";
  const side = Math.abs(state.a) < A_EPS ? "两侧相等" : state.a > 0 ? "左侧重" : "右侧重";
  const text = `${phaseZh}·${side} · 加速度 ${state.a.toFixed(2)} m/s² · ${state.g1}/${state.g2} g`;
  return { dir, text };
}

/** Problems in a state the picture is about to show. Empty means the formulas hold. */
function faultsOf(fault = null) {
  const faults = [];
  const cases = [
    [3, 1],
    [1, 4],
    [0, 5],
    [2, 2],
    [5, 0],
  ];
  for (const [n1, n2] of cases) {
    const m1 = kilograms(n1);
    const m2 = kilograms(n2);
    const expectA = ((m1 - m2) / (m1 + m2)) * G;
    const expectT = ((2 * m1 * m2) / (m1 + m2)) * G;
    const got = predict(n1, n2, fault);
    if (Math.abs(got.a - expectA) > 1e-9) faults.push(`a ${n1}/${n2}`);
    if (Math.abs(got.T - expectT) > 1e-9) faults.push(`T ${n1}/${n2}`);
    if (Math.abs(got.g1 - grams(n1)) > 1e-9) faults.push(`g1 ${n1}`);
  }
  let left = { s: 0, v: 0 };
  for (let i = 0; i < 240; i++) left = step(left, 4, 1, 1 / 60, true);
  if (!(left.s > 8)) faults.push("heavier left did not descend");
  let right = { s: 0, v: 0 };
  for (let i = 0; i < 240; i++) right = step(right, 1, 4, 1 / 60, true);
  if (!(right.s < -8)) faults.push("heavier right did not descend");
  let held = { s: 0, v: 0 };
  for (let i = 0; i < 180; i++) held = step(held, 2, 2, 1 / 60, true);
  if (Math.abs(held.s) > 1e-6 || Math.abs(held.v) > 1e-6) faults.push("equal masses drifted");
  let back = { s: STROKE, v: 0 };
  for (let i = 0; i < 240; i++) back = step(back, 5, 0, 1 / 60, false);
  if (back.s !== 0 || back.phase !== "latched") faults.push("latch did not return home");
  const rest = atRest(5, 0, true);
  if (rest.s !== STROKE || rest.phase !== "stopped") faults.push("rest pose");
  const even = atRest(2, 2, true);
  if (even.s !== 0 || even.phase !== "balanced") faults.push("balanced rest");
  return faults;
}

// layout.mjs — bench size, camera, and where every part sits.
// Drawing units are centimetres, the same unit the model integrates.



const WIDTH = 680;
const HEIGHT = 560;

const GEO = (() => {
  // Larger world y is nearer the camera. The gantry sits at the back;
  // the pulley and the hangers hang in the open in front of it.
  const base = { x: -116, y: -22, w: 232, d: 124, r: 8 };
  const baseTop = 14;
  const footH = 7;
  const drop = 52; // cap top (string tie) down to the underside of the pan
  const bumperH = 8;
  const clearance = 1.4;
  const hook0 = baseTop + bumperH + clearance + STROKE + drop;
  const pulleyR = 20;
  const groove = 18.8;
  const stringClear = 20;
  const pulleyZ = hook0 + STROKE + stringClear;
  const pulley = { x: 0, y: 58, z: pulleyZ, r: pulleyR, groove, half: 2.4 };
  const beamTop = pulleyZ - pulleyR - 8;
  const beamH = 13;
  const beamZ = beamTop - beamH;
  const beam = { x: -54, y: 2, w: 108, d: 16, r: 1.6 }; // rear crossbar
  const arm = { x: -7.5, y: 18, w: 15, d: 28, r: 1.2 }; // reaches forward, ends at y=46
  const post = { x: 44, y: 10, r: 4.5, z0: baseTop, top: beamZ };
  const hanger = {
    x: groove,
    y: pulley.y,
    rStem: 1.7,
    rPan: 10.2,
    panH: 3,
    boss: 0.55,
    rDisc: 12.4,
    discH: 5.2,
    gap: 1.15,
    rHole: 2.5,
    capH: 4.4,
    capR: 2.7,
  };
  const dial = { x: 64, y: 72, r: 15.2, h: 8.5 };
  const knobL = [-100, 84];
  const knobR = [100, 84];
  const knob = { r: 5.6, h: 6 };
  const latch = { x: -8, y: 86, w: 28, d: 11, h: 4.5, slide: 16 };
  const name = { x: -72, y: 68, w: 44, d: 14, h: 8 };
  const panCenter0 = hook0 - drop + hanger.panH / 2;
  const scale = { x: -54, y: 52, w: 11, d: 7, z: panCenter0 - 42, h: 88 };
  return {
    base,
    baseTop,
    footH,
    drop,
    bumperH,
    hook0,
    panCenter0,
    stroke: STROKE,
    pulley,
    beam,
    beamZ,
    beamTop,
    beamH,
    arm,
    post,
    hanger,
    dial,
    knobL,
    knobR,
    knob,
    latch,
    name,
    scale,
    discs: DISC_MAX,
  };
})();

function scenePoints() {
  const g = GEO;
  const top = g.pulley.z + g.pulley.r + 2;
  return [
    ...boxCorners(g.base, -g.footH, g.baseTop),
    [g.post.x, g.post.y, g.post.top],
    [-g.post.x, g.post.y, g.post.top],
    [g.pulley.x - g.pulley.r, g.pulley.y, top],
    [g.pulley.x + g.pulley.r, g.pulley.y, top],
    [g.pulley.x, g.pulley.y + 8, g.pulley.z],
    [g.arm.x, g.arm.y + g.arm.d, g.beamTop],
    [-g.hanger.x, g.hanger.y, g.hook0 + g.stroke],
    [g.hanger.x, g.hanger.y, g.hook0 - g.stroke - g.drop],
    [g.scale.x, g.scale.y, g.scale.z + g.scale.h],
    [g.knobL[0], g.knobL[1], g.baseTop + g.knob.h],
    [g.knobR[0], g.knobR[1], g.baseTop + g.knob.h],
    [g.dial.x + g.dial.r, g.dial.y, g.baseTop + g.dial.h],
  ];
}

function makeProjection() {
  return fitProjection(scenePoints(), WIDTH, HEIGHT, { pad: 26, azimuth: 40, elevation: 28 });
}

const P = makeProjection();

// dyn.mjs — parts whose shape or place follows the model.
// The build draws the rest frame with these functions. The page calls the same ones.



const S = (paths, style) => solidSvg(paths, style);
const L = (d, style) => (d ? lineSvg(d, style) : "");

const sideSign = (side) => (side === "l" ? -1 : 1);

/** String-tie height. `s` > 0 lowers the left hanger and raises the right one. */
const hookOf = (side, s) => GEO.hook0 + (side === "l" ? -s : s);

const shiftOf = (side, s) => hookOf(side, s) - GEO.hook0;

const pitch = () => GEO.hanger.discH + GEO.hanger.gap;

function stackTop(n) {
  const h = GEO.hanger;
  const panTop = GEO.hook0 - GEO.drop + h.panH;
  return panTop + h.boss + n * pitch();
}

/** Stem above the discs. Adding a disc shortens it, so it is rebuilt, not scaled. */
function stemSvg(side, n) {
  const h = GEO.hanger;
  const x = sideSign(side) * h.x;
  const z0 = stackTop(n);
  const z1 = GEO.hook0 - h.capH;
  if (z1 - z0 < 0.6) return "";
  return S(cylinder(x, h.y, h.rStem, z0, z1 - z0, P, 14), { tone: "mid", crease: "none" });
}

function hangerSvg(side, n) {
  const h = GEO.hanger;
  const x = sideSign(side) * h.x;
  const y = h.y;
  const panBottom = GEO.hook0 - GEO.drop;
  const panTop = panBottom + h.panH;
  const out = [];
  out.push(S(cylinder(x, y, h.rPan, panBottom, h.panH, P, 28, 0.35), { tone: "hi", crease: "lo" }));
  out.push(L(ring(x, y, h.rPan - 1.6, panTop, P, 28), { tone: "faint" }));
  out.push(S(cylinder(x, y, h.rStem + 0.4, panTop, h.boss, P, 14), { tone: "mid", crease: "none" }));
  for (let i = 0; i < GEO.discs; i++) {
    const z = panTop + h.boss + i * pitch();
    const hidden = i >= n ? ` style="display:none"` : "";
    const disc = S(cylinder(x, y, h.rDisc, z, h.discH, P, 32, 0.28), { tone: "hi", crease: "lo" });
    const hole = L(ring(x, y, h.rHole, z + h.discH, P, 16), { tone: "lo" });
    const slot = L(lineOnTop([x + h.rHole, y], [x + h.rDisc - 0.35, y], z + h.discH, P), { tone: "lo" });
    out.push(`<g data-disc="${i}"${hidden}>${disc}${hole}${slot}</g>`);
  }
  out.push(`<g data-stem>${stemSvg(side, n)}</g>`);
  const capZ = GEO.hook0 - h.capH;
  out.push(S(cylinder(x, y, h.capR, capZ, h.capH, P, 18, 0.3), { tone: "hi", crease: "lo" }));
  out.push(L(ring(x, y, h.capR - 0.7, GEO.hook0, P, 16), { tone: "faint" }));
  out.push(dotsSvg([iso([x, y, GEO.hook0], P)], { size: 0.55, tone: "hi" }));
  return out.join("");
}

/** Finger at the left pan, stopping short of the scale plate and the disc. */
function riderSvg() {
  const h = GEO.hanger;
  const s = GEO.scale;
  const z = GEO.panCenter0 - 1.35;
  const x0 = s.x + s.w + 0.6;
  const x1 = -h.x - h.rDisc - 0.55;
  const plan = { x: x0, y: h.y - 1.15, w: Math.max(0.8, x1 - x0), d: 2.3, r: 0.4 };
  const head = { x: x0, y: h.y - 1.7, w: 2.4, d: 3.4, r: 0.4 };
  return (
    S(slabOf(head, z, 2.5, P, 3, 0.25), { tone: "hi", crease: "lo" }) +
    S(slabOf(plan, z + 0.35, 1.7, P, 3, 0.2), { tone: "hi", crease: "lo" })
  );
}

function circleXZ(x, y, z, r, steps = 48) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * Math.PI * 2;
    pts.push(iso([x + r * Math.cos(a), y, z + r * Math.sin(a)], P));
  }
  return pathOf(pts, true);
}

function cheekGuides() {
  const p = GEO.pulley;
  const y = p.y + 2.55;
  return L(circleXZ(p.x, y, p.z, 6.2), { tone: "lo" }) + L(circleXZ(p.x, y, p.z, 15.4), { tone: "faint" });
}

/** Four spokes on the near cheek. Angle follows the string: θ = s / R. */
function spokePath(s) {
  const p = GEO.pulley;
  const y = p.y + 2.55;
  const ang0 = -s / p.groove;
  let d = "";
  for (let i = 0; i < 4; i++) {
    const a = ang0 + (i * Math.PI) / 2;
    d += segment(
      [p.x + Math.cos(a) * 6.2, y, p.z + Math.sin(a) * 6.2],
      [p.x + Math.cos(a) * 15.4, y, p.z + Math.sin(a) * 15.4],
      P,
    );
  }
  return d;
}

/** String over the pulley. Ends on the two cap-top knots. */
function stringPath(s) {
  const p = GEO.pulley;
  const r = p.groove;
  const zL = hookOf("l", s);
  const zR = hookOf("r", s);
  const pts = [iso([-r, p.y, zL], P), iso([-r, p.y, p.z], P)];
  const steps = 28;
  for (let i = 0; i <= steps; i++) {
    const a = Math.PI - (Math.PI * i) / steps;
    pts.push(iso([p.x + r * Math.cos(a), p.y, p.z + r * Math.sin(a)], P));
  }
  pts.push(iso([r, p.y, zR], P));
  return pathOf(pts);
}

/** Dial needle. Zero points toward the near edge of the bench (+y). Full scale is ±5 m/s². */
function needlePath(a) {
  const d = GEO.dial;
  const top = GEO.baseTop + d.h + 0.25;
  const clamped = Math.max(-5, Math.min(5, a));
  const theta = Math.PI / 2 + (clamped / 5) * 2.05;
  const r0 = 3.15;
  const r1 = d.r - 3.5;
  return lineOnTop(
    [d.x + Math.cos(theta) * r0, d.y + Math.sin(theta) * r0],
    [d.x + Math.cos(theta) * r1, d.y + Math.sin(theta) * r1],
    top,
    P,
  );
}

function knobSlot(side, discs) {
  const [x, y] = side === "l" ? GEO.knobL : GEO.knobR;
  const z = GEO.baseTop + GEO.knob.h + 0.2;
  const ang = discs * 0.62;
  const r = GEO.knob.r - 1.15;
  return lineOnTop([x + Math.cos(ang) * r, y + Math.sin(ang) * r], [x - Math.cos(ang) * r, y - Math.sin(ang) * r], z, P);
}

// live.js — drag, keys, release, tour. Motion and the readout come from the model inlined above.
const stage = document.querySelector(".aw-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const spoken = document.querySelector(".aw-live");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const hangerL = svg.querySelector("#hanger-l");
const hangerR = svg.querySelector("#hanger-r");
const rider = svg.querySelector("#rider");
const stringEl = svg.querySelector("#string");
const spokesEl = svg.querySelector("#spokes");
const needleEl = svg.querySelector("#needle");
const knobL = svg.querySelector("#knob-l");
const knobR = svg.querySelector("#knob-r");
const latchEl = svg.querySelector("#latch");
const releaseBtn = document.querySelector('[data-act="release"]');
const tourBtn = document.querySelector('[data-act="tour"]');

let n1 = INITIAL.n1;
let n2 = INITIAL.n2;
let released = false;
let motion = atRest(n1, n2, released);
let shown1 = n1;
let shown2 = n2;
const latch = { at: 0, target: 0 };
let frame = 0;
let last = 0;
let visible = false;
let clock = 0;
let touring = !still.matches;
let tourEnabled = !still.matches;
let idleTimer = 0;
let announced = false;
let lastPhrase = "";

const SCRIPT = [
  { t: 0, n1: 3, n2: 1, go: false },
  { t: 1.8, n1: 3, n2: 1, go: true },
  { t: 4.6, n1: 3, n2: 1, go: false },
  { t: 6.6, n1: 1, n2: 4, go: false },
  { t: 8.2, n1: 1, n2: 4, go: true },
  { t: 11.0, n1: 1, n2: 4, go: false },
  { t: 12.8, n1: 2, n2: 2, go: false },
  { t: 14.0, n1: 2, n2: 2, go: true },
  { t: 16.0, n1: 5, n2: 0, go: false },
  { t: 17.4, n1: 5, n2: 0, go: true },
  { t: 19.4, n1: 5, n2: 0, go: false },
];
const LOOP = 21;

const tourAt = (t) => {
  const u = t % LOOP;
  let item = SCRIPT[0];
  for (const step of SCRIPT) if (step.t <= u) item = step;
  return item;
};

const phrase = () => {
  const word = describe(motion);
  return `${word.text}`;
};

function announce(text) {
  if (!announced || text === lastPhrase) return;
  lastPhrase = text;
  spoken.textContent = text;
}

function showMass(root, side, n) {
  root.querySelectorAll("[data-disc]").forEach((el) => {
    el.style.display = Number(el.dataset.disc) < n ? "" : "none";
  });
  root.querySelector("[data-stem]").innerHTML = stemSvg(side, n);
}

function draw() {
  hangerL.setAttribute("transform", translateAlong(P, [0, 0, shiftOf("l", motion.s)]));
  hangerR.setAttribute("transform", translateAlong(P, [0, 0, shiftOf("r", motion.s)]));
  rider.setAttribute("transform", translateAlong(P, [0, 0, shiftOf("l", motion.s)]));
  latchEl.setAttribute("transform", translateAlong(P, [latch.at * GEO.latch.slide, 0, 0]));
  if (n1 !== shown1) {
    showMass(hangerL, "l", n1);
    shown1 = n1;
  }
  if (n2 !== shown2) {
    showMass(hangerR, "r", n2);
    shown2 = n2;
  }
  stringEl.setAttribute("d", stringPath(motion.s));
  spokesEl.setAttribute("d", spokePath(motion.s));
  needleEl.setAttribute("d", needlePath(motion.a));
  knobL.setAttribute("d", knobSlot("l", n1));
  knobR.setAttribute("d", knobSlot("r", n2));
  const text = describe(motion).text;
  if (readout.textContent !== text) readout.textContent = text;
  if (releaseBtn) {
    releaseBtn.textContent = released ? "闩住" : "松开";
    releaseBtn.setAttribute("aria-pressed", released ? "true" : "false");
  }
  if (tourBtn) tourBtn.setAttribute("aria-pressed", tourEnabled ? "true" : "false");
  announce(phrase());
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring && !calm) clock += dt;
  if (touring && calm) clock += dt;
  if (touring) {
    const item = tourAt(clock);
    n1 = item.n1;
    n2 = item.n2;
    released = item.go;
  }
  motion = calm ? atRest(n1, n2, released) : step(motion, n1, n2, dt, released);
  latch.target = motion.phase === "latched" ? 0 : 1;
  if (calm) latch.at = latch.target;
  else latch.at += (latch.target - latch.at) * (1 - Math.exp(-dt / 0.14));
  if (Math.abs(latch.target - latch.at) < 0.004) latch.at = latch.target;
  draw();
  const moving = motion.phase === "running" || motion.phase === "resetting" || latch.at !== latch.target;
  const settled = !touring && !moving;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!tourEnabled || still.matches) return;
    touring = true;
    clock = 0;
    run();
  }, 3600);
}

function setDiscs(next1, next2) {
  n1 = clampDiscs(next1);
  n2 = clampDiscs(next2);
  run();
}

function discsFrom(fx, a, b) {
  const t = Math.min(1, Math.max(0, (fx - a) / (b - a)));
  return clampDiscs(Math.round(t * DISC_MAX));
}

function fraction(event) {
  const box = svg.getBoundingClientRect();
  return (event.clientX - box.left) / box.width;
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("pointerdown", (event) => {
  takeOver();
  const fx = fraction(event);
  if (fx < 0.4) n1 = discsFrom(fx, 0.04, 0.38);
  else if (fx > 0.6) n2 = discsFrom(fx, 0.62, 0.96);
  else released = !released;
  run();
});

stage.addEventListener("keydown", (event) => {
  let used = true;
  if (event.key === "ArrowLeft") setDiscs(n1 - 1, n2);
  else if (event.key === "ArrowRight") setDiscs(n1 + 1, n2);
  else if (event.key === "ArrowDown") setDiscs(n1, n2 - 1);
  else if (event.key === "ArrowUp") setDiscs(n1, n2 + 1);
  else if (event.key === "Home") {
    released = false;
    setDiscs(2, 2);
  } else if (event.key === "End") {
    released = false;
    setDiscs(DISC_MAX, 0);
  } else if (event.key === " " || event.key === "Enter") released = !released;
  else if (event.key === "Escape") released = false;
  else used = false;
  if (!used) return;
  event.preventDefault();
  takeOver();
  run();
});

stage.addEventListener("focus", () => {
  announced = true;
  lastPhrase = "";
  announce(phrase());
});

document.querySelectorAll("[data-act]").forEach((button) => {
  button.addEventListener("click", () => {
    const act = button.dataset.act;
    if (act === "theme") {
      const body = document.body;
      body.dataset.theme = body.dataset.theme === "dark" ? "light" : "dark";
      button.textContent = body.dataset.theme === "dark" ? "浅色" : "深色";
      return;
    }
    takeOver();
    if (act === "m1-") n1 = clampDiscs(n1 - 1);
    if (act === "m1+") n1 = clampDiscs(n1 + 1);
    if (act === "m2-") n2 = clampDiscs(n2 - 1);
    if (act === "m2+") n2 = clampDiscs(n2 + 1);
    if (act === "release") released = !released;
    if (act === "tour") {
      tourEnabled = !tourEnabled;
      touring = tourEnabled && !still.matches;
      if (touring) clock = 0;
    }
    run();
  });
});

draw();
run();
</script></body></html>
