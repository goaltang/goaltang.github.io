// model.mjs — high-rise domestic water, pure numbers. No drawing.
// Illustrative (示意), not a surveyed building. Municipal pressure is a typical
// 0.28 MPa at the basement entry. Pump head follows the affinity law.
// Floor pressure: P = P_source − ρ g h − k Q², then a PRV caps the result.

const RHO = 1000;
const G = 9.81;
const FLOORS = 18;
const STORY = 3; // m, default storey; the page can drag this between STORY_MIN and STORY_MAX
const STORY_MIN = 2.6;
const STORY_MAX = 3.8;
const P_CITY = 0.28; // MPa at the basement entry
const HEAD_RATED = 72; // m at full speed. At the default 80% each zone's top floor stays usable.
const K_FRICTION = 0.000009; // MPa per (L/min)² over the full riser (~0.02 MPa at 48 L/min)
const P_PRV = 0.32; // MPa, cap on every floor downstream of a zone PRV
const P_LOW = 0.05; // MPa, below this a tap only trickles
const P_HIGH = 0.35; // MPa, above this the floor is flagged 偏高
const Q_TAP = 8; // L/min, one fully open tap
const TAPS_MAX = 12;
const ROOF_LEVEL = 2.4; // m of water standing in the roof tank, above the roof slab

const LOW_TOP = 6;
const MID_TOP = 12;

const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, Number.isFinite(value) ? value : lo));

/** Zone a floor belongs to. 1 is the lowest occupied floor. */
function zoneOf(floor) {
  if (floor <= LOW_TOP) return "low";
  if (floor <= MID_TOP) return "mid";
  return "high";
}

/** A PRV body is drawn on the lower floors of the pumped zones. */
function hasPrv(floor) {
  return (floor >= 7 && floor <= 8) || (floor >= 13 && floor <= 14);
}

/**
 * Floors whose water has already passed a zone PRV.
 * Pump mode feeds each pumped zone from the bottom, so the whole zone is downstream.
 * Gravity mode feeds every floor from the roof tank, and the lower floors of every zone pass a PRV.
 */
function downstreamOfPrv(floor, mode = "pump") {
  if (mode === "gravity") return true;
  return zoneOf(floor) !== "low";
}

/** Lowest floor of a zone: the upfeed PRV sits here, and it is also where static head peaks. */
function zoneInlet(zone) {
  if (zone === "mid") return LOW_TOP + 1;
  if (zone === "high") return MID_TOP + 1;
  return 1;
}

function operatingPoint({ flowTaps = 6, pumpPct = 80, storyM = STORY, watch = 12, mode = "pump", mainOpen = true, pumpOpen = true, tapOpen = true, city = P_CITY } = {}) {
  const taps = clamp(flowTaps, 0, TAPS_MAX);
  const speed = clamp(pumpPct, 0, 100) / 100;
  const story = clamp(storyM, STORY_MIN, STORY_MAX);
  const watchedN = Math.round(clamp(watch, 1, FLOORS));
  const gravity = mode === "gravity";
  const q = mainOpen && tapOpen ? taps * Q_TAP : 0;
  const head = HEAD_RATED * speed * speed;
  const pumpMpa = (RHO * G * head) / 1e6;
  const cityP = clamp(city, 0, 1.2);
  const boosted = !gravity && mainOpen && pumpOpen && speed > 0.04;
  const running = boosted && q > 0;
  return { taps, speed, story, watchedN, gravity, mainOpen, pumpOpen, tapOpen, q, head, pumpMpa, cityP, boosted, running };
}

/** Hydrostatic pressure before the zone PRV. Negative means the floor is above the source. */
function rawPressure(n, op) {
  const h = n * op.story;
  const zone = zoneOf(n);
  const friction = K_FRICTION * op.q * op.q * (h / (FLOORS * op.story));
  const open = op.mainOpen && op.tapOpen;
  if (!open) return { h, zone, raw: 0, fed: false };
  if (op.gravity) {
    const roofWater = FLOORS * op.story + ROOF_LEVEL;
    const head = Math.max(0, roofWater - h);
    return { h, zone, raw: (RHO * G * head) / 1e6 - friction, fed: true };
  }
  if (zone === "low") return { h, zone, raw: op.cityP - (RHO * G * h) / 1e6 - friction, fed: true };
  if (!op.boosted) return { h, zone, raw: 0, fed: false };
  return { h, zone, raw: op.cityP + op.pumpMpa - (RHO * G * h) / 1e6 - friction, fed: true };
}

/**
 * Pressure at one floor. This is the only per-floor pressure formula:
 * the card, the column and the checks all call it (solve does too).
 * Upfeed: the PRV at the bottom of a pumped zone removes the same excess
 * from every floor above it, so the cap holds and head still falls with height.
 * Downfeed: every floor downstream of a PRV is held to the setpoint.
 */
function floorPressure(n, input = {}) {
  const op = operatingPoint(input);
  const row = rawPressure(n, op);
  const mode = op.gravity ? "gravity" : "pump";
  const downstream = downstreamOfPrv(n, mode);
  let pressure = row.raw;
  let limited = false;
  if (row.fed && downstream && op.gravity) {
    if (pressure > P_PRV) {
      pressure = P_PRV;
      limited = true;
    }
  } else if (row.fed && downstream) {
    const inlet = zoneInlet(row.zone);
    const inletRaw = inlet === n ? row.raw : rawPressure(inlet, op).raw;
    const excess = Math.max(0, inletRaw - P_PRV);
    if (excess > 0) {
      pressure = row.raw - excess;
      limited = true;
    }

  if (pressure < 0) pressure = 0;
  if (downstream && pressure > P_PRV) pressure = P_PRV;

  if (!row.fed || pressure < P_LOW) band = "low";
  else if (pressure > P_HIGH) band = "high";

    n,
    h: row.h,
    zone: row.zone,
    pressure,
    band,
    prv: hasPrv(n),
    limited,
  };
}

/**
 * Pressures and flows for one operating point.
 * flowTaps: how many taps are open (0..TAPS_MAX).
 * pumpPct: pump speed, 0..100. Ignored in gravity mode.
 * storyM: storey height in metres.
 * watch: the floor the big readout follows (1..FLOORS).
 * mode: "pump" (boosted zones from the basement set) or "gravity" (roof tank).
 * mainOpen / pumpOpen / tapOpen: isolation valves and the featured tap.
 */
function solve(input = {}) {
  const op = operatingPoint(input);
  const floors = [];
  for (let n = 1; n <= FLOORS; n++) floors.push(floorPressure(n, input));

  const watched = floors[op.watchedN - 1];
  const delivering = op.q > 0 && watched.pressure > 0.005;
  const flow = delivering ? op.q * (op.gravity || !op.running ? Math.min(1, watched.pressure / 0.15) : Math.min(1, 0.35 + op.speed * 0.8)) : 0;
  const tank = op.gravity ? 0.72 : clamp(0.55 + (1 - op.taps / TAPS_MAX) * 0.35, 0.28, 0.92);
  const { taps, story, watchedN, speed, gravity, mainOpen, pumpOpen, tapOpen, q, head, pumpMpa, running, cityP } = op;

  return {
    taps,
    story,
    watch: watchedN,
    speed,
    pumpPct: Math.round(speed * 100),

const line = (d, style) => (d ? stroke(d, style) : "");

function waterline(P, level) {
  const z = TANK_Z + 2 + 16 * level;

function floatAt(P, level) {

function cartridgeAt(P, open) {

}

/** Needle on a meter dial. `turn` is radians. */
function needle(P, x, y, z, turn) {
  const dx = Math.cos(turn) * 1.8;
  const dy = Math.sin(turn) * 1.8;
  return line(alongTop([x, y + 0.4], [x + dx, y + 0.4 + dy], z, P), { tone: "lit" });
}

/** Short radial tick on a pump volute, so the motor reads as turning. */
function pumpTick(P, x, y, z, turn) {
  const a = turn;
  const x0 = x + Math.cos(a) * 2.4;
  const y0 = y + Math.sin(a) * 2.4;
  const x1 = x + Math.cos(a) * 4.6;
  const y1 = y + Math.sin(a) * 4.6;
  return line(alongTop([x0, y0], [x1, y1], z, P), { tone: "hi" });
}

/**
 * Dashes along the riser. `flow` is 0..1 and sets how far the dashes have travelled.
 * Phase is in units of storey.
 */
function flowDashes(P, phase, flow, gravity) {
  const amount = Math.min(1, Math.max(0, flow));
  if (amount < 0.02) return "";
  const x = gravity ? GRAVITY_X : RISER_X;
  const y = gravity ? GRAVITY_Y : RISER_Y;
  const parts = [];
  const count = 10;
  for (let i = 0; i < count; i++) {
    const u = ((i / count + phase) % 1);
    const z0 = 8 + u * (ROOF_Z - 16);
    const len = 3.2 + amount * 2.4;
    const dir = gravity ? -1 : 1;
    const z1 = z0 + dir * len;
    const lo = Math.min(z0, z1);
    const hi = Math.max(z0, z1);
    if (hi < 6 || lo > ROOF_Z - 2) continue;
    parts.push(seg([x, y, Math.max(6, lo)], [x, y, Math.min(ROOF_Z - 2, hi)], P));
  }
  return line(parts.join(""), { tone: "lit", dashed: true });
}

/** Branch dashes on the three featured floors, running out toward the tap. */
function branchDashes(P, phase, flow) {
  const amount = Math.min(1, Math.max(0, flow));
  if (amount < 0.02) return "";
  const parts = [];
  for (const n of TAP_FLOORS) {
    const z = floorZ(n) + 3.2;
    const u = (phase + n * 0.17) % 1;
    const x0 = RISER_X + 3 + u * 18;
    parts.push(seg([x0, RISER_Y, z], [x0 + 7, RISER_Y, z], P));
  }
  return line(parts.join(""), { tone: "hi", dashed: true });
}

const TONE = { ok: "mid", low: "lo", high: "lit" };

/** Screen point of one floor's pressure, on the clear side of the tower. */
function columnOf(P, n) {
  const [x, y] = project([COLUMN.x, COLUMN.y, floorZ(n) + 1.6], P);
  // Clear the slab's back corner, which sits just under floors 2–3.
  return [x + 52, y];
}

/**
 * One pressure per floor. The number comes from floorPressure, the same
 * function solve() uses for the card readout.

function pressureColumn(P, input) {
  let svg = "";
  for (let n = 1; n <= FLOORS; n++) {
    const floor = floorPressure(n, input);
    const [x, y] = columnOf(P, n);

    svg += `<text class="iso-face-text" data-tone="${tone}" x="${x.toFixed(1)}" y="${(y - 2).toFixed(1)}" font-size="10" text-anchor="start">${floorLabel(floor)}</text>`;
  }
  return svg;
}

function zoneTags(P) {

  const marks = [

    [9, "中区"],

const still = matchMedia("(prefers-reduced-motion: reduce)");

let state = initial();

let last = 0;
let visible = false;
let clock = 0;
let touring = false;
let tourEnabled = false;
let dragging = null;
let phase = 0;
let spin = 0;
let openShown = state.tapOpen ? 1 : 0;
let levelShown = 0.6;
const pose = { key: "" };

const follow = (value, target, dt, tau, calm) => {
  if (calm) return target;
  const next = value + (target - value) * (1 - Math.exp(-dt / tau));
  return Math.abs(target - next) < 0.004 ? target : next;
};

function view() {
  return solve(state);
}

function say(v) {
  const text = readout(v);
  if (readoutEl.textContent !== text) readoutEl.textContent = text;
  const qEl = tools.querySelector("[data-q]");
  const sEl = tools.querySelector("[data-speed]");
  const hEl = tools.querySelector("[data-story]");
  const fEl = tools.querySelector("[data-floor]");
  if (qEl) qEl.textContent = Math.round(v.q) + " L/min";
  if (sEl) sEl.textContent = v.pumpPct + "%";
  if (hEl) hEl.textContent = v.story.toFixed(1) + " m";
  if (fEl) fEl.textContent = v.watch + " 层";
  const qIn = tools.querySelector('[data-act="flow"]');
  const sIn = tools.querySelector('[data-act="speed"]');
  const hIn = tools.querySelector('[data-act="story"]');
  const fIn = tools.querySelector('[data-act="floor"]');
  if (qIn && document.activeElement !== qIn) qIn.value = String(state.flowTaps);
  if (sIn && document.activeElement !== sIn) sIn.value = String(state.pumpPct);
  if (hIn && document.activeElement !== hIn) hIn.value = String(state.storyM);
  if (fIn && document.activeElement !== fIn) fIn.value = String(state.watch);
  const modeBtn = tools.querySelector('[data-act="mode"]');
  if (modeBtn) {
    modeBtn.textContent = v.gravity ? "重力水箱" : "加压泵";
    modeBtn.setAttribute("aria-pressed", v.gravity ? "true" : "false");
  }
  stage.setAttribute("aria-valuetext", text);
}

function meterPositions() {
  return TAP_FLOORS.map((n) => ({ x: TAP_X - 22, y: RISER_Y + 6, z: floorZ(n) + 5.9 }));
}

function draw(dt, calm) {
  const v = view();
  openShown = follow(openShown, v.tapOpen ? 1 : 0, dt, 0.12, calm);
  levelShown = follow(levelShown, v.tank, dt, 0.3, calm);
  const pace = v.q > 0 ? Math.min(1, v.flow / v.q) : 0;
  const flowRate = calm ? 0 : pace;
  phase = (phase + dt * (0.15 + flowRate * 0.9)) % 1;
  spin += dt * (v.running ? 1.2 + v.speed * 8 : 0.15) * (calm ? 0 : 1);

  waterEl.innerHTML = waterline(P, levelShown);
  floatEl.innerHTML = floatAt(P, levelShown);
  cartridgeEl.innerHTML = cartridgeAt(P, openShown);
  flowEl.innerHTML = flowDashes(P, phase, pace, v.gravity) + branchDashes(P, phase, pace);
  needlesEl.innerHTML = meterPositions().map((m, i) => needle(P, m.x, m.y, m.z, spin + i)).join("");
  ticksEl.innerHTML = PUMPS.map((pump, i) => pumpTick(P, pump.x, pump.y, 8.2, spin * (0.9 + i * 0.08) + i)).join("");

  const key = `${v.mode}|${v.pumpPct}|${v.taps}|${v.story.toFixed(2)}|${v.mainOpen}|${v.pumpOpen}|${v.tapOpen}`;
  if (pose.key !== key) {
    columnEl.innerHTML = pressureColumn(P, state);
    if (!pose.zones) zonesEl.innerHTML = zoneTags(P);
    pose.zones = true;
    pose.key = key;
  }
  say(v);
  return true;
}

function tourAt(t) {
  const u = ((t % 24) + 24) % 24;
  if (u < 6) return { flowTaps: 2 + (u / 6) * 8, pumpPct: 80, mode: "pump" };
  if (u < 10) return { flowTaps: 10, pumpPct: 80 - ((u - 6) / 4) * 70, mode: "pump" };
  if (u < 14) return { flowTaps: 6, pumpPct: 90, mode: "pump" };
  if (u < 20) return { flowTaps: 4, pumpPct: 40, mode: "gravity" };
  return { flowTaps: 6, pumpPct: 80, mode: "pump" };
}

function applyTour() {
  const cmd = tourAt(clock);
  state = { ...state, flowTaps: cmd.flowTaps, pumpPct: cmd.pumpPct, mode: cmd.mode, mainOpen: true, pumpOpen: true, tapOpen: true };
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (touring && !still.matches) {
    clock += dt;
    applyTour();
  }
  draw(dt, still.matches);
  frame = visible ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

const wake = () => {
  touring = false;
  tourEnabled = false;
  const tourBtn = tools.querySelector('[data-act="tour"]');
  if (tourBtn) tourBtn.setAttribute("aria-pressed", "false");
  run();
};

function dragKind(clientX, clientY) {
  const box = svg.getBoundingClientRect();
  const x = (clientX - box.left) / box.width;
  const y = (clientY - box.top) / box.height;
  if (y > 0.72) return "flow";
  if (x < 0.42) return "speed";
  if (y < 0.28) return "story";
  return "floor";
}

function applyDrag(kind, clientX, clientY) {
  const box = svg.getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (clientX - box.left) / box.width));
  const y = Math.min(1, Math.max(0, (clientY - box.top) / box.height));
  if (kind === "flow") state = { ...state, flowTaps: x * TAPS_MAX };
  else if (kind === "speed") state = { ...state, pumpPct: (1 - y) * 100 };
  else if (kind === "story") state = { ...state, storyM: STORY_MIN + x * (STORY_MAX - STORY_MIN) };
  else state = { ...state, watch: 1 + (1 - y) * (FLOORS - 1) };
}

stage.addEventListener("pointerdown", (event) => {
  const act = event.target.closest("[data-act]")?.dataset.act;
  stage.focus({ preventScroll: true });
  wake();
  if (act === "main") {
    state = { ...state, mainOpen: !state.mainOpen };
    run();
    return;
  }
  if (act === "pump") {
    state = { ...state, pumpOpen: !state.pumpOpen };
    run();
    return;
  }
  if (act === "tap") {
    state = { ...state, tapOpen: !state.tapOpen };
    run();
    return;
  }
  dragging = dragKind(event.clientX, event.clientY);
  applyDrag(dragging, event.clientX, event.clientY);
  stage.setPointerCapture?.(event.pointerId);
  run();
});
stage.addEventListener("pointermove", (event) => {
  if (!dragging) return;
  applyDrag(dragging, event.clientX, event.clientY);
  run();
});
const endDrag = () => { dragging = null; };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (key === "g" || key === "G") {
    event.preventDefault();
    wake();
    state = { ...state, mode: state.mode === "gravity" ? "pump" : "gravity" };
  } else if (key === "ArrowRight") {
    event.preventDefault();
    wake();
    state = { ...state, flowTaps: state.flowTaps + 1 };
  } else if (key === "ArrowLeft") {
    event.preventDefault();
    wake();
    state = { ...state, flowTaps: state.flowTaps - 1 };
  } else if (key === "ArrowUp") {
    event.preventDefault();
    wake();
    state = { ...state, pumpPct: state.pumpPct + 5 };
  } else if (key === "ArrowDown") {
    event.preventDefault();
    wake();
    state = { ...state, pumpPct: state.pumpPct - 5 };
  } else if (key === "[" ) {
    event.preventDefault();
    wake();
    state = { ...state, watch: state.watch - 1 };
  } else if (key === "]") {
    event.preventDefault();
    wake();
    state = { ...state, watch: state.watch + 1 };
  } else if (key === "t" || key === "T") {
    event.preventDefault();
    wake();
    state = { ...state, tapOpen: !state.tapOpen };
  } else return;
  run();
});

tools.addEventListener("pointerdown", (event) => event.stopPropagation());
tools.addEventListener("input", (event) => {
  const act = event.target.closest("[data-act]")?.dataset.act;
  wake();
  if (act === "flow") state = { ...state, flowTaps: Number(event.target.value) };
  else if (act === "speed") state = { ...state, pumpPct: Number(event.target.value) };
  else if (act === "story") state = { ...state, storyM: Number(event.target.value) };
  else if (act === "floor") state = { ...state, watch: Number(event.target.value) };
  run();
});
tools.addEventListener("click", (event) => {
  const act = event.target.closest("[data-act]")?.dataset.act;
  if (act === "mode") {
    wake();
    state = { ...state, mode: state.mode === "gravity" ? "pump" : "gravity" };
    run();
  } else if (act === "tour") {
    tourEnabled = !tourEnabled;
    touring = tourEnabled && !still.matches;
    event.target.closest("button").setAttribute("aria-pressed", String(tourEnabled));
    if (touring) {
      clock = 0;
      run();
    }
  } else if (act === "theme") {
    const next = document.body.dataset.theme === "dark" ? "light" : "dark";
    document.body.dataset.theme = next;
    event.target.textContent = next === "dark" ? "浅色" : "深色";
  }
});

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

// Thumbnails and a plain open stay on the default 48 L/min. The tour starts from the button, or from ?demo=1.
if (new URLSearchParams(location.search).get("demo") === "1" && !still.matches) {
  touring = true;
  tourEnabled = true;
  clock = 0;
  const b = tools.querySelector('[data-act="tour"]');
  if (b) b.setAttribute("aria-pressed", "true");
}

window.__bw = {
  get state() { return { ...state }; },
  get view() { return view(); },
  get text() { return readout(view()); },
};

draw(1 / 60, true);
run();
</script></body></html>
