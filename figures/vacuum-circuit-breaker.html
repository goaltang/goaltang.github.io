.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;

  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

.dc-stage{
  --dc-page:#0c1016;--dc-panel:rgba(11,15,21,.92);--dc-text:#f2f5f8;--dc-muted:#8d9aa9;
  --dc-rule:rgba(255,255,255,.13);--dc-accent:#ffe56b;--dc-hint:#3ddc97;--dc-shadow:rgba(0,0,0,.55);
  position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--dc-page);color:var(--dc-text);
  font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei","Source Han Sans SC","Microsoft YaHei",sans-serif;
}
.dc-stage::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 80% at 60% 30%,rgba(46,62,80,.30),transparent 64%),
  radial-gradient(70% 55% at 22% 84%,rgba(26,42,38,.34),transparent 70%);pointer-events:none}
.dc-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dc-svg text{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei","Source Han Sans SC",sans-serif}
body[data-theme="light"] .dc-stage{
  --dc-page:#f1eee7;--dc-panel:rgba(250,248,243,.94);--dc-text:#1b1d1f;--dc-muted:#63666a;
  --dc-rule:rgba(27,29,31,.14);--dc-accent:#a87400;--dc-hint:#1f8a5b;--dc-shadow:rgba(40,30,12,.18);
  background:var(--dc-page);
}
body[data-theme="light"] .dc-stage::before{background:
  radial-gradient(120% 80% at 60% 30%,rgba(190,181,160,.30),transparent 64%),
  radial-gradient(70% 55% at 22% 84%,rgba(160,176,160,.20),transparent 70%)}
.dc-top{position:absolute;left:0;right:0;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;
  padding:0 54px;border-bottom:1px solid var(--dc-rule);background:linear-gradient(180deg,rgba(12,16,22,.92),rgba(12,16,22,.35),transparent);z-index:4}
body[data-theme="light"] .dc-top{background:linear-gradient(180deg,rgba(241,238,231,.96),rgba(241,238,231,.4),transparent)}
.dc-brand{display:flex;align-items:baseline;gap:18px}
.dc-brand b{font-size:23px;font-weight:650;letter-spacing:.08em}
.dc-brand span{font-size:14px;letter-spacing:.22em;color:var(--dc-muted)}
.dc-topright{display:flex;align-items:center;gap:18px}
.dc-hint{font-size:14px;letter-spacing:.08em;color:var(--dc-muted)}
.dc-tool{min-width:34px;height:34px;border-radius:17px;border:1px solid var(--dc-rule);background:transparent;color:var(--dc-text);
  display:grid;place-items:center;cursor:pointer;font-size:13px;line-height:1;padding:0 12px;font-family:inherit}
.dc-tool:hover{border-color:var(--dc-accent)}
.dc-tool:focus-visible{outline:2px solid var(--dc-accent);outline-offset:2px}
.dc-theme i{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
body[data-theme="light"] .dc-theme i{background:currentColor}
.dc-bottom{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:flex-end;justify-content:space-between;
  gap:36px;padding:16px 54px 14px;border-top:1px solid var(--dc-rule);
  background:linear-gradient(0deg,rgba(10,14,20,.95),rgba(10,14,20,.62) 62%,transparent);z-index:4}
body[data-theme="light"] .dc-bottom{background:linear-gradient(0deg,rgba(241,238,231,.97),rgba(241,238,231,.7) 62%,transparent)}
.dc-left{min-width:0}
.dc-steps{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.dc-step{width:28px;height:22px;border:1px solid var(--dc-rule);border-radius:4px;background:transparent;color:var(--dc-muted);
  font-size:13px;line-height:1;cursor:pointer;padding:0;font-family:inherit}
.dc-step[data-on="1"]{border-color:var(--dc-accent);color:var(--dc-page);background:var(--dc-accent);font-weight:700}
.dc-step:hover{border-color:var(--dc-accent);color:var(--dc-accent)}
.dc-step[data-on="1"]:hover{color:var(--dc-page)}
.dc-note{font-size:22px;line-height:1.35;letter-spacing:.02em;color:var(--dc-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1210px}
.dc-readout{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5;
  letter-spacing:.04em;color:var(--dc-muted);text-align:right;white-space:nowrap;padding-bottom:2px}
.dc-progress{position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--dc-rule);overflow:hidden}
.dc-progress i{display:block;height:100%;width:0;background:var(--dc-accent)}
.dc-progress b{position:absolute;top:0;width:1px;height:100%;background:var(--dc-rule)}
.dc-progress b[data-on="1"]{background:var(--dc-accent)}
.dc-callout-bg{fill:var(--dc-panel);stroke:var(--dc-rule);stroke-width:1}
.dc-callout-rule{stroke:var(--dc-accent);stroke-width:3;fill:none;stroke-linecap:round}
.dc-callout{fill:var(--dc-text);color:var(--dc-text);font-size:28px;font-weight:600;letter-spacing:.05em}
.dc-leader{stroke:var(--dc-text);stroke-width:1.4;opacity:.7;fill:none}
.dc-leader-dot{fill:var(--dc-accent);stroke:var(--dc-page);stroke-width:1.2}
.dc-labels{position:absolute;inset:0;pointer-events:none;z-index:3}
.dc-label{position:absolute;height:50px;box-sizing:border-box;display:flex;align-items:center;
  padding:0 16px 0 20px;background:var(--dc-panel);border:1px solid var(--dc-rule);border-radius:7px;
  font-size:28px;font-weight:600;letter-spacing:.05em;color:var(--dc-text);white-space:nowrap;
  box-shadow:0 2px 10px rgba(0,0,0,.16)}
.dc-label::before{content:"";position:absolute;left:-1px;top:7px;width:3px;height:36px;border-radius:2px;background:var(--dc-accent)}
.dc-title-html{position:absolute;left:88px;top:140px;z-index:3;pointer-events:none}
.dc-title-html i{display:block;width:58px;height:3px;border-radius:2px;background:var(--dc-accent);margin-bottom:7px}
.dc-title-html b{display:block;font-size:48px;font-weight:700;letter-spacing:.08em;line-height:1.15}
.dc-title-html span{display:block;margin-top:5px;font-size:20px;letter-spacing:.24em;color:var(--dc-muted)}
.dc-title{fill:var(--dc-text);color:var(--dc-text);font-size:48px;font-weight:700;letter-spacing:.08em}
.dc-titlesub{fill:var(--dc-muted);color:var(--dc-muted);font-size:20px;letter-spacing:.24em}
.dc-title-rule{stroke:var(--dc-accent);stroke-width:3.4;fill:none;stroke-linecap:round}
.dc-vidtitle,.dc-sub{display:none}
.dc-stage.dc-video{background:#0c1016}
.dc-stage.dc-video::before{display:none}
.dc-stage.dc-video .dc-brand,
.dc-stage.dc-video .dc-topright,
.dc-stage.dc-video .dc-steps,
.dc-stage.dc-video .dc-note,
.dc-stage.dc-video .dc-readout,
.dc-stage.dc-video .dc-progress,
.dc-stage.dc-video .dc-tool,
.dc-stage.dc-video .dc-titlebar{display:none!important}
.dc-stage.dc-video .dc-top{height:84px;padding:0 48px;background:#0c1016;border-bottom:1px solid rgba(255,255,255,.14)}
.dc-stage.dc-video .dc-vidtitle{display:flex;align-items:center;height:84px;margin:0;
  font-size:40px;font-weight:700;letter-spacing:.08em;color:#fff;border-left:8px solid #3DDC97;padding-left:18px}
.dc-stage.dc-video .dc-bottom{height:112px;padding:0 64px;justify-content:center;align-items:center;
  background:#0c1016;border-top:1px solid rgba(255,255,255,.14)}
.dc-stage.dc-video .dc-sub{display:flex;align-items:center;justify-content:center;width:100%;margin:0;
  font-size:28px;line-height:1.35;color:#fff;text-align:center;
  font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei","Source Han Sans SC","Microsoft YaHei",sans-serif}
.iso-line.dc-cut-edge{stroke:#3DDC97;stroke-width:1.8;opacity:.95}
.dc-section-line{fill:none;stroke:#3DDC97;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.dc-cut-face{fill:rgba(61,220,151,.13)}
.dc-band{fill:none;stroke:rgba(232,241,247,.34);stroke-width:1.4}
body[data-theme="light"] .dc-band{stroke:rgba(32,44,54,.26)}
.dc-path{fill:none;stroke:var(--dc-hint);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.dc-path-glow{fill:none;stroke:var(--dc-hint);stroke-width:16;opacity:.22;stroke-linecap:round;stroke-linejoin:round}

      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;

/** 第 2 镜的放大中心（屏幕坐标）。 */

/** 动触头在给定合闸程度下的世界 z。 */

}

function clampZ(closed) {
  return CLAMP.zAtOpen + (CLAMP.zAtClosed - CLAMP.zAtOpen) * closed;
}

function beamZ(closed) {
  return BEAM.zAtOpen + (BEAM.zAtClosed - BEAM.zAtOpen) * closed;
}

function crankPin(closed) {
  // 合闸时销在上，分闸时销在下；中间转过半圈。
  const angle = Math.PI / 6 + (Math.PI / 3) * closed;
  return [CRANK.x, CRANK.y + CRANK.pinR * Math.cos(angle), CRANK.z + CRANK.pinR * Math.sin(angle)];

function springRight(spring) {
  return SPRING.x1Closed + (SPRING.x1Open - SPRING.x1Closed) * (1 - spring);

// geo.mjs — kit 的棱柱画不出来的实体：环形截面、四分之一剖的 C 形筒、
// 任意方向的连杆、端面槽口与剖切面。尺寸全部接 layout.mjs。



const TAU = Math.PI * 2;

function arcPts(cx, cy, r, a0, a1, steps = 40) {
  const out = [];
  const n = Math.max(2, steps);
  for (let i = 0; i <= n; i += 1) {
    const a = a0 + ((a1 - a0) * i) / n;
    out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return out;
}

/** 世界 XY 平面上的一圈点；角度 0 = 朝读者。 */
function faceRing(cx, cy, r, a0, a1, steps = 48) {
  const out = [];
  for (let i = 0; i <= steps; i += 1) {
    const a = a0 + ((a1 - a0) * i) / steps + Math.PI / 4;
    out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return out;
}

function prism(ring, z, h, P, style = {}) {
  if (!(h > 0) || ring.length < 3) return "";
  const paths = extrude(ring, z, h, P, { convex: style.convex ?? false, bevel: style.bevel ?? 0 });
  return solidSvg(paths, style);
}

function disc(cx, cy, r, z, h, P, style = {}, steps = 40) {
  if (!(r > 0.3) || !(h > 0)) return "";
  return solidSvg(cylinder(cx, cy, r, z, h, P, steps, style.bevel ?? 0), style);
}

/** 任意 3D 多边形压平，做剖切面、槽口和示意面。 */
function poly3(points, P, style = {}) {
  if (points.length < 3) return "";
  const d = pathOf(points.map((p) => iso(p, P)), true);
  return solidSvg({ fill: d, outline: d, crease: "", top: "", shades: [] }, { flat: true, ...style });
}

/** 只画一条不参与实体计数的平面多边形。 */
function facePath(points, P, className) {
  const d = pathOf(points.map((p) => iso(p, P)), true);
  return `<path class="${className}" d="${d}"/>`;
}

function ellipsePath(cx, cy, r, z, P, steps = 40) {
  const pts = [];
  for (let i = 0; i <= steps; i += 1) {
    const a = (i / steps) * TAU;
    pts.push(iso([cx + r * Math.cos(a), cy + r * Math.sin(a), z], P));
  }
  return pathOf(pts, true);
}

function circleLine(cx, cy, r, z, P, steps = 32) {
  return lineSvg(ellipsePath(cx, cy, r, z, P, steps), { tone: "lo" });
}

const viewDir = (P) => {
  const { sinA, cosA, sinE, cosE } = cameraOf(P);
  return [cosA * cosE, sinA * cosE, sinE];
};

const lightDir = (P) => {
  const { sinA, cosA } = cameraOf(P);
  const v = [-sinA, cosA, 1.15];
  const n = Math.hypot(...v) || 1;
  return v.map((c) => c / n);
};

function toneOf(n, P) {
  const L = lightDir(P);
  const s = n[0] * L[0] + n[1] * L[1] + n[2] * L[2];
  if (s >= 0.78) return 4;
  if (s >= 0.48) return 3;
  if (s >= 0.22) return 2;
  if (s >= -0.02) return 1;
  return 0;
}

/**
 * 空心圆筒：外壁照常，顶面是带孔的圆环，孔里露出后面的东西。
 * 画法和 A.ring 的记录一致。
 */
function ringSolid(cx, cy, rIn, rOut, z, h, P, style = {}) {
  if (!(rOut > rIn + 0.01) || !(h > 0)) return "";
  const outer = cylinder(cx, cy, rOut, z, h, P, 52);
  const topOuter = circleRing(cx, cy, rOut, 52).map(([x, y]) => iso([x, y, z + h], P));
  const topInner = circleRing(cx, cy, rIn, 52).map(([x, y]) => iso([x, y, z + h], P)).reverse();
  const top = pathOf(topOuter, true) + pathOf(topInner, true);
  // 孔口保持透空，穿过孔的导电杆才能露出来；只描一圈孔沿。
  const inner = lineSvg(ellipsePath(cx, cy, rIn, z + h, P, 52), {
    tone: "faint", className: "dc-bore-rim",
  });
  return solidSvg({ ...outer, top }, { ...style, inner });
}

/** 沿任意轴的回转体。profile 是 [s, r] 序列。 */
function solidAlong(o, axis, profile, P, style = {}, options = {}) {
  const F = frameAlong(o, axis);
  return solidSvg(solidOf(profile, F, P, options), style);
}

/** 一段圆杆：从 a 到 b。 */
function rodSvg(a, b, r, P, style = {}) {
  const dx = b[0] - a[0];
  const dy = b[1] - a[1];
  const dz = b[2] - a[2];
  const len = Math.hypot(dx, dy, dz);
  if (!(len > 0.01)) return "";
  return solidAlong(a, [dx, dy, dz], [[0, r], [len, r]], P, style, { smooth: false });
}

/** 水平面上的四边形/平面槽，只画填充和边线。 */
function flatQuad(points, P, fillClass, strokeClass) {
  const d = pathOf(points.map((p) => iso(p, P)), true);
  return `<path class="${fillClass}" d="${d}"/><path class="${strokeClass}" d="${d}"/>`;
}

/** 竖向剖切面：角度 a 处从 rIn 到 rOut 的矩形。 */
function cutFace(cx, cy, a, rIn, rOut, z0, z1, P) {
  const p = (r, z) => [cx + r * Math.cos(a), cy + r * Math.sin(a), z];
  return [p(rIn, z0), p(rOut, z0), p(rOut, z1), p(rIn, z1)];
}

/** 一个 C 形圆环的平面多边形（世界 XY），从 a0 到 a1，共 270°。 */
function cRing(cx, cy, rIn, rOut, a0, a1, steps = 56) {
  const outer = arcPts(cx, cy, rOut, a0, a1, steps);
  const inner = arcPts(cx, cy, rIn, a1, a0, steps);
  return [...outer, ...inner];
}



// dyn.mjs — 随状态改变形状的件：动触头组件、波纹管、拉杆、夹紧杆、操动连杆、
// 弹簧端板与连杆、分合指示针、软连接、导电通路、间隙示意、标注与大标题。

const esc = (text) => String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const num = (v) => (Math.round(v * 100) / 100).toString();

/** 圆角折线：Catmull-Rom 采样，避免软连接在屏幕上出现死弯。 */
function smooth3(points, per = 7) {
  if (points.length < 3) return points;
  const out = [];
  const at = (i) => points[Math.max(0, Math.min(points.length - 1, i))];
  for (let i = 0; i < points.length - 1; i += 1) {
    const p0 = at(i - 1);
    const p1 = at(i);
    const p2 = at(i + 1);
    const p3 = at(i + 2);
    const last = i === points.length - 2;
    for (let j = 0; j < (last ? per + 1 : per); j += 1) {
      const t = j / per;
      const t2 = t * t;
      const t3 = t2 * t;
      out.push([0, 1, 2].map((k) => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t
        + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2
        + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
    }
  }
  return out;
}

/** 动触头组件：法兰、动导电杆、动触头。 */
function movingProfile(closed) {
  const top = movingTop(closed);
  const bottom = top - MOVING_CONTACT_H;
  return [
    [MOVING_FLANGE_Z0, FLANGE_R],
    [MOVING_FLANGE_Z1, FLANGE_R],
    [MOVING_FLANGE_Z1, MOVING_STEM_R],
    [bottom, MOVING_STEM_R],
    [bottom, 9],
    [top, 9],
  ];
}

function movingSvg(P, closed, pole, { lit = false } = {}) {
  const profile = movingProfile(closed);
  let svg = solidAlong([pole, POLE_Y, 0], [0, 0, 1], profile, P, {
    className: `dc-moving${lit ? " dc-lit" : ""}`, tone: "mid",
  });
  // 动出线端子块：夹在法兰外缘，软连接从这里接出。
  const zc = clampZ(closed);
  svg += solidSvg(slabOf({
    x: pole + SHUNT_BLOCK.x0, y: SHUNT_BLOCK.y0, w: SHUNT_BLOCK.x1 - SHUNT_BLOCK.x0,
    d: SHUNT_BLOCK.y1 - SHUNT_BLOCK.y0, r: 1,
  }, zc - SHUNT_BLOCK.half, SHUNT_BLOCK.half * 2, P, 2, 0.5), {
    className: "dc-terminal", tone: "hi",
  });
  return svg;
}

/** 波纹管：薄壁回转体，随动触头拉伸。 */
function bellowsMeridian(closed) {
  const top = movingTop(closed) - MOVING_CONTACT_H;
  const H = Math.max(0.6, top - BELLOWS_Z0);
  const loop = [[BELLOWS_Z0, BELLOWS_RIN], [BELLOWS_Z0, BELLOWS_ROUT]];
  const waves = 4;
  for (let i = 1; i <= waves; i += 1) {
    loop.push([BELLOWS_Z0 + (H * i) / waves, i % 2 ? BELLOWS_ROUT - 1.1 : BELLOWS_ROUT]);
  }
  loop.push([top, BELLOWS_ROUT], [top, BELLOWS_RIN], [BELLOWS_Z0, BELLOWS_RIN]);
  return loop;
}

function bellowsSvg(P, closed, pole, { lit = false } = {}) {

/** 夹紧杆：沿 y 方向，从动法兰外缘伸到拉杆下面。 */

/** 拉杆：从横梁顶面到夹紧杆下方。 */

/** 横梁：三相共用的一根水平杆。 */

  return rodSvg([BEAM.x0, BEAM.y, z], [BEAM.x1, BEAM.y, z], BEAM.r, P, { className: "dc-mech dc-beambar" });

/** 曲柄臂和销。 */

  const len = Math.hypot(dy, dz) || 1;

  const a = [0, cy + (dy / len) * SHAFT.r, cz + (dz / len) * SHAFT.r];

/** 连杆：曲柄销到横梁下缘。 */

  const dx = k[0] - pin[0];
  const dy = k[1] - pin[1];
  const dz = k[2] - pin[2];
  const len = Math.hypot(dx, dy, dz) || 1;
  const start = [pin[0] + (dx / len) * 2.4, pin[1] + (dy / len) * 2.4, pin[2] + (dz / len) * 2.4];
  const reach = Math.max(0.2, len - BEAM.r);
  const top = [pin[0] + (dx / len) * reach, pin[1] + (dy / len) * reach, pin[2] + (dz / len) * reach];
  return rodSvg(start, top, 2.2, P, { className: "dc-mech" });

/** 弹簧活动端板。 */

/** 端板到主轴的短连杆。 */

/** 弹簧螺旋线（装饰，不进实体审计，也不参与 lines 检查）。 */

/** 软连接：从动出线端子块绕到灭弧室下出线端子。 */
function shuntPoints(closed, pole) {

    [x0 + 2.5, yc, zc],

    [pole + 36, -28.5, zt],
    [pole + 28, -28.5, zt],
    [pole + 28, yBack, zt],

  const boxes = [];
  const z = state.zoom;
  for (const key of state.callouts) {
    const spec = CALLOUTS[key];
    if (!spec) continue;
    const [tipX, tipY] = zoomPoint(P, spec.tip, z);
    const text = spec.text;
    const w = [...text].length * 31 + 26;
    const start = spec.anchor !== "end";
    let x = start ? tipX + spec.dx : tipX + spec.dx - w;
    x = Math.max(26, Math.min(1894 - w, x));
    let y = Math.max(148, Math.min(918, tipY + spec.dy));
    boxes.push({ key, text, w, x, y, start, tipX, tipY, spec });
  }
  boxes.sort((a, b) => a.y - b.y);
  for (let i = 0; i < boxes.length; i += 1) {
    for (let j = 0; j < i; j += 1) {
      const a = boxes[i];
      const b = boxes[j];
      const overlap = a.x < b.x + b.w + 12 && b.x < a.x + a.w + 12
        && a.y < b.y + 62 && b.y < a.y + 62;
      if (overlap) a.y = b.y + 62;
    }
    boxes[i].y = Math.min(918, Math.max(148, boxes[i].y));
  }
  return boxes;
}

/** 标签框用 HTML 画（SVG 里只留引线与端点）。 */
function labelHtml(boxes) {
  return boxes.map((box) => {
    const { text, w, x, y } = box;
    return `<div class="dc-label" style="left:${num(x)}px;top:${num(y)}px;width:${num(w)}px">${esc(text)}</div>`;
  }).join("");
}

/** 标注引线：端点画在世界坐标，框的位置由 calloutBoxes 决定。 */
function calloutSvg(P, state) {
  return calloutBoxes(P, state).map((box) => {
    const { w, x, y, start, tipX, tipY } = box;
    const edgeX = start ? x : x + w;
    const cy = y + 25;
    const d = `M${num(tipX)} ${num(tipY)}L${num(edgeX)} ${num(cy)}`;
    return `<g class="dc-callout-item">`
      + `<path class="dc-leader" d="${d}"/>`
      + `<circle class="dc-leader-dot" cx="${num(tipX)}" cy="${num(tipY)}" r="3.4"/>`
      + `</g>`;
  }).join("");
}

/** 大标题（视频模式隐藏）。 */
function titleSvg() {
  return `<g class="dc-titlebar">`
    + `<path class="dc-title-rule" d="M88 142h58"/>`
    + `<text class="dc-title" x="88" y="208">真空断路器</text>`
    + `<text class="dc-titlesub" x="90" y="246">三相 · 示意比例</text>`
    + `</g>`;
}

/** 分合指示盘刻度（静态）。 */
function dialTicksSvg(P) {
  const c = [DIAL.x, DIAL.y, DIAL.z1 + 0.04];
  let svg = "";
  for (let i = 0; i <= 10; i += 1) {
    const a = DEG * (-150 + 240 * (i / 10)) + Math.PI / 2;
    const p0 = iso([c[0] + Math.cos(a) * 7.6, c[1] + Math.sin(a) * 7.6, c[2]], P);
    const p1 = iso([c[0] + Math.cos(a) * 10.2, c[1] + Math.sin(a) * 10.2, c[2]], P);
    svg += `<path class="${i % 5 === 0 ? "dc-tick dc-tick-major" : "dc-tick"}" d="M${num(p0[0])} ${num(p0[1])}L${num(p1[0])} ${num(p1[1])}"/>`;
  }
  const rim = [];
  for (let i = 0; i <= 48; i += 1) {
    const a = (i / 48) * TAU;
    rim.push(iso([c[0] + Math.cos(a) * 10.6, c[1] + Math.sin(a) * 10.6, c[2]], P));
  }
  svg += `<path class="dc-dial-rim" d="${pathOf(rim, true)}"/>`;
  return svg;
}


// live.js — 拖动、方向键、1–5、空格、深浅色、视频模式。只在按钮或自动播放时动。
// 页面打开时是第⑤步完成后的静帧；所有绘制从 stateAt(t) 来。
const BOOT = {"P":{"origin":[967.8071949841187,689.8016796662309],"scale":2.0142857334048165,"azimuth":40,"elevation":28},"WIDTH":1920,"HEIGHT":1080,"theme":"dark","shots":[{"t0":0,"t1":7.5,"title":"整机","vo":"三相真空断路器：三相并排，每相一只真空灭弧室。电压按 12 千伏示意。"},{"t0":7.5,"t1":15.5,"title":"剖开灭弧室","vo":"剖开一只灭弧室：动触头在下，静触头在上，外围是屏蔽罩。动触头靠波纹管与外界密封。"},{"t0":15.5,"t1":24.5,"title":"合闸","vo":"合闸：动触头向上压紧静触头，电流沿导电通路通过。"},{"t0":24.5,"t1":32.5,"title":"分闸","vo":"分闸：触头拉开后产生金属蒸气电弧，电流过零时弧熄灭，真空间隙恢复绝缘。"},{"t0":32.5,"t1":40,"title":"总结","vo":"灭弧室分断，软连接把动触头接到出线端子，操动机构完成分合；比例示意，电压按 12 千伏示意。"}],"duration":40};
const P = BOOT.P;
const SHOTS = BOOT.shots || [];
const LEN = BOOT.duration || 40;
const stage = document.querySelector(".dc-stage");
const svg = stage.querySelector("svg");
const world = stage.querySelector("[data-world]");
const overlay = stage.querySelector("[data-overlay]");
const readoutEl = document.querySelector("[data-readout]");
const hintEl = document.querySelector("[data-hint]");
const progressEl = document.querySelector("[data-progress]");
const labelsEl = document.querySelector("[data-labels]");
const playBtn = document.querySelector('[data-act="play"]');
const themeBtn = document.querySelector('[data-act="theme"]');
const still = matchMedia("(prefers-reduced-motion: reduce)");

let state = stateAt(38.2);
let t = state.t;
let playing = false;
let raf = 0;
let last = 0;
let shown = "";
let drag = false;
let dragX = 0;

const clampT = (value) => Math.max(0, Math.min(LEN, value));
const fitNum = (v) => (Math.round(v * 100) / 100).toString();

// 解析成 SVG 节点再插入。Chromium 对 innerHTML 写入的 <text> 会画在
// 同组的图形之下（文字被标签框盖住）；解析器生成的节点顺序正确。
const SVG_NS = "http://www.w3.org/2000/svg";
function setSvg(el, html) {
  const doc = new DOMParser().parseFromString(
    `<svg xmlns="${SVG_NS}">${html}</svg>`, "image/svg+xml",
  );
  if (doc.querySelector("parsererror")) {
    el.innerHTML = html;
    return;
  }
  const frag = document.createDocumentFragment();
  for (const node of [...doc.documentElement.childNodes]) {
    frag.appendChild(document.importNode(node, true));
  }
  el.replaceChildren(frag);
}

function paint(view) {
  const key = [
    view.t.toFixed(3), view.closed.toFixed(4), view.spring.toFixed(4),
    view.zoom.toFixed(4), view.stepId, view.path, view.gap.toFixed(1), playing,
  ].join("|");
  if (key === shown) return;
  shown = key;

  const set = (id, html) => {
    const el = document.getElementById("dc-" + id);
    if (el) el.innerHTML = html;
  };
  POLES.forEach((pole, i) => {
    set(`moving.${i}`, movingSvg(P, view.closed, pole));
    set(`bellows.${i}`, bellowsSvg(P, view.closed, pole));
    set(`clamp.${i}`, clampSvg(P, view.closed, pole));
    set(`pull.${i}`, pullSvg(P, view.closed, pole));
    set(`shunt.${i}`, shuntSvg(P, view.closed, pole));
  });
  set("beam", beamSvg(P, view.closed));
  set("crank", crankSvg(P, view.closed));
  set("connect", connectSvg(P, view.closed));
  set("spring.moving", springPlateSvg(P, view.spring));
  set("spring.coil", springCoilSvg(P, view.spring));

  const c = zoomCenter(P);
  const z = view.zoom;
  const zoomAttr = z > 1.001
    ? ` transform="translate(${fitNum(c[0])} ${fitNum(c[1])}) scale(${fitNum(z)}) translate(${fitNum(-c[0])} ${fitNum(-c[1])})"`
    : "";
  world.setAttribute("transform", zoomAttr.replace(/^ transform="|"$/g, ""));
  if (overlay) {
    setSvg(overlay, `<g data-needle${zoomAttr}>${needleSvg(P, view.closed)}</g>`
      + `<g data-marks${zoomAttr}>${pathSvg(P, view)}${gapSvg(P, view)}</g>`
      + `<g data-callouts>${calloutSvg(P, view)}</g>`);
  }
  if (labelsEl) labelsEl.innerHTML = labelHtml(calloutBoxes(P, view));

  if (readoutEl) readoutEl.textContent = readout(view);
  if (hintEl) hintEl.textContent = hintOf(view);
  if (progressEl) progressEl.style.width = ((view.t / LEN) * 100).toFixed(2) + "%";
  stage.dataset.t = view.t.toFixed(2);
  stage.dataset.step = view.stepId;
  stage.setAttribute("aria-valuetext", readout(view));
  for (const button of stage.querySelectorAll("[data-step]")) {
    button.dataset.on = button.dataset.step === view.stepId ? "1" : "0";
  }
  const step = STEPS[view.step];
  for (const tick of stage.querySelectorAll(".dc-progress b")) {
    const at = (Number.parseFloat(tick.style.left) / 100) * LEN;
    tick.dataset.on = step && Math.abs(at - step.t0) < 0.01 ? "1" : "0";
  }
  if (playBtn) {
    playBtn.textContent = playing ? "❚❚" : "▶";
    playBtn.setAttribute("aria-label", playing ? "暂停" : "播放");
  }
  if (stage.classList.contains("dc-video")) {
    const shot = SHOTS.find((s) => view.t >= s.t0 && view.t < s.t1) || SHOTS[SHOTS.length - 1];
    const title = stage.querySelector("[data-vidtitle]");
    const sub = stage.querySelector("[data-sub]");
    if (shot && title) title.textContent = shot.title;
    if (shot && sub) sub.textContent = shot.vo;
  }
}

function setTime(value) {
  t = clampT(value);
  state = stateAt(t);
  paint(state);
}

function stop() {
  playing = false;
  if (raf) cancelAnimationFrame(raf);
  raf = 0;
  last = 0;
  paint(state);
}

function loop(now) {
  if (!playing) return;
  const dt = last ? Math.min((now - last) / 1000, 0.08) : 0;
  last = now;
  t += dt;
  if (t >= LEN) t = 0;
  state = stateAt(t);
  paint(state);
  raf = requestAnimationFrame(loop);
}

function play() {
  if (playing) return;
  playing = true;
  last = 0;
  if (t >= LEN - 0.01) t = 0;
  raf = requestAnimationFrame(loop);
  paint(state);
}

function jumpToStep(id) {
  const step = STEPS.find((s) => s.id === id);
  if (!step) return;
  stop();
  setTime(step.at);
}

function toggleTheme() {
  const next = document.body.dataset.theme === "dark" ? "light" : "dark";
  document.body.dataset.theme = next;
  document.documentElement.style.background = next === "dark" ? "#070a0e" : "#e8e4db";
  if (themeBtn) themeBtn.setAttribute("aria-label", next === "dark" ? "切换为浅色" : "切换为深色");
  shown = "";
  paint(state);
}

stage.addEventListener("pointerdown", (event) => {
  if (event.target.closest("button")) return;
  stop();
  drag = true;
  dragX = event.clientX;
  stage.focus({ preventScroll: true });
  stage.setPointerCapture?.(event.pointerId);
  stage.classList.add("dc-dragging");
});

stage.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const dx = event.clientX - dragX;
  dragX = event.clientX;
  setTime(t + dx / 32);
});

const endDrag = () => {
  drag = false;
  stage.classList.remove("dc-dragging");
};
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("pointerleave", (event) => {
  if (drag && event.buttons === 0) endDrag();
});

stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (event.target.closest("button") && (key === " " || key === "Enter")) return;
  if (key === "ArrowRight" || key === "ArrowUp") {
    event.preventDefault();
    stop();
    setTime(t + (event.shiftKey ? 2 : 0.5));
  } else if (key === "ArrowLeft" || key === "ArrowDown") {
    event.preventDefault();
    stop();
    setTime(t - (event.shiftKey ? 2 : 0.5));
  } else if (key === " " || key === "Spacebar") {
    event.preventDefault();
    playing ? stop() : play();
  } else if (key === "Home") {
    event.preventDefault();
    stop();
    setTime(0);
  } else if (key === "End") {
    event.preventDefault();
    stop();
    setTime(LEN);
  } else if (/^[1-5]$/.test(key)) {
    event.preventDefault();
    jumpToStep(STEPS[Number(key) - 1].id);
  } else if (key === "r" || key === "R") {
    event.preventDefault();
    stop();
    setTime(0);
  }
});

stage.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.step) {
    jumpToStep(button.dataset.step);
    return;
  }
  const act = button.dataset.act;
  if (act === "play") {
    playing ? stop() : play();
  } else if (act === "theme") {
    toggleTheme();
  }
});

function fit() {
  const scale = Math.min(1, innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${scale})`;
}
addEventListener("resize", fit);
fit();

const params = new URLSearchParams(location.search);
if (params.get("video") === "1") stage.classList.add("dc-video");
const initial = Number(params.get("t"));
if (params.has("t") && Number.isFinite(initial)) {
  stop();
  setTime(initial);
} else {
  paint(state);
}
if (params.get("demo") === "1" && !still.matches) {
  t = 0;
  state = stateAt(0);
  play();
}

window.__fig = {
  setState(value) {
    stop();
    setTime(value);
  },
  get duration() {
    return LEN;
  },
  getDuration: () => LEN,
  play,
  pause: stop,
};

window.__dc = {
  get state() {
    return { ...state, playing, t };
  },
  get text() {
    return readout(state);
  },
  get solids() {
    return svg.querySelectorAll(".iso-solid").length;
  },
  get t() {
    return t;
  },
  get playing() {
    return playing;
  },
  setState(value) {
    stop();
    setTime(value);
  },
  step(index) {
    jumpToStep(STEPS[index].id);
  },
  play,
  pause: stop,
  theme: toggleTheme,
};
</script></body></html>
