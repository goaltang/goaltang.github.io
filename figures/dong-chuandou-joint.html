.iso{

}

  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

.dc-stage{
  --dc-page:#0c1016;--dc-panel:rgba(11,15,21,.9);--dc-text:#f2f5f8;--dc-muted:#8d9aa9;
  --dc-rule:rgba(255,255,255,.13);--dc-accent:#ffe56b;--dc-hint:#3ddc97;--dc-shadow:rgba(0,0,0,.55);
  --dc-grain:rgba(74,45,19,.52);--dc-edge:rgba(255,236,196,.5);
  position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--dc-page);color:var(--dc-text);
  font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei","Source Han Sans SC","Microsoft YaHei",sans-serif;
}
.dc-stage::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 80% at 62% 34%,rgba(58,74,92,.28),transparent 62%),
  radial-gradient(70% 55% at 24% 82%,rgba(42,31,17,.42),transparent 70%);pointer-events:none}
.dc-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dc-svg text{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei","Source Han Sans SC",sans-serif}
body[data-theme="light"] .dc-stage{
  --dc-page:#f1eee7;--dc-panel:rgba(250,248,243,.93);--dc-text:#1b1d1f;--dc-muted:#63666a;
  --dc-rule:rgba(27,29,31,.14);--dc-accent:#b8860b;--dc-hint:#1f8a5b;--dc-shadow:rgba(40,30,12,.18);
  --dc-grain:rgba(106,72,32,.48);--dc-edge:rgba(74,47,20,.5);
  background:var(--dc-page);
}
body[data-theme="light"] .dc-stage::before{background:
  radial-gradient(120% 80% at 62% 34%,rgba(201,184,152,.32),transparent 62%),
  radial-gradient(70% 55% at 24% 82%,rgba(150,121,79,.18),transparent 70%)}
.dc-top{position:absolute;left:0;right:0;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;
  padding:0 54px;border-bottom:1px solid var(--dc-rule);background:linear-gradient(180deg,rgba(12,16,22,.92),rgba(12,16,22,.35),transparent);z-index:4}
body[data-theme="light"] .dc-top{background:linear-gradient(180deg,rgba(241,238,231,.96),rgba(241,238,231,.4),transparent)}
.dc-brand{display:flex;align-items:baseline;gap:18px}

.dc-brand span{font-size:14px;letter-spacing:.22em;color:var(--dc-muted)}
.dc-topright{display:flex;align-items:center;gap:18px}
.dc-hint{font-size:14px;letter-spacing:.08em;color:var(--dc-muted)}
.dc-tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--dc-rule);background:transparent;color:var(--dc-text);
  display:grid;place-items:center;cursor:pointer;font-size:13px;line-height:1;padding:0}
.dc-tool:hover{border-color:var(--dc-accent)}
.dc-tool:focus-visible{outline:2px solid var(--dc-accent);outline-offset:2px}

.dc-bottom{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:flex-end;justify-content:space-between;
  gap:40px;padding:16px 54px 14px;border-top:1px solid var(--dc-rule);
  background:linear-gradient(0deg,rgba(10,14,20,.95),rgba(10,14,20,.62) 62%,transparent);z-index:4}
body[data-theme="light"] .dc-bottom{background:linear-gradient(0deg,rgba(241,238,231,.97),rgba(241,238,231,.7) 62%,transparent)}
.dc-left{min-width:0}
.dc-steps{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.dc-step{width:26px;height:22px;border:1px solid var(--dc-rule);border-radius:4px;background:transparent;color:var(--dc-muted);
  font-size:13px;line-height:1;cursor:pointer;padding:0;font-family:inherit}
.dc-step[data-on="1"]{border-color:var(--dc-accent);color:var(--dc-page);background:var(--dc-accent);font-weight:700}
.dc-step:hover{border-color:var(--dc-accent);color:var(--dc-accent)}
.dc-step[data-on="1"]:hover{color:var(--dc-page)}
.dc-note{font-size:22px;line-height:1.35;letter-spacing:.02em;color:var(--dc-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1320px}
.dc-readout{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5;
  letter-spacing:.04em;color:var(--dc-muted);text-align:right;white-space:nowrap;padding-bottom:2px}
.dc-progress{position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--dc-rule);overflow:hidden}
.dc-progress i{display:block;height:100%;width:0;background:var(--dc-accent)}
.dc-progress b{position:absolute;top:0;width:1px;height:100%;background:var(--dc-rule)}
.dc-progress b[data-on="1"]{background:var(--dc-accent)}
.dc-callout-bg{fill:var(--dc-panel);stroke:var(--dc-rule);stroke-width:1}
.dc-callout{fill:var(--dc-text);font-size:30px;font-weight:600;letter-spacing:.06em}
.dc-leader{stroke:var(--dc-text);stroke-width:1.5;opacity:.82}
.dc-callout-bg + .dc-callout{}
.dc-title{fill:var(--dc-text);font-size:46px;font-weight:700;letter-spacing:.07em}
.dc-title-rule{stroke:var(--dc-accent);stroke-width:3.2;fill:none;stroke-linecap:round}
.dc-vidtitle,.dc-sub{display:none}
.dc-stage.dc-video{background:#0c1016}
.dc-stage.dc-video::before{display:none}
.dc-stage.dc-video .dc-brand,
.dc-stage.dc-video .dc-topright,
.dc-stage.dc-video .dc-steps,
.dc-stage.dc-video .dc-note,
.dc-stage.dc-video .dc-readout,
.dc-stage.dc-video .dc-progress,
.dc-stage.dc-video .dc-tool,
.dc-stage.dc-video .dc-titlebar{display:none!important}

</div><script type="module">const AZIMUTH = 45;

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

  const keepLast = rims === "all" || rims === "last" || rims === "ends";

  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");

    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];

      const dx = b[0] - a[0];
      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),

function shapeOf(meridian, P, smooth) {

    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  for (let j = 0; j < n; j++) {

    tones.push(bandOf(dot3(normal, L)));

    fills.push(d);

    fills.push(d);

function prismOf(F, polygon, s0, s1, P) {

 * 时间轴。每一步先动、后停，停住的一小段用来看清结果。
 * 7–12 穿入；15–21 卡紧；24–28 插销；32–37 打楔。
 */
function stateAt(t) {
  const time = clamp(t, 0, DEMO_LEN);

  let shift = -130;
  let pin = 0;
  let wedge = 0;

  if (time < 7) {
    shift = -130;
  } else if (time < 15) {
    shift = lerp(-130, -44, ease(window01(time, 7, 12)));
  } else if (time < 24) {
    shift = lerp(-44, 0, ease(window01(time, 15, 21)));
  } else {
    shift = 0;
  }

  if (time >= 24) pin = ease(window01(time, 24, 28));
  if (time >= 32) wedge = ease(window01(time, 32, 37));

  // 楔子打紧时把榫头往下压一点点，不动 x：粗截面已经卡住，不能再往里走。
  const seat = wedge * 0.8;

  const station = STEPS.findIndex((s) => time < s.t1);
  const index = station < 0 ? STEPS.length - 1 : station;
  const step = STEPS[index];
  const phase = clamp((time - step.t0) / Math.max(1e-6, step.t1 - step.t0), 0, 1);

  return {
    t: time,
    stepId: step.id,
    station: index,
    phase,
    beamShift: shift,
    pin,
    wedge,
    seat,
    focus: step.id,
    callout: step.callout,
  };
}

/** 打开页面时的静帧：第⑤步完成，楔子已经打紧。 */
function posterState() {
  const s = stateAt(38.2);
  return { ...s, poster: true };
}

function pictureTitle(s) {
  const step = stepOf(s.stepId);
  return step ? `${step.mark} ${step.title}` : "";
}

function hintOf(s) {
  const step = stepOf(s.stepId);
  return step ? step.note : "";
}

function calloutOf(s) {
  const step = stepOf(s.stepId);
  return step ? step.callout : "";
}

function readout(s) {
  const inserted = s.pin > 0.92;
  const wedged = s.wedge > 0.92;
  if (s.stepId === "mortise") return "卯口 贯通 · 穿枋 未入 · 示意比例";
  if (s.stepId === "tenon") {
    const out = tenonTipAt(s.beamShift) > COL_R + 2;
    if (out) return "榫头 已穿出 · 销 未插 · 楔 未打 · 示意比例";
    const pct = Math.round(clamp((s.beamShift + 130) / 86, 0, 1) * 100);
    return `榫头 穿入中 ${pct}% · 示意比例`;
  }
  if (s.stepId === "taper") return "榫头 已穿出 · 粗端 已卡紧 · 销 未插 · 示意比例";
  if (s.stepId === "pin") {
    return inserted
      ? "销 已插 · 楔 未打 · 榫头 锁定 · 示意比例"
      : `销 插入中 ${Math.round(s.pin * 100)}% · 示意比例`;
  }
  return wedged
    ? "销 已插 · 楔 已紧 · 节点 锁定 · 示意比例"
    : `楔 打入中 ${Math.round(s.wedge * 100)}% · 示意比例`;
}

/** 给检查用：这一秒应当看到的关键状态。 */
function expectAt(t) {
  const s = stateAt(t);
  return {
    ...s,
    bodyFront: bodyFrontAt(s.beamShift),
    tenonTip: tenonTipAt(s.beamShift),
    tenonOut: tenonTipAt(s.beamShift) > COL_R + 2,
    pinSeated: s.pin > 0.92,
    wedgeSeated: s.wedge > 0.92,
    wedgeTipX: WEDGE_X_BACK + WEDGE_TRAVEL - WEDGE_LEN - WEDGE_TRAVEL * s.wedge,
    wedgeBackX: WEDGE_X_BACK + WEDGE_TRAVEL - WEDGE_TRAVEL * s.wedge,
    mouthExitH: mouthHeightAt(COL_R),
    mouthExitW: mouthWidthAt(COL_R),
    mouthTopExit: mouthTopAt(COL_R),
    tenonTop: TENON_Z1,
    gapAtExit: mouthTopAt(COL_R) - TENON_Z1,
    wedgeThickness: WEDGE_H,
    pinX: PIN_X,
    beamZ: BEAM_Z,
    jam: jamX(),
  };
}

// geo.mjs — kit 的棱柱画不出来的实体：半圆截面、任意平面多边形、
// 沿 y 挤出的楔子与羊角、横置圆檩、竖向锥销。所有尺寸接 layout.mjs。



function arcPts(cx, cy, r, a0, a1, steps = 40) {
  const out = [];
  const n = Math.max(2, steps);
  for (let i = 0; i <= n; i++) {
    const a = a0 + ((a1 - a0) * i) / n;
    out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return out;
}

/** 远半圆：y≤0，弦在 y=0。半圆柱和剖口远半都用它。 */
const farHalf = (cx, cy, r, steps = 44) => arcPts(cx, cy, r, Math.PI, Math.PI * 2, steps);

/** 近半圆：y≥0，用来切下段柱顶露出的半圆台面。 */
const nearHalf = (cx, cy, r, steps = 44) => arcPts(cx, cy, r, 0, Math.PI, steps);

function prism(ring, z, h, P, style = {}) {
  if (!(h > 0) || ring.length < 3) return "";
  const paths = extrude(ring, z, h, P, { convex: style.convex ?? false, bevel: style.bevel ?? 0 });
  return solidSvg(paths, style);
}

function disc(cx, cy, r, z, h, P, style = {}, steps = 40) {
  if (!(r > 0.3) || !(h > 0)) return "";
  return solidSvg(cylinder(cx, cy, r, z, h, P, steps, style.bevel ?? 0), style);
}

/** 任意 3D 多边形，压成一个平的“实体”。剖切面、卯口内腔、销孔都用它。 */
function poly3(points, P, style = {}) {
  if (points.length < 3) return "";
  const d = pathOf(points.map((p) => iso(p, P)), true);
  return solidSvg({ fill: d, outline: d, crease: "", top: "", shades: [] }, { flat: true, ...style });
}

/** 水平面上的圆/椭圆，只画线，用来做销孔口和木纹。 */
function ellipsePath(cx, cy, r, z, P, steps = 40) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * Math.PI * 2;
    pts.push(iso([cx + r * Math.cos(a), cy + r * Math.sin(a), z], P));
  }
  return pathOf(pts, true);
}

const viewDir = (P) => {
  const { sinA, cosA, sinE, cosE } = cameraOf(P);
  return [cosA * cosE, sinA * cosE, sinE];
};

const lightDir = (P) => {
  const { sinA, cosA } = cameraOf(P);
  const v = [-sinA, cosA, 1.15];
  const n = Math.hypot(...v) || 1;
  return v.map((c) => c / n);
};

function toneOf(n, P) {
  const L = lightDir(P);
  const s = n[0] * L[0] + n[1] * L[1] + n[2] * L[2];
  if (s >= 0.78) return 4;
  if (s >= 0.48) return 3;
  if (s >= 0.22) return 2;
  if (s >= -0.02) return 1;
  return 0;
}

const signedAreaXZ = (poly) => {
  let a = 0;
  for (let i = 0; i < poly.length; i++) {
    const [x0, z0] = poly[i];
    const [x1, z1] = poly[(i + 1) % poly.length];
    a += x0 * z1 - x1 * z0;
  }
  return a / 2;
};

/**
 * 截面在 x-z 平面里的棱柱，沿 y 从 y0 挤到 y1。
 * 木楔、羊角都用它；可见侧面按法向分四档明暗，近端面用浅木色。
 */
function prismXZ(poly, y0, y1, P, style = {}) {
  if (poly.length < 3 || Math.abs(y1 - y0) < 0.01) return "";
  const V = viewDir(P);
  const ccw = signedAreaXZ(poly) > 0;
  const faces = [];
  for (let i = 0; i < poly.length; i++) {
    const [ax, az] = poly[i];
    const [bx, bz] = poly[(i + 1) % poly.length];
    const dx = bx - ax;
    const dz = bz - az;
    const len = Math.hypot(dx, dz) || 1;
    const n = ccw ? [dz / len, 0, -dx / len] : [-dz / len, 0, dx / len];
    if (n[0] * V[0] + n[2] * V[2] <= 0.02) continue;
    const quad = [[ax, y0, az], [bx, y0, bz], [bx, y1, bz], [ax, y1, az]];
    const tone = toneOf(n, P);
    const shade = tone >= 4 ? `<path class="iso-top" d="${pathOf(quad.map((q) => iso(q, P)), true)}"/>` : `<path class="iso-shade" data-shade="${tone}" d="${pathOf(quad.map((q) => iso(q, P)), true)}"/>`;
    faces.push({ depth: (ax + bx) / 2, shade });
  }
  faces.sort((a, b) => a.depth - b.depth);
  const capPts = poly.map(([x, z]) => iso([x, y1, z], P));
  const cap = pathOf(capPts, true);
  const all = [...poly.map(([x, z]) => iso([x, y0, z], P)), ...capPts];
  const hull = pathOf(hullOf(all), true);
  const inner = faces.map((f) => f.shade).join("")
    + `<path class="iso-top" d="${cap}"/>`
    + `<path class="iso-line iso-crease" data-tone="faint" d="${cap}"/>`;
  return solidSvg({ fill: hull, outline: hull, crease: "", top: "", shades: [] }, { inner, ...style });
}

/** 沿任意轴的回转体。profile 是 [s, r] 序列。 */
function solidAlong(o, axis, profile, P, style = {}, options = {}) {
  const F = frameAlong(o, axis);
  return solidSvg(solidOf(profile, F, P, options), style);
}

/** 一个短圆柱线，做销孔边或小圆点。 */
function circleLine(cx, cy, r, z, P, steps = 28) {
  return lineSvg(ellipsePath(cx, cy, r, z, P, steps), { tone: "lo" });
}

// dyn.mjs — 随状态改变形状的件：穿枋（含剖口内的半剖）、销孔、羊角销、木楔、
// 强调线、大标题与标注。所有位置从 model.stateAt(t) 来。





const dL = (d, style) => (d ? lineSvg(d, style) : "");
const dAt = (P, x, y, z) => iso([x, y, z], P);

function dEsc(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function exposedAt(x, y) {
  if (x <= -COL_R + 0.15 || x >= COL_R - 0.15) return true;
  if (x * x + y * y >= COL_R * COL_R - 4) return true;
  const a = Math.atan2(y, x);
  return a >= CUT_A0 && a <= CUT_A1;
}

function yRuns(x, y0, y1) {
  const n = 8;
  const runs = [];
  let run = null;
  for (let i = 0; i <= n; i++) {
    const y = y0 + ((y1 - y0) * i) / n;
    if (exposedAt(x, y)) {
      if (!run) run = [y, y];
      else run[1] = y;
    } else if (run) {
      runs.push(run);
      run = null;
    }
  }
  if (run) runs.push(run);
  return runs.filter((r) => r[1] - r[0] > 0.7);
}

/** 柱外整段；柱内只留下四分之一剖口里露出来的那一块。 */
function spanPiece(x0, x1, y0, y1, z0, z1, P, className) {
  if (!(x1 - x0 > 0.08)) return "";
  let svg = "";
  const left = Math.min(x1, -COL_R);
  if (left - x0 > 0.08) svg += fullPiece(x0, left, y0, y1, z0, z1, P, className);
  const right = Math.max(x0, COL_R);
  if (x1 - right > 0.08) svg += fullPiece(right, x1, y0, y1, z0, z1, P, className);
  const a = Math.max(x0, -COL_R);
  const b = Math.min(x1, COL_R);
  if (b - a > 0.4) {
    const cuts = 4;
    for (let i = 0; i < cuts; i++) {
      const xA = a + ((b - a) * i) / cuts;
      const xB = a + ((b - a) * (i + 1)) / cuts;
      for (const [ya, yb] of yRuns((xA + xB) / 2, y0, y1)) {
        svg += fullPiece(xA, xB, ya, yb, z0, z1, P, className, 0.15);
      }
    }
  }
  return svg;
}

function fullPiece(x0, x1, y0, y1, z0, z1, P, className, bevel = 0.45) {
  if (!(x1 - x0 > 0.06) || !(y1 - y0 > 0.06) || !(z1 - z0 > 0.06)) return "";
  return solidSvg(slabOf({ x: x0, y: y0, w: x1 - x0, d: y1 - y0, r: 0.6 }, z0, z1 - z0, P, 2, bevel), {
    tone: "hi", className,
  });
}

function beamSvg(P, view) {
  const shift = view.beamShift || 0;
  const seat = view.seat || 0;
  const dz = -seat;
  const bodyX0 = BODY_BACK + shift;
  const bodyX1 = STEP_X + shift;
  const tenX0 = STEP_X + shift;
  const tenX1 = TENON_TIP + shift;
  const bw = BODY_W / 2;
  const tw = TENON_W / 2;
  const bz0 = BODY_Z0 + dz;
  const bz1 = BODY_Z1 + dz;
  const tz0 = TENON_Z0 + dz;
  const tz1 = TENON_Z1 + dz;
  const lit = view.stepId === "tenon" || view.stepId === "taper";
  const cls = lit ? "dc-beam dc-beam-focus" : "dc-beam";
  let svg = "";

  const bodyFullL = Math.min(bodyX1, -COL_R);
  const bodyHalf0 = Math.max(bodyX0, -COL_R);
  const bodyHalf1 = Math.min(bodyX1, COL_R);
  const tenFullL = Math.min(tenX1, -COL_R);
  const tenHalf0 = Math.max(tenX0, -COL_R);
  const tenHalf1 = Math.min(tenX1, COL_R);
  const tenFullR = Math.max(tenX0, COL_R);

  svg += spanPiece(bodyX0, bodyX1, -bw, bw, bz0, bz1, P, cls);
  svg += spanPiece(tenX0, tenX1, -tw, tw, tz0, tz1, P, cls);
  svg += poly3([[tenX1 - 0.02, -tw, tz0], [tenX1 - 0.02, tw, tz0], [tenX1 - 0.02, tw, tz1], [tenX1 - 0.02, -tw, tz1]], P, { className: "dc-beam-end", tone: "hi" });
  return svg + beamDetail(P, view, { bodyX0, bodyX1, tenX0, tenX1, bz0, bz1, tz0, tz1, cls });
}

function beamDetail(P, view, g) {
  const { bodyX0, tenX0, tenX1, bz0, bz1, tz0, tz1 } = g;
  const bw = BODY_W / 2;
  const tw = TENON_W / 2;
  const shift = view.beamShift || 0;
  const bodyFullL = Math.min(STEP_X + shift, -COL_R);
  const tenFullR = Math.max(tenX0, COL_R);
  let svg = "";
  if (bodyFullL - bodyX0 > 12) {
    for (const y of [-bw + 6, bw - 6]) {
      svg += dL(pathOf([dAt(P, bodyX0 + 1, y, bz1 + 0.12), dAt(P, bodyFullL - 1, y, bz1 + 0.12)]), { tone: "faint", className: "dc-grain" });
    }
    for (const z of [bz0 + 8, bz1 - 8]) {
      svg += dL(pathOf([dAt(P, bodyX0 + 1, bw + 0.12, z), dAt(P, bodyFullL - 1, bw + 0.12, z)]), { tone: "faint", className: "dc-grain" });
    }
  }
  if (tenX1 - tenFullR > 8) {
    svg += dL(pathOf([dAt(P, tenFullR + 1, 0, tz1 + 0.12), dAt(P, tenX1 - 2, 0, tz1 + 0.12)]), { tone: "faint", className: "dc-grain" });

  svg += solidAlong([MALLET.x, MALLET.y + 1, z + 5.4], [0, 1, 0], [
    [0, 4.4], [40, 4.2], [46, 3.4],
  ], P, { tone: "mid", className: "dc-mallet" });
  for (const x of [MALLET.x - 12, MALLET.x + 12]) {
    const ringPts = [];
    for (let i = 0; i <= 20; i++) {
      const a = (i / 20) * Math.PI * 2;
      ringPts.push(aAt(P, x, MALLET.y + Math.cos(a) * (MALLET.r - 1.4), z + MALLET.r + Math.sin(a) * (MALLET.r - 1.4)));
    }
    svg += aL(pathOf(ringPts), { tone: "faint" });
  }
  for (const chip of CHIPS) {
    svg += prism(chipRing(chip), z, 1.3, P, { tone: "mid", className: "dc-chip", convex: true });
  }
  return svg;
}

function pieces(P, view = posterState()) {
  const out = [];
  const add = (id, anchor, svg, extra = {}) => out.push({ id, anchor, layer: extra.layer ?? 5, svg, ...extra });

  add("floor", [0, -40, FLOOR_Z], floorSvg(P), { layer: 0 });
  add("plinths", [0, -40, FLOOR_TOP], plinthSvg(P), { layer: 1 });
  add("column2", [COL2_X, COL2_Y, COL2_Z1 / 2], secondColumnSvg(P), { layer: 3 });
  add("purlin", [PURLIN_X, (PURLIN_Y0 + PURLIN_Y1) / 2, PURLIN_Z], purlinSvg(P), { layer: 3.5 });
  add("column", [COL_X, COL_Y, (CUT_Z0 + CUT_Z1) / 2], columnSvg(P), { layer: 4 });
  add("sectionBack", [COL_X, CUT_Y, MORTAR_Z], sectionSvg(P, "back"), { layer: 5 });
  add("beam", [view.beamShift ?? 0, 0, 132], "", { layer: 6 });
  add("columnFront", [COL_X, COL_Y, MORTAR_Z], columnFrontSvg(P), { layer: 6.4 });
  add("sectionFront", [COL_X, CUT_Y, MORTAR_Z], sectionSvg(P, "front"), { layer: 6.6 });
  add("pin", [PIN_X, PIN_Y, 150], "", { layer: 7 });
  add("wedge", [55, WEDGE_Y, 145], "", { layer: 8 });
  add("props", [MALLET.x, MALLET.y, FLOOR_TOP], propsSvg(P), { layer: 9 });
  add("taper", [COL_X + 6, CUT_Y, 149], "", { layer: 10 });
  add("highlight", [PIN_X, PIN_Y, 150], "", { layer: 11 });
  add("title", [90, 950, 0], "", { layer: 20 });
  add("callout", [COL_X, CUT_Y, 150], "", { layer: 21 });

  const dynamic = {
    beam: () => beamSvg(P, view),
    pin: () => pinSvg(P, view),
    wedge: () => wedgeSvg(P, view),
    taper: () => taperSvg(P, view),
    highlight: () => highlightSvg(P, view),
    title: () => titleSvg(pictureTitle(view)),
    callout: () => calloutSvg(P, view),
  };
  for (const item of out) {
    if (dynamic[item.id]) item.svg = dynamic[item.id]();
    if (item.id === "beam") item.anchor = [COL_X, 0, 132];
    if (item.id === "pin") item.anchor = [PIN_X, PIN_Y, 150];
    if (item.id === "wedge") item.anchor = [55, WEDGE_Y, 145];
    if (item.id === "title") item.anchor = [90, 950, 0];
    if (item.id === "callout") item.anchor = [COL_X, CUT_Y, 150];
  }
  return out;
}

// live.js — 拖动、方向键、1–5、空格、深浅色。只在按钮或 ?demo=1 时播放。
// 页面打开时是第⑤步完成后的静帧；所有绘制从 stateAt(t) 来。
const BOOT = {"P":{"origin":[929.6207406998276,740.552715313821],"scale":1.701692316408075,"azimuth":40,"elevation":28},"WIDTH":1920,"HEIGHT":1080,"theme":"dark","shots":[{"t0":0,"t1":7,"title":"①柱与卯口","vo":"一根圆木柱，柱身开一个贯通的卯口。近侧只切去四分之一，柱子还是一整根。尺寸示意。"},{"t0":7,"t1":15,"title":"②穿枋穿入","vo":"穿枋从卯口穿进去，细的榫头先过，一直穿出柱外。"},{"t0":15,"t1":24,"title":"③越穿越紧","vo":"卯口进口略大、出口略小。粗的一端越往里，卡得越紧。斜度示意。"},{"t0":24,"t1":32,"title":"④插羊角销","vo":"羊角销从上往下穿过榫头，榫头就退不回去了。"},{"t0":32,"t1":40,"title":"⑤打入木楔","vo":"最后把木楔打进接缝，把榫头挤紧。到这里，节点锁住。所有比例均为示意。"}]};
const P = BOOT.P;
const SHOTS = BOOT.shots || [];
const stage = document.querySelector(".dc-stage");
const svg = stage.querySelector("svg");
const readoutEl = document.querySelector("[data-readout]");
const hintEl = document.querySelector("[data-hint]");
const progressEl = document.querySelector("[data-progress]");
const playBtn = document.querySelector('[data-act="play"]');
const themeBtn = document.querySelector('[data-act="theme"]');
const still = matchMedia("(prefers-reduced-motion: reduce)");

let state = stateAt(38.2);
let t = state.t;
let playing = false;
let raf = 0;
let last = 0;
let shown = "";
let drag = false;
let dragX = 0;

const node = (id) => document.getElementById("dc-" + id);
const clampT = (value) => clamp(value, 0, DEMO_LEN);

function paint(view) {
  const key = [
    view.t.toFixed(3), view.beamShift.toFixed(3), view.pin.toFixed(4),
    view.wedge.toFixed(4), view.seat.toFixed(3), view.stepId, playing,
  ].join("|");
  if (key === shown) return;
  shown = key;
  const set = (id, html) => {
    const el = node(id);
    if (el) el.innerHTML = html;
  };
  set("beam", beamSvg(P, view));
  set("pin", pinSvg(P, view));
  set("wedge", wedgeSvg(P, view));
  set("taper", taperSvg(P, view));
  set("highlight", highlightSvg(P, view));
  set("title", titleSvg(pictureTitle(view)));
  set("callout", calloutSvg(P, view));
  if (readoutEl) readoutEl.textContent = readout(view);
  if (hintEl) hintEl.textContent = hintOf(view);
  if (progressEl) progressEl.style.width = ((view.t / DEMO_LEN) * 100).toFixed(2) + "%";
  stage.dataset.t = view.t.toFixed(2);
  stage.dataset.step = view.stepId;
  stage.setAttribute("aria-valuetext", readout(view));
  for (const button of stage.querySelectorAll("[data-step]")) {
    button.dataset.on = button.dataset.step === view.stepId ? "1" : "0";
  }
  const step = STEPS[view.station];
  for (const tick of stage.querySelectorAll(".dc-progress b")) {
    const at = Number.parseFloat(tick.style.left) / 100 * DEMO_LEN;
    tick.dataset.on = step && Math.abs(at - step.t0) < 0.01 ? "1" : "0";
  }
  if (playBtn) {
    playBtn.textContent = playing ? "❚❚" : "▶";
    playBtn.setAttribute("aria-label", playing ? "暂停" : "播放");
  }
  if (stage.classList.contains("dc-video")) {
    const shot = SHOTS.find((s) => view.t >= s.t0 && view.t < s.t1) || SHOTS[SHOTS.length - 1];
    const title = stage.querySelector("[data-vidtitle]");
    const sub = stage.querySelector("[data-sub]");
    if (shot && title) title.textContent = shot.title;
    if (shot && sub) sub.textContent = shot.vo;
  }
}

function setTime(value) {
  t = clampT(value);
  state = stateAt(t);
  paint(state);
}

function stop() {
  playing = false;
  if (raf) cancelAnimationFrame(raf);
  raf = 0;
  last = 0;
  paint(state);
}

function loop(now) {
  if (!playing) return;
  const dt = last ? Math.min((now - last) / 1000, 0.08) : 0;
  last = now;
  t += dt;
  if (t >= DEMO_LEN) t = 0;
  state = stateAt(t);
  paint(state);
  raf = requestAnimationFrame(loop);
}

function play() {
  if (playing) return;
  playing = true;
  last = 0;
  if (t >= DEMO_LEN - 0.01) t = 0;
  raf = requestAnimationFrame(loop);
  paint(state);
}

function jumpToStep(id) {
  const step = STEPS.find((s) => s.id === id);
  if (!step) return;
  stop();
  setTime(step.t1 - 0.35);
}

function toggleTheme() {
  const next = document.body.dataset.theme === "dark" ? "light" : "dark";
  document.body.dataset.theme = next;
  document.documentElement.style.background = next === "dark" ? "#070a0e" : "#e8e4db";
  if (themeBtn) themeBtn.setAttribute("aria-label", next === "dark" ? "切换为浅色" : "切换为深色");
}

stage.addEventListener("pointerdown", (event) => {
  if (event.target.closest("button")) return;
  stop();
  drag = true;
  dragX = event.clientX;
  stage.focus({ preventScroll: true });
  stage.setPointerCapture?.(event.pointerId);
  stage.classList.add("dc-dragging");
});

stage.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const dx = event.clientX - dragX;
  dragX = event.clientX;
  setTime(t + dx / 32);
});

const endDrag = () => {
  drag = false;
  stage.classList.remove("dc-dragging");
};
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("pointerleave", (event) => {
  if (drag && event.buttons === 0) endDrag();
});

stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (event.target.closest("button") && (key === " " || key === "Enter")) return;
  if (key === "ArrowRight" || key === "ArrowUp") {
    event.preventDefault();
    stop();
    setTime(t + (event.shiftKey ? 2 : 0.5));
  } else if (key === "ArrowLeft" || key === "ArrowDown") {
    event.preventDefault();
    stop();
    setTime(t - (event.shiftKey ? 2 : 0.5));
  } else if (key === " " || key === "Spacebar") {
    event.preventDefault();
    playing ? stop() : play();
  } else if (key === "Home") {
    event.preventDefault();
    stop();
    setTime(0);
  } else if (key === "End") {
    event.preventDefault();
    stop();
    setTime(DEMO_LEN);
  } else if (/^[1-5]$/.test(key)) {
    event.preventDefault();
    jumpToStep(STEPS[Number(key) - 1].id);
  } else if (key === "r" || key === "R") {
    event.preventDefault();
    stop();
    setTime(0);
  }
});

stage.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.step) {
    jumpToStep(button.dataset.step);
    return;
  }
  const act = button.dataset.act;
  if (act === "play") {
    playing ? stop() : play();
  } else if (act === "theme") {
    toggleTheme();
  }
});

function fit() {
  const scale = Math.min(1, innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${scale})`;
}
addEventListener("resize", fit);
fit();

const params = new URLSearchParams(location.search);
if (params.get("video") === "1") stage.classList.add("dc-video");
const initial = Number(params.get("t"));
if (params.has("t") && Number.isFinite(initial)) {
  stop();
  setTime(initial);
} else {
  paint(state);
}
if (params.get("demo") === "1" && !still.matches) {
  t = 0;
  state = stateAt(0);
  play();
}

window.__fig = {
  setState(value) {
    stop();
    setTime(value);
  },
  get duration() {
    return DEMO_LEN;
  },
  getDuration: () => DEMO_LEN,
  play,
  pause: stop,
};

window.__dc = {
  get state() {
    return { ...state, playing, t };
  },
  get text() {
    return readout(state);
  },
  get solids() {
    return svg.querySelectorAll(".iso-solid").length;
  },
  get t() {
    return t;
  },
  get playing() {
    return playing;
  },
  setState(value) {
    stop();
    setTime(value);
  },
  step(index) {
    jumpToStep(STEPS[index].id);
  },
  play,
  pause: stop,
  theme: toggleTheme,
};
</script></body></html>
