</div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>酒花、酒路与见汽的地方</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>甑桶、甑盖、过汽管、冷凝器</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>台面、灶台、底锅与酒师工具</span></span><span class="iso-caption">示意，不是茅台酒厂的实测工艺参数。图上甑桶上口外径约 1.9 m、桶高约 1.3 m，只是常见规格的取整。酒师不看仪表，只看酒面上的酒花：上甑的规矩是「见汽压醅」，哪冒汽就把哪盖上，口诀是轻、松、薄、准、匀、平；摘酒靠「看花摘酒」，花大而整齐、消散快的是大清花，酒度高；花小一圈是小清花；花碎如米粒是碎米花；花少而散、久不消是油花，往后就是酒尾。花和酒度的对照是示意，不是实验室标定。流酒温度约 37 至 45 °C。天锅是更早的冷凝办法：一口冷水锅坐在甑口上，锅底铜盘把酒汽凝住，顺着盘面流到边上接出来。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];

}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);

            run = null;

}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;

        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

    for (const run of runsOf(facing, false))

    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));

    }
    if (height > 0) {

    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];

// model.mjs — 茅台酒甑蒸馏：纯数字，不含绘制。
// 一台固态蒸馏甑的全部读数都从这里出：底锅供汽、见汽压醅、导汽、冷凝出酒、看花摘酒。
// 所有数值均为示意，不是茅台酒厂的实测工艺参数（详见 README「示意边界」）。

const LAYERS_MAX = 6; // 甑桶装满时的酒醅层数（见汽压醅逐层铺）
const STEAM_MAX = 100; // 供汽强度，%
const T_MIN = 0;
const T_MAX = 1;

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, Number.isFinite(v) ? v : lo));

// ── 酒花对照表（示意对照，非实验室标定） ───────────────────────────────────
// 酒师不看仪表，只看酒面上酒花的形态、大小和持续时间，判断酒度、分段摘酒。
const FLOWERS = [
  { key: "da", name: "大清花", least: 65, note: "花大如黄豆，整齐，消散快" },
  { key: "xiao", name: "小清花", least: 55, note: "花小一圈，消散稍慢" },
  { key: "sui", name: "碎米花", least: 45, note: "花碎如米粒，密而小" },
  { key: "you", name: "油花", least: 35, note: "花少而散，久不消" },
  { key: "none", name: "无花", least: -1, note: "酒面平板，已是酒尾" },
];

const SEGMENTS = [
  { key: "head", name: "酒头", at: 0.04, note: "刚流酒，酒度高、气味冲，单独接" },
  { key: "new", name: "新酒", at: 0.42, note: "酒花正盛，接主体" },
  { key: "tail", name: "酒尾", at: 0.88, note: "酒度低、杂味重，接回去重蒸" },
];

/** 酒花形态由酒度读出。 */
function flowerOf(abv) {
  return FLOWERS.find((flower) => abv >= flower.least) ?? FLOWERS[FLOWERS.length - 1];
}

/** 摘酒段由蒸馏进程 t 决定。 */
function segmentOf(t) {
  if (t < 0.1) return SEGMENTS[0];
  if (t < 0.72) return SEGMENTS[1];
  return SEGMENTS[2];
}

const initial = () => ({
  steam: 0.55, // 底锅供汽强度 0..1
  layers: 3, // 已经压上的酒醅层数 0..LAYERS_MAX
  charge: 1, // 蒸汽从甑箅爬到醅面的进度 0..1；到 1 就是「见汽」
  short: 0.06, // 蒸汽短路的累积 0..1：不压醅时涨，压得及时就回落
  cool: 0.7, // 冷凝器冷却强度 0..1
  tianguo: false, // 天锅（古代冷凝）示意模式
  t: 0.42, // 蒸馏进程 0..1：开头酒度高，往后走低
  auto: false, // 是否已经动过：没动过就停在默认读数
});

/** 见汽：蒸汽已经冒出醅面。 */
const seeSteam = (state) => state.charge >= 0.999;

/** 压醅覆盖度：已压层数占满甑的比例。 */
const coverageOf = (state) => clamp(state.layers / LAYERS_MAX, 0, 1);

/** 冷却效率：天锅靠一锅静水，比现代冷凝器的流通冷却水差一档。 */
function coolingOf(state) {
  return state.tianguo ? 0.2 + 0.6 * state.cool : 0.32 + 0.68 * state.cool;
}

/**
 * 时间推进：蒸汽在酒醅里往上爬，爬到醅面就是见汽；见汽后不压，蒸汽就串成短路。
 * 只推进 charge / short —— 蒸馏进程 t 由「酒头/新酒/酒尾」三个按钮和演示来推。
 */
function advance(state, dt) {
  if (!state.auto || dt <= 0) return state;
  const steam = clamp(state.steam, 0, 1);
  const next = { ...state };
  next.charge = clamp(state.charge + (dt * steam * 1.15) / (1 + 0.22 * state.layers), 0, 1);
  // 见汽之后还没盖醅：蒸汽从醅面的孔道短路出去；盖一层就回落。
  const leaking = seeSteam(state) ? 0.62 : 0.06;
  next.short = clamp(state.short + dt * steam * leaking, 0, 1);
  return next;
}

/** 见汽时压一层酒醅：把冒汽的地方盖住。返回新状态。 */
function pressLayer(state) {
  if (state.layers >= LAYERS_MAX) return state;
  if (!seeSteam(state)) return state; // 「见汽压醅」：没见汽不压
  return {
    ...state,
    layers: state.layers + 1,
    charge: 0, // 新盖的一层，蒸汽要重新爬上来
    short: clamp(state.short - 0.22, 0, 1), // 压得及时，孔道被盖住
    auto: true,
  };
}

/** 换接酒段：把蒸馏进程推到该段的代表时刻。 */
function goto(state, key) {
  const seg = SEGMENTS.find((s) => s.key === key) ?? SEGMENTS[1];
  return { ...state, t: seg.at, auto: true };
}

/** 当前温度下流酒的温度，°C。示意落在 37–45 之间。 */
function tempOf(state) {
  const raw = 36 + 7 * clamp(state.steam, 0, 1) + 5 * (1 - clamp(state.cool, 0, 1)) + (state.tianguo ? 1.5 : 0);
  return clamp(raw, 37, 45);
}

/** 酒度（体积分数，%）示意：开头高、往后走低；短路会让酒汽不匀，酒度再掉一点。 */
function abvOf(state) {
  const t = clamp(state.t, T_MIN, T_MAX);
  const base = 5 + 70 * Math.pow(1 - t, 0.6);
  return clamp(base - 6 * clamp(state.short, 0, 1), 0, 80);
}

/** 全部读数。页面上每一个数字都从这里出。 */
function solve(state) {
  const steam = clamp(state.steam, 0, 1);
  const coverage = coverageOf(state);
  const cooling = coolingOf(state);
  const short = clamp(state.short, 0, 1);
  const vapor = clamp(steam * (0.45 + 0.55 * coverage) * (1 - 0.5 * short), 0, 1); // 导汽流量，归一
  const condense = clamp(vapor * cooling, 0, 1); // 冷凝出酒，归一
  const abv = abvOf(state);
  const tempC = tempOf(state);
  const flower = flowerOf(abv);
  const segment = segmentOf(clamp(state.t, T_MIN, T_MAX));
  return {
    steam: Math.round(steam * 100), // %
    steamRaw: steam,
    layers: state.layers,
    layersMax: LAYERS_MAX,
    coverage,
    seeSteam: seeSteam(state),
    shortPct: Math.round(short * 100),
    short,
    evenness: 1 - 0.8 * short, // 酒汽匀度，示意
    vapor,
    vaporPct: Math.round(vapor * 100),
    condense,
    flow: 60 * condense, // L/h，示意
    abv,
    abvPct: Math.round(abv),
    flower,
    tempC,
    segment,
    tianguo: state.tianguo,
    t: clamp(state.t, T_MIN, T_MAX),
  };
}

const round1 = (value) => value.toFixed(1);

/** 卡片右下的读数。界面文字只用中文。 */
function readout(view) {
  const mode = view.tianguo ? "天锅" : "冷凝器";
  const steam = view.seeSteam ? "见汽" : "未见汽";
  const nb = "\u00a0";
  return `${mode} · 供汽 ${view.steam}% · ${steam} · 压醅 ${view.layers}/${view.layersMax} 层 · 短路 ${view.shortPct}% · 酒度 ${view.abvPct}% ${view.flower.name} · 流酒 ${round1(view.tempC)}${nb}°C · 出酒 ${view.flow.toFixed(0)}${nb}L/h · 接${view.segment.name} · 示意`;
}

/** 一行短提示，给滑块旁边用。 */
function hintOf(view) {
  if (view.layers >= view.layersMax) return "甑已装满，可以蒸酒";
  if (view.seeSteam) return "见汽了：趁冒汽的地方压一层酒醅";
  return `蒸汽还在往上爬（供汽 ${view.steam}%）`;
}

// ── 拆解：组件沿轴往上抬 ──────────────────────────────────────────────────
const EXPLODE = { pot: 0, bing: 13, barrel: 26, lid: 40, tg: 40, cond: 13, spirit: 0, jar: 0 };
const PART_ORDER = ["pot", "bing", "barrel", "lid", "tg", "cond", "spirit", "jar"];

// 相机对着真正画出来的东西，而不是一份手抄的极点表：先把所有实体按原样录一遍
// （组装与拆开两副样子都要，拆解途中才不会出框），再按这些顶点拟合。
async function layout(pad = 16) {
  const { pieces } = await import("./art.mjs");
  const { DYN } = await import("./dyn.mjs");
  const { rec } = await import("./geo.mjs");
  const probe = { origin: [0, 0], scale: 1, azimuth: CAM_AZ, elevation: CAM_EL };
  const points = [];
  const take = () => {
    for (const shape of rec.list ?? []) {
      const lift = EXPLODE[shape.part] ?? 0;
      shape.ring.forEach(([x, y], i) => {
        points.push([x, y, shape.zb[i]]);
        points.push([x, y, shape.zb[i] + lift]);
        points.push([x, y, shape.zt[i] + lift]);
      });
    }
  };
  rec.list = [];
  rec.part = "";
  pieces(probe);
  take();
  // 动态件按最占地方的那一副量：甑装满、供汽最大、走到酒尾。
  const { solve, initial } = await import("./model.mjs");
  const worstState = { ...initial(), steam: 1, layers: LAYERS_MAX, charge: 0, short: 0, cool: 1, t: 1, tianguo: false, auto: true };
  const worst = solve(worstState);
  for (const part of PART_ORDER) {
    rec.list = [];
    rec.part = part;
    for (const key of Object.keys(DYN)) DYN[key](probe, worst, 0.3, worstState);
    take();
  }
  rec.list = null;
  const P = fitProjection(points, WIDTH, HEIGHT, { pad, azimuth: CAM_AZ, elevation: CAM_EL });
  return { P, WIDTH, HEIGHT };
}

// geo.mjs — 这套图里所有实体的画法：一个能逐顶点给高度的棱柱，加上剖切用的半环、半盘，
// 以及阀门、法兰、手轮、箍、管段这些反复出现的小零件。kit 的 extrude 只吃凸多边形，
// 这里的桶壁、盖、天锅都是空心的凹环，所以要自己算填充面。
// 每画一个实体就记一份真实形状（底面环 + 上下高度），供绘制顺序检查与穿透检查读。


const rec = { list: null, tag: "", part: "" };

const gArea = (points) => {
  let area = 0;
  for (let i = 0; i < points.length; i++) {
    const [ax, ay] = points[i];
    const [bx, by] = points[(i + 1) % points.length];
    area += ax * by - bx * ay;
  }
  return area / 2;
};
const gOriented = (points) => (gArea(points) < 0 ? [...points].reverse() : points);
function gHull(points) {
  const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (sorted.length < 3) return sorted;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const p of sorted) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = sorted.length - 1; i >= 0; i--) {
    const p = sorted[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function gRuns(flags, want) {
  const count = flags.length;
  const runs = [];
  const start = flags.findIndex((flag, i) => flag !== flags[(i + count - 1) % count]);
  if (start < 0) return flags[0] === want ? [Array.from({ length: count + 1 }, (_, i) => i % count)] : [];
  let run = null;
  for (let step = 0; step < count; step++) {
    const i = (start + step) % count;
    if (flags[i] === want) {
      if (!run) run = [i];
      run.push((i + 1) % count);
    } else if (run) {
      runs.push(run);
      run = null;
    }
  }
  if (run) runs.push(run);
  return runs;
}

/** 底面环 `ring`，顶点 i 从 zb[i] 立到 zt[i]。返回 kit 的 SolidPaths。 */
function extrudeZ(ring, zb, zt, projection, { convex = true, bevel = 0 } = {}) {
  if (rec.list) rec.list.push({ tag: rec.tag, part: rec.part, ring, zb, zt, convex });
  const count = ring.length;
  const counter = gArea(ring) > 0;
  const [vx, vy] = towardViewer(projection);
  const { sinA, cosA } = cameraOf(projection);
  const normals = ring.map(([ax, ay], i) => {
    const [bx, by] = ring[(i + 1) % count];
    const dx = bx - ax;
    const dy = by - ay;
    const length = Math.hypot(dx, dy) || 1;
    return counter ? [dy / length, -dx / length] : [-dy / length, dx / length];
  });
  const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
  const top = ring.map(([x, y], i) => iso([x, y, zt[i]], projection));
  const bottom = ring.map(([x, y], i) => iso([x, y, zb[i]], projection));
  const quad = (i) => {
    const next = (i + 1) % count;
    return pathOf(gOriented([top[i], top[next], bottom[next], bottom[i]]), true);
  };
  const outline = [];
  const crease = [];
  for (const run of gRuns(facing, false)) outline.push(pathOf(run.map((i) => top[i])));
  for (const run of gRuns(facing, true)) {
    crease.push(pathOf(run.map((i) => top[i])));
    outline.push(pathOf(run.map((i) => bottom[i])));
  }
  for (let i = 0; i < count; i++) {
    if (facing[(i + count - 1) % count] !== facing[i]) outline.push(pathOf([top[i], bottom[i]]));
  }
  let fill;
  if (convex) {
    fill = pathOf(gHull([...top, ...bottom]), true);
  } else {
    // 凹环：上下两个面加上每一段侧壁。背面的侧壁不进 shades，但必须进 fill，
    // 否则细而高的环会在上下两条带之间漏出背景。
    const parts = [pathOf(gOriented(top), true), pathOf(gOriented(bottom), true)];
    for (let i = 0; i < count; i++) parts.push(quad(i));
    fill = parts.join("");
  }
  const buckets = [[], [], [], []];
  const [lx, ly] = [-sinA, cosA];
  for (let i = 0; i < count; i++) {
    if (!facing[i]) continue;
    const [nx, ny] = normals[i];
    const lit = (nx * lx + ny * ly + 1) / 2;
    buckets[Math.min(3, Math.max(0, Math.floor(lit * 4)))].push(quad(i));
  }
  let bevelPath;
  if (bevel > 0) {
    const inset = ring.map(([x, y], i) => {
      const [ax, ay] = normals[(i + count - 1) % count];
      const [bx, by] = normals[i];
      const mx = ax + bx;
      const my = ay + by;
      const length = Math.hypot(mx, my) || 1;
      return [x - (mx / length) * bevel, y - (my / length) * bevel];
    });
    const insetTop = inset.map(([x, y], i) => iso([x, y, zt[i]], projection));
    bevelPath = gRuns(facing, true)
      .map((run) => pathOf([top[run[0]], ...run.slice(1, -1).map((i) => insetTop[i]), top[run[run.length - 1]]]))
      .join("");
  }
  return {
    fill,
    outline: outline.join(""),
    crease: crease.join(""),
    top: pathOf(gOriented(top), true),
    shades: buckets.map((paths) => paths.join("")),
    bevel: bevelPath,
  };
}

/** 等高棱柱。 */
const prismZ = (ring, z, height, projection, options) =>
  extrudeZ(ring, ring.map(() => z), ring.map(() => z + height), projection, options);

/** 只画顶面的一层薄片（水位、酒面）。检查看到的是 `thickness` 厚的实心。 */
function sheetZ(ring, zb, thickness, projection) {
  if (rec.list) rec.list.push({ tag: rec.tag, part: rec.part, ring, zb, zt: zb.map((z) => z + thickness), convex: false });
  const d = pathOf(ring.map(([x, y], i) => iso([x, y, zb[i] + thickness], projection)), true);
  return { fill: d, outline: d, crease: "", top: d, shades: ["", "", "", ""] };
}

/** 闭合/开口折线贴在斜面上：每个点按自己的高度投影。 */
const lineAt = (points, zOf, projection, closed = false) =>
  pathOf(points.map(([x, y]) => iso([x, y, zOf(x, y)], projection)), closed);

/** 把多边形依次圆角。 */
function roundVertices(ring, indices, r, steps = 4) {
  const count = ring.length;
  const out = [];
  ring.forEach((p, i) => {
    if (!indices.includes(i)) {
      out.push(p);
      return;
    }
    const a = ring[(i + count - 1) % count];
    const b = ring[(i + 1) % count];
    const da = Math.hypot(a[0] - p[0], a[1] - p[1]) || 1;
    const db = Math.hypot(b[0] - p[0], b[1] - p[1]) || 1;
    const cut = Math.min(r, da * 0.45, db * 0.45);
    const p0 = [p[0] + ((a[0] - p[0]) / da) * cut, p[1] + ((a[1] - p[1]) / da) * cut];
    const p1 = [p[0] + ((b[0] - p[0]) / db) * cut, p[1] + ((b[1] - p[1]) / db) * cut];
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      const u = 1 - t;
      out.push([u * u * p0[0] + 2 * u * t * p[0] + t * t * p1[0], u * u * p0[1] + 2 * u * t * p[1] + t * t * p1[1]]);
    }
  });
  return out;
}

// ── 环：剖切面过轴心，切掉靠近观者的半个 ──────────────────────────────────
const D2R = Math.PI / 180;
const polar = (cx, cy, r, deg) => [cx + r * Math.cos(deg * D2R), cy + r * Math.sin(deg * D2R)];

function arcPts(cx, cy, r, a0, a1, steps) {
  const out = [];
  for (let i = 0; i <= steps; i++) out.push(polar(cx, cy, r, a0 + ((a1 - a0) * i) / steps));
  return out;
}

/** 半圆盘（凸）。a0→a1 是留下的那半圈。 */
const halfDisc = (cx, cy, r, a0, a1, steps = 26) => arcPts(cx, cy, r, a0, a1, steps);

/** 半环：外弧 a0→a1，再沿内弧折回。两个端口正好落在剖切面上。 */
function halfBand(cx, cy, rIn, rOut, a0, a1, steps = 26) {
  return [...arcPts(cx, cy, rOut, a0, a1, steps), ...arcPts(cx, cy, rIn, a1, a0, steps)];
}

/** 整圈环。 */
const fullBand = (cx, cy, rIn, rOut, steps = 48) => [
  ...arcPts(cx, cy, rOut, 0, 360, steps),
  ...arcPts(cx, cy, rIn, 360, 0, steps),
];

/** 平放的圆管截面：沿 a→b 的胶囊。 */
function stadium(ax, ay, bx, by, r, steps = 8) {
  const dx = bx - ax;
  const dy = by - ay;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const px = -uy * r;
  const py = ux * r;
  const head = Math.atan2(py, px) / D2R;
  return [
    [ax + px, ay + py],
    [bx + px, by + py],
    ...arcPts(bx, by, r, head, head + 180, steps),
    [ax - px, ay - py],
    ...arcPts(ax, ay, r, head + 180, head + 360, steps),
  ];
}

/** 竖直面里的弯头在平面上的样子：一段圆环。 */
const bendPlan = (cx, cy, radius, halfW, a0, a1, steps = 10) =>
  halfBand(cx, cy, radius - halfW, radius + halfW, a0, a1, steps);

/** 用剖切面切掉多边形靠近观者的半边。c 是这个物体的轴心。 */
function clipHalf(ring, cx, cy, projection) {
  const [vx, vy] = towardViewer(projection);
  const f = ([x, y]) => (x - cx) * vx + (y - cy) * vy;
  const out = [];
  for (let i = 0; i < ring.length; i++) {
    const a = ring[i];
    const b = ring[(i + 1) % ring.length];
    const fa = f(a);
    const fb = f(b);
    if (fa <= 0) out.push(a);
    if ((fa < 0 && fb > 0) || (fa > 0 && fb < 0)) {
      const t = fa / (fa - fb);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
  }
  return out;
}

/** 矩形（可圆角）的环。 */
const boxRing = (plan, steps = 6) => roundedPlan(plan, steps);
/** 圆的环。 */
const disc = (cx, cy, r, steps = 40) => circleRing(cx, cy, r, steps);

// ── 画 ───────────────────────────────────────────────────────────────────
const paint = (paths, opts) => solidSvg(paths, { tone: opts.tone ?? "hi", crease: opts.crease ?? "faint", halo: opts.halo, lit: opts.lit, flat: opts.flat });

/** 记下 tag，画一个逐顶点高度的棱柱。 */
function solidZ(tag, ring, zb, zt, P, opts = {}) {
  const prev = rec.tag;
  rec.tag = tag;
  const paths = extrudeZ(ring, zb, zt, P, { convex: opts.convex ?? true, bevel: opts.bevel ?? 0 });
  rec.tag = prev;
  return paint(paths, opts);
}

/** 等高棱柱。 */
const prismSvg = (tag, ring, z, h, P, opts = {}) =>
  solidZ(tag, ring, ring.map(() => z), ring.map(() => z + h), P, opts);

/** 圆筒。 */
const cylSvg = (tag, cx, cy, r, z, h, P, opts = {}) =>
  prismSvg(tag, circleRing(cx, cy, r, opts.steps ?? 32), z, h, P, opts);

/** 顶面上的一个螺钉：芯点加一圈。 */
function screwSvg(P, x, y, z, r = 0.9, tone = "lo") {
  const [sx, sy] = iso([x, y, z], P);
  const k = P.scale;
  return (
    `<circle class="iso-line" data-tone="${tone}" cx="${sx.toFixed(2)}" cy="${sy.toFixed(2)}" r="${(r * k * 0.95).toFixed(2)}" fill="none"/>` +
    dotsSvg([[sx, sy]], { size: Math.max(0.9, r * 0.6), tone: "mid" })
  );
}

/** 一整圈螺钉。 */
function boltSvg(P, cx, cy, radius, count, z, r = 0.9, from = 0) {
  let svg = "";
  for (let i = 0; i < count; i++) {
    const [x, y] = polar(cx, cy, radius, from + (360 * i) / count);
    svg += screwSvg(P, x, y, z, r);
  }
  return svg;
}

/** 列管束的管位：中心一根，外面两圈，只留背对相机的那半边。 */
function tubePositions(P, cx, cy, rings = [0, 15.5, 31]) {
  const [vx, vy] = towardViewer(P);
  const out = [];
  rings.forEach((radius, tier) => {
    const count = tier === 0 ? 1 : tier * 6;
    for (let i = 0; i < count; i++) {
      const a = (360 * i) / count + (tier === 2 ? 15 : 0);
      const x = cx + radius * Math.cos(a * D2R);
      const y = cy + radius * Math.sin(a * D2R);
      if ((x - cx) * vx + (y - cy) * vy > -1.5) continue;
      out.push([x - cx, y - cy]);
    }
  });
  return out;
}

/**
 * 剖切面上的文字：矩阵的两个轴分别取剖切线方向与竖直方向，字就贴在剖面上。
 * at 是文字的世界起点。
 */
function cutMatrix(at, P) {
  const [vx, vy] = towardViewer(P);
  const e = [-vy, vx];
  const o = iso(at, P);
  const u = iso([at[0] + e[0], at[1] + e[1], at[2]], P);
  const w = iso([at[0], at[1], at[2] + 1], P);
  const f = (n) => Math.round(n * 1000) / 1000;
  return `matrix(${f(u[0] - o[0])} ${f(u[1] - o[1])} ${f(w[0] - o[0])} ${f(w[1] - o[1])} ${f(o[0])} ${f(o[1])})`;
}

/** 顶面文字。 */
function topMatrixAt(at, P) {
  const o = iso(at, P);
  const u = iso([at[0] + 1, at[1], at[2]], P);
  const v = iso([at[0], at[1] + 1, at[2]], P);
  const f = (n) => Math.round(n * 1000) / 1000;
  return `matrix(${f(u[0] - o[0])} ${f(u[1] - o[1])} ${f(v[0] - o[0])} ${f(v[1] - o[1])} ${f(o[0])} ${f(o[1])})`;
}

/** 刻在剖面上的一行字。 */
const cutTextSvg = (P, at, text, opts = {}) =>
  faceTextSvg(cutMatrix(at, P), text, { size: opts.size ?? 2.6, tone: opts.tone ?? "mid", anchor: opts.anchor ?? "start" });

/** 刻在顶面上的一行字。 */
const topTextSvg = (P, at, text, opts = {}) =>
  faceTextSvg(topMatrixAt(at, P), text, { size: opts.size ?? 2.6, tone: opts.tone ?? "mid", anchor: opts.anchor ?? "start" });

/** 剖面上的螺孔/铆钉点。 */
function cutDotsSvg(P, at, list, size = 0.9, tone = "mid") {
  const [vx, vy] = towardViewer(P);
  const e = [-vy, vx];
  return dotsSvg(
    list.map(([u, w]) => iso([at[0] + e[0] * u, at[1] + e[1] * u, at[2] + w], P)),
    { size, tone },
  );
}

/** 一条贴顶面的线。 */
const topLine = (from, to, z, P) => pathOf([iso([from[0], from[1], z], P), iso([to[0], to[1], z], P)]);

/** 一段竖线。 */
const vLine = (at, z0, z1, P) => pathOf([iso([at[0], at[1], z0], P), iso([at[0], at[1], z1], P)]);

{ lineSvg, dotsSvg };

/** 只留背对相机那半圈的一圈螺钉：剖开的圆法兰上，近半边是空的。 */
function farBoltsSvg(P, cx, cy, radius, count, z, r = 0.85, from = 0) {
  const [vx, vy] = towardViewer(P);
  let svg = "";
  for (let i = 0; i < count; i++) {
    const [x, y] = polar(cx, cy, radius, from + (360 * i) / count);
    if ((x - cx) * vx + (y - cy) * vy > -1.5) continue;
    svg += screwSvg(P, x, y, z, r);
  }
  return svg;
}

/** 竖直法兰面上的一圈螺钉：圆落在与管轴垂直的平面里。 */
function vBoltsSvg(P, x, y, zc, radius, count, r = 0.8) {
  let svg = "";
  for (let i = 0; i < count; i++) {
    const a = (360 * i) / count;
    svg += screwSvg(P, x, y + radius * Math.cos(a * D2R), zc + radius * Math.sin(a * D2R), r);
  }
  return svg;
}

// ── 反复出现的小零件 ─────────────────────────────────────────────────────

/** 平走的一段管。a→b 是平面上的起点终点，zc 是管轴高度。 */
const pipeH = (tag, a, b, zc, r, P, opts = {}) =>
  prismSvg(tag, stadium(a[0], a[1], b[0], b[1], r, opts.steps ?? 7), zc - r, 2 * r, P, { tone: opts.tone ?? "mid" });

/** 竖着的一段管。 */
const pipeV = (tag, x, y, z0, z1, r, P, opts = {}) =>
  cylSvg(tag, x, y, r, z0, z1 - z0, P, { tone: opts.tone ?? "mid", steps: opts.steps ?? 22 });

/** 拐角处的一块，把两根管的接头盖住。 */
const elbowBlock = (tag, x, y, zc, r, P, opts = {}) =>
  cylSvg(tag, x, y, r * 1.16, zc - r * 1.16, r * 2.32, P, { tone: opts.tone ?? "mid", steps: 14 });

/** 管上的法兰盘（整圈，因为在管子上不在剖面上）。 */
function flangeSvg(tag, P, x, y, z, r, opts = {}) {
  return cylSvg(tag, x, y, r, z, opts.h ?? 3, P, { tone: opts.tone ?? "hi", steps: 20 }) +
    boltSvg(P, x, y, r * 0.72, opts.count ?? 6, z + (opts.h ?? 3) + 0.1, opts.screw ?? 0.8);
}

/** 手轮：中心毂、轮缘、三根辐条。 */
function handwheelSvg(tag, P, x, y, z, r, turn, tone = "hi") {
  const hub = cylSvg(tag, x, y, r * 0.22, z - 1.6, 3.2, P, { tone, steps: 14 });
  const rim = ringSvg(tag, P, x, y, r, z, tone);
  const spokes = [0, 1, 2]
    .map((i) => {
      const a = turn + (i * Math.PI * 2) / 3;
      return topLine([x + Math.cos(a) * r * 0.22, y + Math.sin(a) * r * 0.22], [x + Math.cos(a) * r, y + Math.sin(a) * r], z, P);
    })
    .join("");
  return hub + lineSvg(spokes, { tone: "mid" }) + rim;
}

/** 水平的一个圆环（轮缘）。 */
function ringSvg(tag, P, cx, cy, r, z, tone = "hi", w = 2.2) {
  const band = fullBand(cx, cy, r - w, r + w, 36);
  return solidZ(tag, band, band.map(() => z - 1.5), band.map(() => z + 1.5), P, { tone, convex: false, crease: "none" });
}

/** 一小段仪表：表盘 + 指针。 */
function gaugeSvg(tag, P, x, y, z, r, turn, tone = "hi") {
  const face = cylSvg(tag, x, y, r, z, 2.4, P, { tone, steps: 20 });
  const [ox, oy] = iso([x, y, z + 2.5], P);
  const k = P.scale;
  const ring = `<circle class="iso-line" data-tone="lo" cx="${ox.toFixed(2)}" cy="${oy.toFixed(2)}" r="${(r * 0.78 * k * 0.82).toFixed(2)}" fill="none"/>`;
  const hand = pathOf([
    [ox, oy],
    [ox + Math.cos(turn) * r * 0.7 * k * 0.82, oy + Math.sin(turn) * r * 0.7 * k * 0.82],
  ]);
  return face + ring + lineSvg(hand, { tone: "lit" });
}

// dyn.mjs — 形状随运动改变的部件：底锅水位、灶膛的火、酒醅层与见汽、天锅冷水、
// 坛里的酒、看花碗里的酒花、汽路酒路上的流线、待压的酒醅堆。
// 页面和检查共用这一份，所以页面上看到的形状与检查量到的形状是同一个。





const deg = (r) => (r * Math.PI) / 180;
const grainTop = (layers) => GRAIN_Z + clamp(layers, 0, LAYERS_MAX) * GRAIN_STEP;

/** 每层酒醅的分界面：同一个顶点用同一个扰动，上下两层严丝合缝。 */
const iface = (i, k) => {
  const v = Math.sin(k * 12.9898 + i * 43.11) * 43758.5453;
  return GRAIN_Z + i * GRAIN_STEP + (i === 0 ? 0 : (v - Math.floor(v) - 0.5) * 1.8);
};

// ── 底锅里的水 ───────────────────────────────────────────────────────────
function waterSvg(P, level) {
  const z = WATER_LO + (WATER_HI - WATER_LO) * clamp(level, 0, 1);
  const ring = halfDisc(ZX, ZY, POT_IN - 1.5, CUT_A0, CUT_A1, 26);
  const prev = rec.tag;
  rec.tag = "water";
  let svg = solidZ("water", ring, ring.map(() => WATER_LO), ring.map(() => z), P, { tone: "mid", flat: true });
  rec.tag = prev;
  svg += solidZ("water", ring, ring.map(() => z), ring.map(() => z + 0.8), P, { tone: "mid", flat: true });
  return svg;
}

// ── 灶膛的火 ─────────────────────────────────────────────────────────────
function fireSvg(P, phase, heat) {
  const prev = rec.tag;
  rec.tag = "fire";
  let svg = "";
  const bed = clipHalf(
    [
      [HEARTH.x + 10, HEARTH.y + 10],
      [HEARTH.x + HEARTH.w - 10, HEARTH.y + 10],
      [HEARTH.x + HEARTH.w - 10, HEARTH.y + HEARTH.d - 10],
      [HEARTH.x + 10, HEARTH.y + HEARTH.d - 10],
    ],
    ZX, ZY, P,
  );
  svg += solidZ("fire", bed, bed.map(() => GRATE_Z + 3), bed.map((p, i) => GRATE_Z + 5 + (i % 2 ? 1.6 : 0)), P, { tone: "lo", convex: false });
  const flames = 11;
  for (let i = 0; i < flames; i++) {
    const u = Math.sin(i * 37.3) * 0.5 + 0.5;
    const v = Math.sin(i * 91.7) * 0.5 + 0.5;
    const x = HEARTH.x + 16 + u * (HEARTH.w - 32);
    const y = HEARTH.y + 12 + v * (HEARTH.d - 24);
    if ((x - ZX) * Math.cos(deg(CAM_AZ)) + (y - ZY) * Math.sin(deg(CAM_AZ)) > -4) continue;
    const h = (7 + 9 * Math.sin(phase * 2.4 + i * 1.7) ** 2) * clamp(heat, 0, 1); // 最高 16，烧不到锅底（灶膛顶 27）
    if (h < 3) continue;
    const w = 4.4 + (i % 3);
    const plan = [
      [x - w, y - w * 0.6],
      [x + w, y - w * 0.6],
      [x + w * 0.8, y + w * 0.6],
      [x - w * 0.8, y + w * 0.6],
    ];
    svg += solidZ("fire", plan, plan.map(() => GRATE_Z + 4), plan.map((p, k) => GRATE_Z + 4 + h * (k < 2 ? 1 : 0.72)), P, { tone: "mid", crease: "none" });
  }
  rec.tag = prev;
  return svg;
}

// ── 酒醅：一层层铺上来的 ─────────────────────────────────────────────────
function grainSvg(P, layers) {
  const count = clamp(Math.round(layers), 0, LAYERS_MAX);
  if (count <= 0) return "";
  const prev = rec.tag;
  rec.tag = "grain";
  const ring = halfDisc(ZX, ZY, BING_R - 3, CUT_A0, CUT_A1, 30);
  let svg = "";
  for (let i = 0; i < count; i++) {
    const zb = ring.map((_, k) => iface(i, k));
    const zt = ring.map((_, k) => iface(i + 1, k));
    svg += solidZ("grain", ring, zb, zt, P, { tone: i % 2 ? "mid" : "hi", convex: false, bevel: 0.6 });
    // 醅面上的颗粒
    const tufts = [];
    for (let k = 0; k < 26; k++) {
      const a = CUT_A0 + ((CUT_A1 - CUT_A0) * ((k * 37) % 97)) / 97;
      const r = 12 + ((k * 53) % 59);
      const x = ZX + r * Math.cos(deg(a));
      const y = ZY + r * Math.sin(deg(a));
      if ((x - ZX) * Math.cos(deg(CAM_AZ)) + (y - ZY) * Math.sin(deg(CAM_AZ)) > -6) continue;
      tufts.push(iso([x, y, zt[0] + 0.9], P));
    }
    svg += dotsSvg(tufts, { size: 0.85, tone: "lo" });
  }
  rec.tag = prev;
  return svg;
}

/** 见汽：醅面上冒汽的地方。压一层的瞬间最亮，之后慢慢平息。 */
function seeSteamSvg(P, layers, spot, phase) {
  if (spot <= 0.02) return "";
  const z = grainTop(layers) + 1.2;
  const prev = rec.tag;
  rec.tag = "steamspots";
  let svg = "";
  const n = 5 + layers;
  for (let i = 0; i < n; i++) {
    const a = CUT_A0 + ((CUT_A1 - CUT_A0) * ((i * 41) % 89)) / 89;
    const r = 8 + ((i * 29) % (R_IN - 20)); // 汽斑连着边缘一起留在桶里
    const x = ZX + r * Math.cos(deg(a));
    const y = ZY + r * Math.sin(deg(a));
    if ((x - ZX) * Math.cos(deg(CAM_AZ)) + (y - ZY) * Math.sin(deg(CAM_AZ)) > -6) continue;
    const puff = 3 + 6 * clamp(spot, 0, 1) * (0.6 + 0.4 * Math.sin(phase * 3 + i));
    const plan = [
      [x - puff, y],
      [x, y - puff * 0.7],
      [x + puff, y],
      [x, y + puff * 0.7],
    ];
    svg += solidZ("steamspots", plan, plan.map(() => z), plan.map(() => z + 1.2), P, { tone: "lit", flat: true, crease: "none" });
  }
  rec.tag = prev;
  return svg;
}

// ── 天锅里的冷水 ─────────────────────────────────────────────────────────
function tgWaterSvg(P, level, phase) {
  const z = TG_Z + 4 + (TG_PAN_H - 8) * clamp(level, 0, 1);
  const ring = halfDisc(ZX, ZY, TG_R - 6, CUT_A0, CUT_A1, 30);
  const prev = rec.tag;
  rec.tag = "tgwater";
  let svg = solidZ("tgwater", ring, ring.map(() => z), ring.map((p) => z + 0.7 + 0.5 * Math.sin(phase + (p[0] - ZX) * 0.08)), P, {
    tone: "mid",
    flat: true,
    convex: false,
  });
  rec.tag = prev;
  return svg;
}

// ── 坛里的酒、看花碗里的酒与酒花 ─────────────────────────────────────────
function jarWineSvg(P, fill) {
  const z = 4 + 24 * clamp(fill, 0, 1);
  const ring = halfDisc(JAR.x, JAR.y, JAR_R - 9, CUT_A0, CUT_A1, 26);
  const prev = rec.tag;
  rec.tag = "jarwine";
  let svg = solidZ("jarwine", ring, ring.map(() => 2), ring.map(() => z), P, { tone: "mid", flat: true });
  svg += solidZ("jarwine", ring, ring.map(() => z), ring.map(() => z + 0.6), P, { tone: "hi", flat: true });
  rec.tag = prev;
  return svg;
}

// 酒花的形态随酒度变：口大消散快的是大清花，越往后花越小越碎。
// r 是画面上的半径（用户单位），不是甑的世界尺寸。无花就是酒面平板。
const FLOWER = {
  da: { r: 5.2, n: 4, life: 0.55 },
  xiao: { r: 3.5, n: 6, life: 0.75 },
  sui: { r: 2.2, n: 9, life: 1.0 },
  you: { r: 1.8, n: 6, life: 1.6 },
  none: { r: 0, n: 0, life: 2.2 },
};

function bowlWineSvg(P, flower, phase, level) {
  const prev = rec.tag;
  rec.tag = "bowlwine";
  const z = 3 + (BOWL_H - 6) * clamp(level, 0, 1);
  const ring = halfDisc(BOWL.x, BOWL.y, BOWL_R - 3, CUT_A0, CUT_A1, 22);
  let svg = solidZ("bowlwine", ring, ring.map(() => 2), ring.map(() => z), P, { tone: "mid", flat: true });
  svg += solidZ("bowlwine", ring, ring.map(() => z), ring.map(() => z + 0.6), P, { tone: "hi", flat: true });
  const style = FLOWER[flower] ?? FLOWER.none;
  const bubbles = [];
  // 只铺在剖开后还留着的那半个酒面上，花才落在看得见的碗里。
  const a0 = CUT_A0 + 18;
  const a1 = CUT_A1 - 18;
  const inner = Math.ceil(style.n / 2);
  for (let i = 0; i < style.n; i++) {
    const outer = i >= inner;
    const k = outer ? i - inner : i;
    const count = outer ? style.n - inner : inner;
    const a = a0 + (a1 - a0) * ((k + 0.5) / count);
    const rr = (outer ? 0.62 : 0.34) * (BOWL_R - 10);
    const x = BOWL.x + rr * Math.cos(a * D2R);
    const y = BOWL.y + rr * Math.sin(a * D2R);
    const t = ((phase / style.life + i * 0.37) % 1 + 1) % 1;
    const alpha = Math.sin(Math.PI * t) ** 0.6;
    const [sx, sy] = iso([x, y, z + 0.7], P);
    bubbles.push(
      `<circle class="mz-flower" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${style.r.toFixed(1)}" stroke-opacity="${(0.45 + 0.55 * alpha).toFixed(2)}"/>`,
    );
  }
  if (bubbles.length) svg += `<g class="mz-flowers">${bubbles.join("")}</g>`;
  rec.tag = prev;
  return svg;
}

// ── 汽路、酒路上的流线 ───────────────────────────────────────────────────
/** 一条沿折线跑的流线。整条路只画一根路径，虚线由 data-flow 让 CSS 沿路径跑，
 *  所以几何不逐帧重画：既省下每帧的字符串，线头也才是确定的（原来把流线切成
 *  一段段短划，短划飘在半空，线头检查量到的就是这些半空的划头）。
 *  流量用虚线的疏密和跑的速度表示：管路周期取 32 的整数分之一，接得回头。 */
function flowSvg(P, points, amount, tone = "lit") {
  const a = clamp(amount, 0, 1);
  if (a < 0.03) return "";
  const d = pathOf(points.map((p) => iso(p, P)));
  const n = 3 + Math.round(a * 5); // 3..8 个周期
  const period = 32 / n;
  const dash = Math.min(2.4, period * 0.45);
  const ms = Math.round((1900 * period) / 8);
  return `<path class="iso-line mz-flow" data-tone="${tone}" data-flow="" style="stroke-dasharray:${dash.toFixed(1)} ${(period - dash).toFixed(1)};animation-duration:${ms}ms" d="${d}"/>`;
}

/** 汽路：从甑盖颈口沿过汽管到冷凝器管束之间。检查里量它有没有跑出管子。 */
function vapourPath() {
  return [
    [ZX, ZY, PIPE_Z],
    [COND.x, COND.y, PIPE_Z],
    [COND.x, COND.y, COND_TOP - COND_HEAD + 8],
    [COND.x, COND.y, COND_BOT + 26],
  ];
}

/** 流线从管口启程时，起点要落在管口的圆棱上：管心那一点四周是空的
 *  （管口是一圈线，圆心离它还有一段），从管心起笔就会悬在管口中间，
 *  线头检查一量就是一个浮在空处的头。 */
function portRim(P, p, r) {
  const [vx, vy] = towardViewer(P);
  return [p[0] + r * vx, p[1] + r * vy, p[2]];
}

/** 酒路：从冷凝器底到接酒坛。天锅那一路从盘面流到坛口。 */
function spiritPath(tianguo) {
  if (tianguo) {
    const [sx, sy] = [ZX + (TG_R - 6) * Math.cos(CUT_A1 * D2R), ZY + (TG_R - 6) * Math.sin(CUT_A1 * D2R)];
    const p0 = [sx + 38, sy - 42];
    const p1 = [100, 102];
    const zRun = JAR_H + 12;
    // 酒从盘心的口出来，顺着一道放射线流到盘沿的集酒沟，再从流酒嘴出去。
    // 放射线的两头正是盘心的口沿和集酒沟，流线贴着它走，两头都落在线上。
    const rib = CUT_A0 + 12 + 16 * 10; // 最后一道放射线的角度
    const dish = (r) => TG_Z + (1 - r / TG_R) * 3.4 + 3;
    const rIn = 8;
    const rOut = TG_R - 9;
    return [
      [ZX + rIn * Math.cos(rib * D2R), ZY + rIn * Math.sin(rib * D2R), dish(rIn)],
      [ZX + rOut * Math.cos(rib * D2R), ZY + rOut * Math.sin(rib * D2R), dish(rOut)],
      [sx, sy, TG_Z + 2],
      [p0[0], p0[1], TG_Z + 2],
      [p0[0], p0[1], zRun],
      [p1[0], p1[1], zRun],
      [p1[0], p1[1], JAR_H + 9],
    ];
  }
  return SPIRIT_ROUTE.map((p) => [...p]);
}

/** 汽路总管：从台面左边的蒸汽管到锅底。 */
function steamPath() {
  return STEAM_ROUTE.map((p) => [...p]);
}

function vapourFlowSvg(P, amount) {
  const prev = rec.tag;
  rec.tag = "flowvapour";
  const path = vapourPath();
  const svg = flowSvg(P, path, amount, "hi");
  rec.tag = prev;
  return svg;
}

function spiritFlowSvg(P, amount, tianguo) {
  const prev = rec.tag;
  rec.tag = "flowspirit";
  const path = spiritPath(tianguo);
  if (!tianguo) path[0] = portRim(P, path[0], SPIRIT_PIPE_R);
  let svg = flowSvg(P, path, amount, "lit");
  const drop = clamp(amount, 0, 1);
  if (drop > 0.05) {
    // 出酒口到坛口这一段落在外面的空气里，照样是一根流线
    const end = path[path.length - 1];
    svg += flowSvg(P, [[end[0], end[1], end[2] + 1], [JAR.x, JAR.y, JAR_H - 1]], drop, "lit");
  }
  rec.tag = prev;
  return svg;
}

function steamFlowSvg(P, amount) {
  const prev = rec.tag;
  rec.tag = "flowsteam";
  const svg = flowSvg(P, steamPath(), amount, "hi");
  rec.tag = prev;
  return svg;
}

// ── 待压的酒醅堆 ─────────────────────────────────────────────────────────
function heapSvg(P, layers) {
  // 筛过的酒醅堆：底下一圈散开的壳，上面收成一个圆丘，越压越矮
  const left = clamp(1 - layers / LAYERS_MAX, 0.18, 1);
  const h = 5 + 20 * left;
  const { x, y } = { x: HEAP.x, y: HEAP.y };
  const prev = rec.tag;
  rec.tag = "heap";
  const ring = [];
  const n = 30;
  for (let i = 0; i < n; i++) {
    const a = (360 * i) / n;
    const rr = 25 * (0.94 + 0.06 * Math.sin(i * 2.3));
    ring.push([x + rr * Math.cos(deg(a)), y + rr * Math.sin(deg(a))]);
  }
  const cap = (px, py) => 1 + h * Math.pow(Math.cos(Math.min(1, Math.hypot(px - x, py - y) / 26) * Math.PI * 0.5), 1.15);
  let svg = solidZ("heap", ring, ring.map(() => 1), ring.map(([px, py]) => cap(px, py)), P, { tone: "hi", bevel: 1.6, convex: false });
  // 顶上的颗粒：只铺在丘面上
  const tufts = [];
  for (let i = 0; i < 26; i++) {
    const a = (360 * i) / 26 + 5;
    const rr = 3 + (i % 5) * 4.2;
    const px = x + rr * Math.cos(deg(a));
    const py = y + rr * Math.sin(deg(a));
    tufts.push(iso([px, py, cap(px, py) + 0.5], P));
  }
  svg += dotsSvg(tufts, { size: 0.8, tone: "lo" });
  rec.tag = prev;
  return svg;
}

/** 页面与检查共用：dyn 层的名字 → 画法。 */
const DYN = {
  fire: (P, v, phase) => fireSvg(P, phase, 0.35 + 0.65 * v.steamRaw),
  water: (P, v) => waterSvg(P, 0.4 + 0.55 * Math.min(1, v.vapor + 0.2)),
  grain: (P, v) => grainSvg(P, v.layers),
  steamspots: (P, v, phase, state) => seeSteamSvg(P, v.layers, v.seeSteam ? 1 - 0.55 * clamp(state.short ?? 0, 0, 1) : 0, phase),
  tgwater: (P, v, phase) => tgWaterSvg(P, v.seeSteam ? 1 : 0.25, phase),
  jarwine: (P, v) => jarWineSvg(P, Math.min(1, 0.25 + v.t * 0.9)),
  bowlwine: (P, v, phase) => bowlWineSvg(P, v.flower.key, phase, v.flow > 4 ? 0.9 : 0.55),
  flowvapour: (P, v) => vapourFlowSvg(P, v.vapor),
  flowspirit: (P, v) => spiritFlowSvg(P, v.condense, v.tianguo),
  flowsteam: (P, v) => steamFlowSvg(P, v.steamRaw),
  heap: (P, v) => heapSvg(P, v.layers),
};

// live.js — 拖拽、按键、自动演示。页面上每一个数字都来自上面内联的 model.mjs。
const stage = document.querySelector(".mz-stage");
const svg = stage.querySelector("svg");
const readoutEl = document.querySelector("[data-readout]");
const hintEl = document.querySelector('[data-corner="hint"]');
const tools = document.querySelector(".mz-tools");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const P = {"origin":[418.6653349789696,422.14260127225975],"scale":0.9593378573808696,"azimuth":40,"elevation":32};

const HOOK = hintEl.textContent;
const dynEls = {};
for (const el of svg.querySelectorAll("[data-dyn]")) dynEls[el.dataset.dyn] = el;
// 一个组件由好几个部件拼成（甑桶=五道箍、四段筒身、两只耳朵…），
// 拆解时它们得一起抬，所以每个 part 收一列。
const partEls = {};
for (const el of svg.querySelectorAll("[data-part]")) (partEls[el.dataset.part] ??= []).push(el);

// 世界坐标里 +1 的 z 在屏幕上走多远：抬件、抬醅都按它走，方向永远贴着竖轴。
const O = iso([0, 0, 0], P);
const Z = iso([0, 0, 1], P);
const UZ = [Z[0] - O[0], Z[1] - O[1]];

let state = initial();
let frame = 0;
let last = 0;
let visible = false;
let clock = 0;
let touring = false;
let tourEnabled = false;
let dragging = null;
let dragged = false;
let pressCool = 0;
let phase = 0;
let explodeShown = 0;

const follow = (value, target, dt, tau, calm) => {
  if (calm) return target;
  const next = value + (target - value) * (1 - Math.exp(-dt / tau));
  return Math.abs(target - next) < 0.004 ? target : next;
};

const view = () => solve(state);

function say(v) {
  const text = readout(v);
  if (readoutEl.textContent !== text) readoutEl.textContent = text;
  const steamEl = tools.querySelector("[data-steam]");
  const coolEl = tools.querySelector("[data-cool]");
  if (steamEl) steamEl.textContent = v.steam + "%";
  if (coolEl) coolEl.textContent = Math.round(state.cool * 100) + "%";
  const sIn = tools.querySelector('[data-act="steam"]');
  const cIn = tools.querySelector('[data-act="cool"]');
  if (sIn && document.activeElement !== sIn) sIn.value = String(v.steam);
  if (cIn && document.activeElement !== cIn) cIn.value = String(Math.round(state.cool * 100));
  const modeBtn = tools.querySelector('[data-act="mode"]');
  if (modeBtn) {
    modeBtn.textContent = v.tianguo ? "现代冷凝" : "天锅";
    modeBtn.setAttribute("aria-pressed", v.tianguo ? "true" : "false");
  }
  const exBtn = tools.querySelector('[data-act="explode"]');
  if (exBtn) exBtn.setAttribute("aria-pressed", state.explode ? "true" : "false");
  const pressBtn = tools.querySelector('[data-act="press"]');
  if (pressBtn) {
    pressBtn.disabled = !v.seeSteam || v.layers >= v.layersMax;
    pressBtn.textContent = v.seeSteam ? "见汽 · 压一层酒醅" : "等蒸汽冒上来";
  }
  for (const seg of SEGMENTS) {
    const btn = tools.querySelector(`[data-act="${seg.key}"]`);
    if (btn) btn.setAttribute("aria-pressed", v.segment.key === seg.key ? "true" : "false");
  }
  // 没动过的时候牌子上留着钩子，动过之后换成当下的提示。
  const hint = state.auto ? hintOf(v) : HOOK;
  if (hintEl.textContent !== hint) hintEl.textContent = hint;
  stage.setAttribute("aria-valuetext", text);
}

function draw(dt, calm) {
  const v = view();
  phase = (phase + dt * (0.35 + 1.1 * v.vapor)) % 1;
  explodeShown = follow(explodeShown, state.explode ? 1 : 0, dt, 0.34, calm);
  pressCool = follow(pressCool, v.seeSteam ? 0 : 1, dt, 0.5, calm);

  for (const key of Object.keys(DYN)) {
    const el = dynEls[key];
    if (el) el.innerHTML = DYN[key](P, v, phase, state);
  }
  for (const part of PART_ORDER) {
    const lift = (EXPLODE[part] ?? 0) * explodeShown * P.scale;
    const at = lift ? `translate(${(UZ[0] * lift).toFixed(2)} ${(UZ[1] * lift).toFixed(2)})` : "";
    for (const el of partEls[part] ?? []) el.setAttribute("transform", at);
  }
  // 天锅与甑盖、冷凝器互斥：样式表按这个属性决定哪一组露出来，这里必须跟着状态走。
  const mode = v.tianguo ? "tg" : "modern";
  if (stage.dataset.mode !== mode) stage.dataset.mode = mode;
  say(v);
}

// ── 自动演示：固定步长的 30 秒，从按钮或 ?demo=1 启动 ──────────────────────
const TOUR_LEN = 30;
const BEATS = [
  [0, 5, "一台酒甑，从底锅到接酒坛"],
  [5, 10.5, "见汽压醅：哪里冒汽，就在哪里盖一层"],
  [10.5, 14.5, "酒汽从甑盖进导汽筒，一路过去"],
  [14.5, 19, "冷凝器里管束把酒汽收成酒"],
  [19, 24.5, "看花摘酒：酒面上的花在变"],
  [24.5, 27, "换成老办法的天锅，一样能接酒"],
  [27, 30, "酒师不看仪表，只看酒面上的「花」"],
];

function tourBeat(t) {
  const u = ((t % TOUR_LEN) + TOUR_LEN) % TOUR_LEN;
  const beat = BEATS.find((b) => u >= b[0] && u < b[1]) ?? BEATS[0];
  return { u, text: beat[2] };
}

/** 一步定长的推进：把演示写在纸上，同一秒永远是同一幅画面。 */
function tourStep(dt) {
  const { u, text } = tourBeat(clock);
  const beatEl = tools.querySelector("[data-beat]");
  if (beatEl && beatEl.textContent !== text) beatEl.textContent = text;

  let next = { ...state, auto: true, explode: false };
  if (u < 5) {
    next = { ...next, steam: 0.55, cool: 0.7, tianguo: false, layers: Math.min(next.layers, 1), t: 0.06, explode: false };
  } else if (u < 10.5) {
    next = { ...next, steam: 0.8, cool: 0.7, tianguo: false, t: 0.1 };
  } else if (u < 14.5) {
    next = { ...next, steam: 0.85, cool: 0.75, tianguo: false, t: 0.14 };
  } else if (u < 19) {
    next = { ...next, steam: 0.85, cool: 0.55 + ((u - 14.5) / 4.5) * 0.44, tianguo: false, t: 0.3 };
  } else if (u < 24.5) {
    next = { ...next, steam: 0.62, cool: 0.8, tianguo: false, t: 0.06 + ((u - 19) / 5.5) * 0.86 };
  } else if (u < 27) {
    next = { ...next, steam: 0.62, cool: 0.95, tianguo: true, t: 0.3 };
  } else {
    next = { ...next, steam: 0.55, cool: 0.7, tianguo: false, layers: LAYERS_MAX, explode: u > 28.4 };
  }
  state = next;
  state = advance(state, dt);
  // 见汽就压一层：演示里这一步替读者按下去。
  if (u >= 5 && u < 10.5 && state.layers < 5 && seeSteam(state)) state = pressLayer(state);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
  last = now;
  if (!still.matches) {
    if (touring) {
      clock = (clock + 1 / 60) % TOUR_LEN; // 固定步长，演示永远走同样的 30 秒
      tourStep(1 / 60);
    } else if (state.auto) {
      state = advance(state, dt);
    }
  }
  draw(dt, still.matches);
  frame = visible ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

const setTour = (on) => {
  touring = on && !still.matches;
  tourEnabled = on;
  const btn = tools.querySelector('[data-act="tour"]');
  if (btn) btn.setAttribute("aria-pressed", String(on));
  if (touring) {
    clock = 0;
    state = { ...initial(), layers: 1, charge: 0, auto: true };
    run();
  }
};

const wake = () => {
  if (touring) setTour(false);
};

stage.addEventListener("pointerdown", (event) => {
  stage.focus({ preventScroll: true });
  dragging = { x: event.clientX, y: event.clientY, steam: state.steam };
  dragged = false;
  stage.setPointerCapture?.(event.pointerId);
  event.preventDefault();
  run();
});

stage.addEventListener("pointermove", (event) => {
  if (!dragging) return;
  const box = svg.getBoundingClientRect();
  const dx = (event.clientX - dragging.x) / box.width;
  if (Math.abs(event.clientX - dragging.x) > 6) dragged = true;
  if (!dragged) return;
  wake();
  state = { ...state, auto: true, steam: clamp(dragging.steam + dx * 1.6, 0, 1) };
  run();
});

stage.addEventListener("pointerup", (event) => {
  if (!dragging) return;
  const wasDrag = dragged;
  dragging = null;
  dragged = false;
  if (wasDrag) return;
  // 点一下醅面：见汽就压一层，没见汽就只把状态点亮。
  wake();
  const v = view();
  if (v.seeSteam && v.layers < v.layersMax) state = pressLayer({ ...state, auto: true });
  else state = { ...state, auto: true };
  run();
});

stage.addEventListener("keydown", (event) => {
  const key = event.key;
  wake();
  if (key === "ArrowUp") state = { ...state, auto: true, steam: clamp(state.steam + 0.05, 0, 1) };
  else if (key === "ArrowDown") state = { ...state, auto: true, steam: clamp(state.steam - 0.05, 0, 1) };
  else if (key === "ArrowRight") state = { ...state, auto: true, cool: clamp(state.cool + 0.05, 0, 1) };
  else if (key === "ArrowLeft") state = { ...state, auto: true, cool: clamp(state.cool - 0.05, 0, 1) };
  else if (key === " " || key === "Enter") state = pressLayer({ ...state, auto: true });
  else if (key === "x" || key === "X") state = { ...state, explode: !state.explode };
  else if (key === "m" || key === "M") state = { ...state, auto: true, tianguo: !state.tianguo };
  else if (key === "1") state = goto(state, "head");
  else if (key === "2") state = goto(state, "new");
  else if (key === "3") state = goto(state, "tail");
  else return;
  event.preventDefault();
  run();
});

tools.addEventListener("pointerdown", (event) => event.stopPropagation());
tools.addEventListener("input", (event) => {
  const act = event.target.closest("[data-act]")?.dataset.act;
  wake();
  if (act === "steam") state = { ...state, auto: true, steam: Number(event.target.value) / 100 };
  else if (act === "cool") state = { ...state, auto: true, cool: Number(event.target.value) / 100 };
  else return;
  run();
});
tools.addEventListener("click", (event) => {
  const act = event.target.closest("[data-act]")?.dataset.act;
  if (!act) return;
  if (act === "press") {
    wake();
    state = pressLayer({ ...state, auto: true });
  } else if (act === "mode") {
    wake();
    state = { ...state, auto: true, tianguo: !state.tianguo };
  } else if (act === "explode") {
    wake();
    state = { ...state, explode: !state.explode };
  } else if (act === "head" || act === "new" || act === "tail") {
    wake();
    state = goto(state, act);
  } else if (act === "tour") {
    setTour(!tourEnabled);
  } else if (act === "theme") {
    const next = document.body.dataset.theme === "dark" ? "light" : "dark";
    document.body.dataset.theme = next;
    event.target.textContent = next === "dark" ? "浅色" : "深色";
  } else return;
  run();
});

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

// 缩略图和直接打开都停在默认读数上。演示只从按钮或 ?demo=1 起。
if (new URLSearchParams(location.search).get("demo") === "1" && !still.matches) setTour(true);

window.__mz = {
  get state() {
    return { ...state };
  },
  get view() {
    return view();
  },
  get text() {
    return readout(view());
  },
  get beat() {
    return tools.querySelector("[data-beat]")?.textContent ?? "";
  },
  get hint() {
    return hintEl.textContent;
  },
  get explode() {
    return explodeShown;
  },
  press: () => {
    const before = state.layers;
    state = pressLayer({ ...state, auto: true });
    draw(1 / 60, true);
    return state.layers !== before;
  },
  setSteam: (value) => {
    state = { ...state, auto: true, steam: clamp(value, 0, 1) };
    draw(1 / 60, true);
  },
  setCool: (value) => {
    state = { ...state, auto: true, cool: clamp(value, 0, 1) };
    draw(1 / 60, true);
  },
  goto: (key) => {
    state = goto(state, key);
    draw(1 / 60, true);
  },
  mode: (on) => {
    state = { ...state, auto: true, tianguo: !!on };
    draw(1 / 60, true);
  },
  step: (seconds) => {
    let left = seconds;
    while (left > 0) {
      state = advance(state, Math.min(1 / 60, left));
      left -= 1 / 60;
    }
    draw(1 / 60, true);
  },
  demo: (seconds) => {
    setTour(true);
    let left = seconds;
    while (left > 0) {
      clock = (clock + 1 / 60) % TOUR_LEN;
      tourStep(1 / 60);
      left -= 1 / 60;
    }
    draw(1 / 60, true);
    return { clock, beat: tools.querySelector("[data-beat]")?.textContent ?? "" };
  },
};

draw(1 / 60, true);
run();

// 追加到 moutai-zeng/live.js 末尾后重建（未并入，本文件仅作建议）。
window.__fig = {
  setState(t) {
    setTour(true);
    window.__mz.demo(t);
    touring = false;
    tourEnabled = false;
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
    draw(1 / 60, true);
  },
  getDuration: () => TOUR_LEN,
};
</script></body></html>
