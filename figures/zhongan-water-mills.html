// model.mjs — 重安江水碾群，纯数字模型，不含任何绘制。
// 绘制（art/dyn）、运动、页面读数都从这一个模块取数，避免公式重复。
//
// ── 据公开资料 ──────────────────────────────────────────────────────────
//   地点：贵州黄平县重安镇，重安江（清水江段）江心沙洲上；
//         2013 年公布为第七批全国重点文物保护单位。
//   沙洲把江水分成南北两汊，南高北低，水位差 1.12 m。
//   每座碾房从江里引水，经「入水孔两眼」冲击水轮；水轮深藏沙洲腹部。
//   现存 19 座一字排列，13 座仍在使用；明代屯军始建，约 40 余座于明末。
//   用途：先为稻谷脱壳去麸，如今碾桐籽榨油、碾竹材造纸、碾做香的原料粉末。
//   洪水冲走碾房草棚，但沉重的石滚轮和藏在沙洲里的水轮仍在。
// ── 以下皆为示意（不是实测） ───────────────────────────────────────────
//   水轮为卧轮（水平轴心竖直），轮径、叶片数、转速、射流系数、机架尺寸、
//   洪水抬高量等，均按下图需要设定，读数里标「示意」。

const G = 9.81;

const HEAD_DEFAULT = 1.12; // m，据公开资料（南高北低的水位差）
const HEAD_MAX = 1.6; // m，滑条上限（示意）
const HEAD_MIN = 0;

const MILLS_NOW = 19; // 座，据公开资料
const MILLS_IN_USE = 13; // 座，据公开资料
const MILLS_MING = "明代"; // 始建年代，据公开资料

const JET_K = 0.45; // 示意：射流速度系数
const RPM_PER_MS = 19; // 示意：每 1 m/s 射流对应的水轮转速
const LOAD_FACTOR = 0.72; // 示意：碾桐籽（带载）相对空载的降速
const FLOOD_HEAD_LOSS = 0.18; // 示意：洪水期有效水位差略减
const FLOOD_RISE = 0.85; // 示意：洪水抬高水位（m）
const MIN_SPIN = 0.6; // rpm，低于此视为停转

const DEMO_LOOP = 25; // s，自动演示一圈

const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, Number.isFinite(value) ? value : lo));

const LOAD_NAME = { 0: "空载", 1: "桐籽" };
const LOAD_OPTIONS = [0, 1];

function initialState() {
  return { head: HEAD_DEFAULT, inlets: 2, load: 0, flood: 0, roof: 1, explode: 0 };
}

/**
 * One operating point. Pure function of the inputs — the readout, the
 * animation speeds and the checks all call this, so they cannot drift apart.
 *   head   m, 水位差（南汊比北汊高多少）
 *   inlets 0/1/2, 打开的入水孔数量
 *   load   0 空载 / 1 碾桐籽
 *   flood  0/1 是否在发洪水（水位整体抬高，水位差略减）
 */
function solve(input = {}) {
  const head = clamp(input.head ?? HEAD_DEFAULT, HEAD_MIN, HEAD_MAX);
  const req = Math.round(clamp(input.inlets ?? 2, 0, 2));
  const open1 = input.o1 === undefined ? req >= 1 : !!input.o1;
  const open2 = input.o2 === undefined ? req >= 2 : !!input.o2;
  const inlets = (open1 ? 1 : 0) + (open2 ? 1 : 0);
  const load = input.load ? 1 : 0;
  const flood = input.flood ? 1 : 0;

  const eff = Math.max(0, head - flood * FLOOD_HEAD_LOSS); // 有效水位差（示意）
  const jet = Math.sqrt(2 * G * eff) * JET_K; // 射流速度 m/s（示意）
  const share = inlets / 2; // 每开一孔分到一半水量
  const factor = load ? LOAD_FACTOR : 1;
  const rpm = RPM_PER_MS * jet * share * factor; // 水轮转速 rpm（示意）
  const spinning = rpm > MIN_SPIN;
  const omega = (rpm * 2 * Math.PI) / 60; // 水轮 / 立轴角速度 rad/s
  const full = RPM_PER_MS * Math.sqrt(2 * G * HEAD_DEFAULT) * JET_K;
  const flow = Math.min(1, rpm / full); // 0..1，给水流动画用
  const state = flood ? (spinning ? "洪水·运转" : "洪水·停转") : spinning ? "运转" : "停转";

  return {
    head,
    inlets,
    load,
    flood,
    eff,
    jet,
    share,
    factor,
    rpm,
    rollerRpm: rpm, // 石碾随立轴走，转速相同
    omega,
    spinning,
    flow,
    state,
    open1,
    open2,
  };
}

const INLET_NAME = (n) => (n === 0 ? "全闭" : n === 1 ? "开 1 孔" : "开 2 孔");

/** 页面上那一行读数。所有数字都来自 solve()。 */
function readout(v) {
  return `水位差 ${v.head.toFixed(2)} m · 进水孔 ${INLET_NAME(v.inlets)} · 水轮 ${v.rpm.toFixed(0)} rpm（示意）· 石碾 ${v.rollerRpm.toFixed(0)} rpm（示意）· ${v.state}`;
}

/** 卡片上「据公开资料」一小段，供 build 与 README 共用。 */
function factsLine() {
  return `据公开资料：现存 ${MILLS_NOW} 座一字排列，${MILLS_IN_USE} 座仍在使用；${MILLS_MING}始建，明末曾有四十余座；水位差 ${HEAD_DEFAULT.toFixed(2)} m。`;
}

/**
 * 确定性自动演示（约 25 s，可循环）：
 *   0–4 s   水位差 0 → 1.12 m（两孔仍闭，水轮不转）
 *   4–6 s   先开 1 孔，再开 2 孔（水轮转起来）
 *   6–9 s   空载运转
 *   9–10 s  加载桐籽（慢下来）
 *   10–14 s 洪水（草棚被冲走）
 *   14–16 s 退水（水轮与石碾还在转）
 *   16–19 s 拆解
 *   19–22 s 装回
 *   22–25 s 复位（草棚回来、水孔关闭）
 */
function demoInput(t) {
  const u = ((t % DEMO_LOOP) + DEMO_LOOP) % DEMO_LOOP;
  const lerp = (a, b, k) => a + (b - a) * clamp(k, 0, 1);
  const out = { head: HEAD_DEFAULT, inlets: 2, load: 0, flood: 0, roof: 1, explode: 0 };
  if (u < 4) return { ...out, head: lerp(0, HEAD_DEFAULT, u / 4), inlets: 0 };
  if (u < 4.8) return { ...out, inlets: 1 };
  if (u < 5.6) return { ...out, inlets: 2 };
  if (u < 9) return { ...out, inlets: 2 };
  if (u < 10) return { ...out, inlets: 2, load: 1 };
  if (u < 14) return { ...out, inlets: 2, load: 1, flood: 1, roof: Math.max(0, 1 - (u - 10) / 2.6) };
  if (u < 16) return { ...out, inlets: 2, load: 1, flood: 1, roof: 0 };
  if (u < 16.4) return { ...out, inlets: 2, load: 1, flood: 0, roof: 0 };
  if (u < 19) return { ...out, inlets: 2, load: 1, flood: 0, roof: 0, explode: Math.min(1, (u - 16.4) / 1.8) };
  if (u < 22) return { ...out, inlets: 2, load: 1, flood: 0, roof: 0, explode: Math.max(0, 1 - (u - 19.6) / 1.8) };
  if (u < 24) return { ...out, inlets: 2, load: 0, flood: 0, roof: Math.min(1, (u - 22) / 1.6), explode: 0 };
  return { ...out, inlets: 0, load: 0, roof: 1, explode: 0 };
}

let cache = { n: 0, angle: 0 };

/** 自动演示第 t 秒的姿态：在演示时间轴上按 1/60 s 累积水轮转角，可循环。 */
function poseAt(t) {
  const dt = 1 / 60;
  const period = Math.round(DEMO_LOOP / dt);
  const n = Math.round(Math.max(0, t) / dt) % period;
  if (n < cache.n) cache = { n: 0, angle: 0 };
  while (cache.n < n) {
    const v = solve(demoInput((cache.n + 1) * dt));
    cache.angle += v.omega * dt;
    cache.n += 1;
  }
  const input = demoInput(n * dt);
  return { ...solve(input), roof: input.roof, explode: input.explode, angle: cache.angle };
}

// geo.mjs — kit 画不出的实体：任意轴的圆柱（石滚轮、横梁、水槽）、水平圆环、
// 水平面内的四边形（叶片）、扇形槽线、螺钉。


function viewDir(P) {
  const { sinA, cosA, sinE, cosE } = cameraOf(P);
  return [cosA * cosE, sinA * cosE, sinE];
}
function lightDir(P) {
  const { sinA, cosA } = cameraOf(P);
  const x = -sinA;
  const y = cosA;
  const z = 1.2;
  const L = Math.hypot(x, y, z) || 1;
  return [x / L, y / L, z / L];
}
function toneOf(n, P) {
  const L = lightDir(P);
  const s = n[0] * L[0] + n[1] * L[1] + n[2] * L[2];
  if (s >= 0.62) return 4;
  if (s >= 0.42) return 3;
  if (s >= 0.2) return 2;
  if (s >= 0) return 1;
  return 0;
}
function paintQuads(quads, style) {
  quads.sort((a, b) => a.depth - b.depth);
  const shades = ["", "", "", ""];
  let top = "";
  let fill = "";
  for (const q of quads) {
    fill += q.d;
    if (q.tone >= 4) top += q.d;
    else shades[q.tone] += q.d;
  }
  return solidSvg({ fill, shades, top, outline: "", crease: "" }, { crease: "none", tone: "mid", ...style });
}

/** 任意两点之间的圆柱。 */
function cylAxis(a, b, r, P, style = {}, steps = 18) {
  const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
  const len = Math.hypot(dx, dy, dz);
  if (!(r > 0.12) || len < 0.2) return "";
  const w = [dx / len, dy / len, dz / len];
  // 取一个与轴不平行的向量做基准
  const ref = Math.abs(w[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
  let u = [w[1] * ref[2] - w[2] * ref[1], w[2] * ref[0] - w[0] * ref[2], w[0] * ref[1] - w[1] * ref[0]];
  const ul = Math.hypot(u[0], u[1], u[2]) || 1;
  u = [u[0] / ul, u[1] / ul, u[2] / ul];
  const v = [w[1] * u[2] - w[2] * u[1], w[2] * u[0] - w[0] * u[2], w[0] * u[1] - w[1] * u[0]];
  const V = viewDir(P);
  const quads = [];
  const ringPoint = (p, ang) => [
    p[0] + r * (u[0] * Math.cos(ang) + v[0] * Math.sin(ang)),
    p[1] + r * (u[1] * Math.cos(ang) + v[1] * Math.sin(ang)),
    p[2] + r * (u[2] * Math.cos(ang) + v[2] * Math.sin(ang)),
  ];
  for (let i = 0; i < steps; i++) {
    const a0 = (i / steps) * Math.PI * 2;
    const a1 = ((i + 1) / steps) * Math.PI * 2;
    const am = (a0 + a1) / 2;
    const n = [
      u[0] * Math.cos(am) + v[0] * Math.sin(am),
      u[1] * Math.cos(am) + v[1] * Math.sin(am),
      u[2] * Math.cos(am) + v[2] * Math.sin(am),
    ];
    if (n[0] * V[0] + n[1] * V[1] + n[2] * V[2] <= 0.02) continue;
    const p0 = ringPoint(a, a0), p1 = ringPoint(b, a0), p2 = ringPoint(b, a1), p3 = ringPoint(a, a1);
    quads.push({ d: pathOf([p0, p1, p2, p3].map((q) => iso(q, P)), true), tone: toneOf(n, P), depth: depthOf(ringPoint([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2], am), P) });
  }
  const cap = (p, sign) => {
    const n = [w[0] * sign, w[1] * sign, w[2] * sign];
    if (n[0] * V[0] + n[1] * V[1] + n[2] * V[2] <= 0.02) return;
    const pts = [];
    for (let i = 0; i < steps; i++) pts.push(ringPoint(p, (i / steps) * Math.PI * 2));
    quads.push({ d: pathOf(pts.map((q) => iso(q, P)), true), tone: toneOf(n, P), depth: depthOf(p, P) });
  };
  cap(a, -1);
  cap(b, 1);
  const rings = circleZ(a[0], a[1], r, a[2], P, steps) + circleZ(b[0], b[1], r, b[2], P, steps);
  return paintQuads(quads, style) + lineSvg(rings, { tone: "lo" });
}

/** 水平面内的平面四边形（叶片、辐板）。 */
function quadZ(points, P, style = {}) {
  const V = viewDir(P);
  const n = [0, 0, 1];
  const facing = n[0] * V[0] + n[1] * V[1] + n[2] * V[2];
  if (facing <= 0.02) return "";
  const mid = points.reduce((s, p) => [s[0] + p[0], s[1] + p[1], s[2] + p[2]], [0, 0, 0]).map((v) => v / points.length);
  const quads = [{ d: pathOf(points.map((q) => iso(q, P)), true), tone: 4, depth: depthOf(mid, P) }];
  return paintQuads(quads, { tone: "mid", ...style });
}

/** 竖直平面内的四边形（叶片、闸板、轴承架）。 */
function quadV(points, P, style = {}) {
  const V = viewDir(P);
  const e1 = [points[1][0] - points[0][0], points[1][1] - points[0][1], points[1][2] - points[0][2]];
  const e2 = [points[3][0] - points[0][0], points[3][1] - points[0][1], points[3][2] - points[0][2]];
  const n = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
  const L = Math.hypot(n[0], n[1], n[2]) || 1;
  const nn = [n[0] / L, n[1] / L, n[2] / L];
  let nx = nn[0], ny = nn[1], nz = nn[2];
  let facing = nx * V[0] + ny * V[1] + nz * V[2];
  if (Math.abs(facing) < 0.02) facing = 0;
  const mid = points.reduce((s, p) => [s[0] + p[0], s[1] + p[1], s[2] + p[2]], [0, 0, 0]).map((v) => v / points.length);
  const quads = [{ d: pathOf(points.map((q) => iso(q, P)), true), tone: toneOf([nx, ny, nz], P), depth: depthOf(mid, P) }];
  return paintQuads(quads, { tone: "mid", ...style });
}

/** 水平面内的一段圆弧线。 */
function arcZ(cx, cy, r, z, a0, a1, P, steps = 24) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const a = a0 + ((a1 - a0) * i) / steps;
    pts.push(iso([cx + r * Math.cos(a), cy + r * Math.sin(a), z], P));
  }
  return pathOf(pts);
}

/** 水平面内的完整圆（线）。 */
function circleZ(cx, cy, r, z, P, steps = 40) {
  return pathOf(circleRing(cx, cy, r, steps).map((p) => iso([p[0], p[1], z], P)), true);
}

/** 水平放置的圆环带（轮辋、碾盘边缘）：外壁 + 内壁 + 上下环面。
 *  a0,a1 可只画一段；yMax 只保留圆心 y 小于它的部分（用于剖切）。 */
function ringBandZ(cx, cy, z0, z1, rOut, rIn, P, style = {}, steps = 32, a0 = 0, a1 = Math.PI * 2, yMax = Infinity) {
  const V = viewDir(P);
  const quads = [];
  const p = (r, a, z) => [cx + r * Math.cos(a), cy + r * Math.sin(a), z];
  for (let i = 0; i < steps; i++) {
    const t0 = a0 + ((a1 - a0) * i) / steps;
    const t1 = a0 + ((a1 - a0) * (i + 1)) / steps;
    const am = (t0 + t1) / 2;
    const midOuter = cy + rOut * Math.sin(am);
    const midInner = cy + rIn * Math.sin(am);
    const midTop = cy + ((rIn + rOut) / 2) * Math.sin(am);
    const no = [Math.cos(am), Math.sin(am), 0];
    if (no[0] * V[0] + no[1] * V[1] > 0.02 && midOuter < yMax)
      quads.push({ d: pathOf([p(rOut, t0, z0), p(rOut, t1, z0), p(rOut, t1, z1), p(rOut, t0, z1)].map((q) => iso(q, P)), true), tone: toneOf(no, P), depth: depthOf([cx + rOut * Math.cos(am), cy + rOut * Math.sin(am), (z0 + z1) / 2], P) });
    const ni = [-Math.cos(am), -Math.sin(am), 0];
    if (ni[0] * V[0] + ni[1] * V[1] > 0.02 && midInner < yMax)
      quads.push({ d: pathOf([p(rIn, t0, z0), p(rIn, t1, z0), p(rIn, t1, z1), p(rIn, t0, z1)].map((q) => iso(q, P)), true), tone: toneOf(ni, P), depth: depthOf([cx + rIn * Math.cos(am), cy + rIn * Math.sin(am), (z0 + z1) / 2], P) });
    const nz = [0, 0, 1];
    if (nz[2] * V[2] > 0.02 && midTop < yMax) {
      quads.push({ d: pathOf([p(rIn, t0, z1), p(rOut, t0, z1), p(rOut, t1, z1), p(rIn, t1, z1)].map((q) => iso(q, P)), true), tone: 4, depth: depthOf([cx + ((rIn + rOut) / 2) * Math.cos(am), cy + ((rIn + rOut) / 2) * Math.sin(am), z1], P) });
      quads.push({ d: pathOf([p(rIn, t0, z0), p(rOut, t0, z0), p(rOut, t1, z0), p(rIn, t1, z0)].map((q) => iso(q, P)), true), tone: 1, depth: depthOf([cx + ((rIn + rOut) / 2) * Math.cos(am), cy + ((rIn + rOut) / 2) * Math.sin(am), z0], P) });
    }
  }
  let svg = paintQuads(quads, style);
  svg += lineSvg(circleZ(cx, cy, rOut, z1, P, steps), { tone: "lo" });
  svg += lineSvg(circleZ(cx, cy, rIn, z1, P, steps), { tone: "lo" });
  return svg;
}

function screw(P, x, y, z, r = 1.35) {
  return lineSvg(circleZ(x, y, r, z, P, 12), { tone: "lo" }) + dotsSvg([iso([x, y, z], P)], { size: 0.36 });
}

/** 一排圆头铆钉 / 销钉。 */
function pins(P, list, size = 0.5) {
  return dotsSvg(list.map((p) => iso(p, P)), { size, tone: "mid" });
}

// dyn.mjs — 随模型变化的部件：卧式水轮、立轴、横臂、石滚轮、水流水花、
// 江水水面、水尺浮标、桐籽堆、草棚。





const S = (paths, style) => solidSvg(paths, style);
const L = (d, style) => (d ? lineSvg(d, style) : "");

/** 一条带流速的虚线（动画时长随模型快慢变化）。 */
function flowPath(d, flow, tone = "lit") {
  const dur = Math.round(1500 / Math.max(0.12, flow));
  return `<path class="iso-line" data-tone="${tone}" data-flow="" style="animation-duration:${dur}ms" d="${d}"/>`;
}

// ── 卧式水轮（水平放置，绕立轴转） ──────────────────────────────────────
function wheelSvg(P, view) {
  const { x, y, z, r, rin, h, blades } = WHEEL;
  const a = view.angle;
  const z0 = z - h / 2;
  const z1 = z + h / 2;
  let svg = "";
  // 轮毂
  svg += S(cylinder(x, y, rin + 0.6, z0 - 0.5, h + 1.0, P, 18), { tone: "lit" });
  // 叶片：竖直薄板，沿半径方向
  for (let k = 0; k < blades; k++) {
    const th = a + (k / blades) * Math.PI * 2;
    const c = Math.cos(th), s = Math.sin(th);
    const p = (rr, zz) => [x + rr * c, y + rr * s, zz];
    svg += quadV([p(rin, z0), p(r, z0), p(r, z1), p(rin, z1)], P, { tone: k % 2 ? "lit" : "hi" });
    svg += L(segment(p(r, z0), p(r, z1), P), { tone: "lit" });
  }
  // 轮辋
  svg += ringBandZ(x, y, z0, z1, r, r - 0.8, P, { tone: "hi" }, 28);
  svg += L(circleZ(x, y, rin + 0.6, z1, P, 20), { tone: "lit" });
  return svg;
}

// ── 立轴（下端落在轴承石上，上端穿过吊轴轴承） ──────────────────────────
function shaftSvg(P, view) {
  const { x, y, r, z0, z1 } = SHAFT;
  let svg = S(cylinder(x, y, r, z0, z1 - z0, P, 14), { tone: "hi" });
  const a = view.angle;
  // 转动记号：轴面一条通长的棱线
  svg += L(segment([x + r * Math.cos(a), y + r * Math.sin(a), z0 + 2], [x + r * Math.cos(a), y + r * Math.sin(a), z1 - 3], P), { tone: "lo" });
  // 轴承处加两道箍
  for (const zc of [WHEEL.z + 4, ROLLER.z + 6]) svg += L(circleZ(x, y, r + 0.4, zc, P, 14), { tone: "mid" });
  return svg;
}

// ── 横臂 + 石滚轮（滚轮轴沿横臂方向，即沿半径） ──────────────────────────
function armSvg(P, view) {
  const a = view.angle;
  const c = Math.cos(a), s = Math.sin(a);
  const hx = SHAFT.x, hy = SHAFT.y;
  const cx = hx + ROLLER.orbit * c;
  const cy = hy + ROLLER.orbit * s;
  const z = ROLLER.z;
  let svg = "";
  svg += S(cylinder(hx, hy, SHAFT.r + 2.2, z - 2.4, 4.8, P, 16), { tone: "mid" });
  // 臂：从轴套沿半径伸到滚轮轴心
  svg += cylAxis([hx, hy, z], [cx, cy, z], 1.9, P, { tone: "hi" }, 12);
  // 斜撑
  svg += cylAxis([hx, hy, z + 9], [hx + (cx - hx) * 0.5, hy + (cy - hy) * 0.5, z + 0.6], 1.0, P, { tone: "mid" }, 10);
  // 滚轮轴（沿半径方向伸出，穿过滚轮）
  svg += cylAxis([cx - c * (ROLLER.half + 2.6), cy - s * (ROLLER.half + 2.6), z], [cx + c * (ROLLER.half + 2.6), cy + s * (ROLLER.half + 2.6), z], 1.0, P, { tone: "mid" }, 12);
  return svg;
}

function rollerSvg(P, view) {
  const a = view.angle;
  const c = Math.cos(a), s = Math.sin(a);
  const cx = SHAFT.x + ROLLER.orbit * c;
  const cy = SHAFT.y + ROLLER.orbit * s;
  const z = ROLLER.z;
  const d = [c, s, 0]; // 半径方向 = 轮轴方向
  const A = [cx - d[0] * ROLLER.half, cy - d[1] * ROLLER.half, z];
  const B = [cx + d[0] * ROLLER.half, cy + d[1] * ROLLER.half, z];
  let svg = cylAxis(A, B, ROLLER.r, P, { tone: "hi" }, 20);
  // 转动记号：绕面一条棱（u 竖直，v 切向）
  const u = [0, 0, 1];
  const v = [-s, c, 0];
  const psi = view.rollerAngle || 0;
  const off = [0, 1, 2].map((i) => ROLLER.r * (u[i] * Math.cos(psi) + v[i] * Math.sin(psi)));
  svg += L(pathOf([iso([A[0] + off[0], A[1] + off[1], A[2] + off[2]], P), iso([B[0] + off[0], B[1] + off[1], B[2] + off[2]], P)]), { tone: "lo" });
  // 碾磨面上的凿槽
  for (const k2 of [-0.55, 0.55]) {
    const zz = z + ROLLER.r * k2;
    svg += L(pathOf([iso([A[0], A[1], zz], P), iso([B[0], B[1], zz], P)]), { tone: "faint", free: true });
  }
  return svg;
}

/** 碾盘上的桐籽堆（带载时出现），落在碾槽里、石滚轮前面。 */
function grainSvg(P, view) {
  if (!view.load) return "";
  const a = view.angle + 0.9;
  const rr = ROLLER.orbit;
  const cx = SHAFT.x + rr * Math.cos(a);
  const cy = SHAFT.y + rr * Math.sin(a);
  let svg = "";
  for (let i = 0; i < 3; i++) {
    const r2 = 4.6 - i * 1.3;
    svg += S(cylinder(cx, cy, r2, BAR_TOP + i * 0.85, 0.95, P, 16), { tone: i ? "mid" : "lo" });
  }
  svg += dotsSvg([iso([cx, cy, BAR_TOP + 2.7], P)], { size: 1.0, tone: "mid" });
  return svg;
}

// ── 江水：线描水面，南汊高、北汊低；洪水时整体抬升 ──────────────────────
// 不用实心水色块。水面是一圈轮廓、几道虚线波纹和点状水花。
function waterSheet(P, view, plan, zTop, name) {
  const rise = (view.flood || 0) * FLOOD_RISE * U;
  const z = zTop + rise;
  const x0 = plan.x, x1 = plan.x + plan.w, y0 = plan.y, y1 = plan.y + plan.d;
  const corner = (x, y) => iso([x, y, z], P);
  let svg = "";
  svg += L(pathOf([corner(x0, y0), corner(x1, y0), corner(x1, y1), corner(x0, y1)], true), { tone: "water" });
  // 靠沙洲的岸线加一道，读出水面贴着洲边
  svg += L(pathOf([corner(x0 + 2, y0 + (name === "south" ? 1.2 : plan.d - 1.2)), corner(x1 - 2, y0 + (name === "south" ? 1.2 : plan.d - 1.2))]), { tone: "water" });
  const rows = name === "south" ? [0.28, 0.55, 0.8] : [0.32, 0.68];
  for (const yr of rows) {
    const y = y0 + plan.d * yr;
    const span = plan.w * 0.72;
    const x = x0 + plan.w * 0.1;
    svg += L(pathOf([iso([x, y, z], P), iso([x + span, y, z], P)]), { tone: "water", dashed: true });
    svg += L(pathOf([iso([x + 6, y + 2.4, z], P), iso([x + span * 0.55, y + 2.4, z], P)]), { tone: "water", dashed: true });
  }
  const specks = name === "south"
    ? [[0.18, 0.4], [0.42, 0.62], [0.7, 0.36], [0.86, 0.7], [0.3, 0.82]]
    : [[0.22, 0.4], [0.55, 0.55], [0.78, 0.32]];
  svg += dotsSvg(specks.map(([xr, yr]) => iso([x0 + plan.w * xr, y0 + plan.d * yr, z], P)), { size: 0.55, tone: "water" });
  return svg;
}
function southWaterSvg(P, view) {
  const rise = (view.flood || 0) * FLOOD_RISE * U;
  const z = HS + rise;
  const yBank = BAR.y + BAR.d;
  // 南汊画在沙洲南岸外侧，整片都看得见，不埋进洲体
  const plan = { x: -16, y: yBank + 1, w: 46, d: 18 };
  let svg = waterSheet(P, view, plan, HS, "south");
  for (const xr of [0.15, 0.4, 0.65, 0.88]) {
    const x = plan.x + plan.w * xr;
    svg += L(pathOf([iso([x, yBank, BAR_TOP - 0.4], P), iso([x, yBank + 1, z], P)]), { tone: "water" });
  }
  return svg;
}
function northWaterSvg(P, view) {
  // 北汊贴在沙洲北缘外侧（y 比洲边更北），整片露在洲面之下
  // 北汊画在碾房西北的低台上，整片露在洲面之下
  const plan = { x: 2, y: -22, w: 38, d: 12 };
  return waterSheet(P, view, plan, HN, "north");
}

/** 水尺旁的两道水位：南高、北低，竖线标出两者的高差。 */
function dropSvg(P, view) {
  const rise = (view.flood || 0) * FLOOD_RISE * U;
  const zs = HS + rise;
  const zn = HN + rise;
  const x = GAUGE.x + 3.2;
  const y = GAUGE.y;
  let svg = "";
  svg += L(pathOf([iso([x - 1, y, zs], P), iso([x + 7, y, zs], P)]), { tone: "lit" });
  svg += L(pathOf([iso([x - 1, y, zn], P), iso([x + 7, y, zn], P)]), { tone: "hi" });
  svg += L(pathOf([iso([x + 5.4, y, zn], P), iso([x + 5.4, y, zs], P)]), { tone: "lit" });
  for (let i = 1; i <= 3; i++) {
    const z = zn + ((zs - zn) * i) / 4;
    svg += L(pathOf([iso([x + 5.4, y, z], P), iso([x + 7.2, y, z], P)]), { tone: "mid" });
  }
  svg += dotsSvg([iso([x + 7.4, y, zs], P), iso([x + 7.4, y, zn], P)], { size: 0.9, tone: "lit" });
  return svg;
}

// ── 水尺：南汊与北汊两道浮标，刻度在 art 里 ─────────────────────────────
function gaugeFloatSvg(P, view) {
  const rise = (view.flood || 0) * FLOOD_RISE * U;
  let svg = "";
  const mark = (z, len) => pathOf([iso([GAUGE.x - 0.4, GAUGE.y, z], P), iso([GAUGE.x + len, GAUGE.y, z], P)]);
  svg += L(mark(HS + rise, 6.4), { tone: "lit" });
  svg += L(mark(HN + rise, 6.4), { tone: "hi" });
  svg += dotsSvg([iso([GAUGE.x + 7.2, GAUGE.y, HS + rise], P)], { size: 1.05, tone: "lit" });
  svg += dotsSvg([iso([GAUGE.x + 7.2, GAUGE.y, HN + rise], P)], { size: 1.05, tone: "hi" });
  // 两标之间的竖线，把落差连起来，中间写上模型给出的米数
  svg += L(pathOf([iso([GAUGE.x + 5.6, GAUGE.y, HN + rise], P), iso([GAUGE.x + 5.6, GAUGE.y, HS + rise], P)]), { tone: "lit" });
  const [mx, my] = iso([GAUGE.x + 6.2, GAUGE.y, (HS + HN) / 2 + rise], P);
  svg += `<text class="iso-face-text fig-tag" data-tone="hi" x="${(mx + 46).toFixed(1)}" y="${(my + 14).toFixed(1)}" font-size="12" text-anchor="start">${view.head.toFixed(2)} m</text>`;
  return svg;
}

// ── 冲击水轮的射流与尾水 ────────────────────────────────────────────────
function jetSvg(P, view) {
  let svg = "";
  const jets = [];
  if (view.open1) jets.push(INLETS[0]);
  if (view.open2) jets.push(INLETS[1]);
  for (const inlet of jets) {
    const mouthZ = HS + (view.flood || 0) * FLOOD_RISE * U - 1.2;
    const from = [inlet.x, 8, mouthZ];
    const to = [inlet.x + (inlet.x < SHAFT.x ? 1.4 : -1.4), SHAFT.y + 5.4, WHEEL.z + 1.2];
    const d = pathOf([iso(from, P), iso(to, P)]);
    svg += flowPath(d, view.flow, "lit");
    // 溅水
    for (let i = 1; i <= 3; i++) {
      const f = i / 4;
      svg += dotsSvg([iso([from[0] + (to[0] - from[0]) * f, from[1] + (to[1] - from[1]) * f, from[2] + (to[2] - from[2]) * f], P)], { size: 0.42, tone: "hi" });
    }
  }
  return svg;
}

function tailSvg(P, view) {
  const rise = (view.flood || 0) * FLOOD_RISE * U;
  const z = PIT.floorZ + 0.5;
  const d = pathOf([
    iso([SHAFT.x, PIT.y0 + 3, z + 0.4], P),
    iso([SHAFT.x, TAILRACE.y + 2, TAILRACE.z + 0.4], P),
    iso([SHAFT.x, NORTH.y + 8, HN + rise + 0.4], P),
  ]);
  return flowPath(d, view.flow, "mid");
}

/** 碾房草棚：默认只留北侧远坡，近侧被剖去。洪水与拆解时整坡移走。 */
function roofSvg(P) {
  const x0 = HOUSE.x0 - 2, x1 = HOUSE.x1 + 2;
  const ry = ROOF_RIDGE_Y, ey = ROOF_NEAR;
  const rz = ROOF_RIDGE_Z, ez = ROOF_EAVE_Z;
  let svg = "";
  const steps = 5;
  for (let i = 0; i < steps; i++) {
    const ya = ry + ((ey - ry) * i) / steps;
    const yb = ry + ((ey - ry) * (i + 1)) / steps;
    const za = rz + ((ez - rz) * i) / steps;
    const zb = rz + ((ez - rz) * (i + 1)) / steps;
    svg += quadV([[x0, ya, za], [x1, ya, za], [x1, yb, zb], [x0, yb, zb]], P, { tone: i % 2 ? "mid" : "hi" });
    for (const xr of [0.12, 0.28, 0.44, 0.6, 0.76, 0.9]) {
      const xx = x0 + (x1 - x0) * xr;
      svg += L(pathOf([iso([xx, ya, za + 0.35], P), iso([xx, yb, zb + 0.35], P)]), { tone: "faint" });
    }
    svg += L(pathOf([iso([x0 + 1, yb, zb + 0.5], P), iso([x1 - 1, yb, zb + 0.5], P)]), { tone: "lo" });
  }
  // 剖切边：近檐是一条被切断的檩，两端用点收住
  svg += cylAxis([x0, ey, ez], [x1, ey, ez], 0.7, P, { tone: "hi" }, 8);
  svg += dotsSvg([iso([x0, ey, ez], P), iso([x1, ey, ez], P)], { size: 0.7, tone: "hi" });
  svg += cylAxis([x0 - 1, ry, rz + 0.5], [x1 + 1, ry, rz + 0.5], 0.9, P, { tone: "hi" }, 8);
  return svg;
}

// live.js — 拖水位差、开合进水孔、发洪水、拆解、自动演示，全部读数来自 model.mjs。
const DATA = {"P":{"origin":[307.20728906557247,326.89868261587753],"scale":4.956078127603439,"azimuth":48,"elevation":36}};
const P = DATA.P;
const stage = document.querySelector(".zw-stage");
const svg = stage.querySelector("svg");
const readoutEl = document.querySelector("[data-readout]");
const tools = document.querySelector(".zw-tools");
const still = matchMedia("(prefers-reduced-motion: reduce)");

const node = (id) => svg.querySelector("#" + id);
const el = {
  wheel: node("wheel"), shaft: node("shaft"), arm: node("arm"), roller: node("roller"),
  grain: node("grain"), southWater: node("water-south"), northWater: node("water-north"),
  drop: node("drop"),
  jet: node("jet"), tail: node("tail"), gaugeMark: node("gauge-mark"),
  roof: node("roof"), hopper: node("hopper"), hang: node("hang"), bed: node("bed"),
  flume1: node("flume-1"), flume2: node("flume-2"), chute: node("chute"),
  gate1: node("gate1"), gate2: node("gate2"),
};

let head = 1.12;
let o1 = true;
let o2 = true;
let load = 0;
let flood = 0;
let explode = 0;
let explodeTarget = 0;
let roofAmt = 1;
let roofTarget = 1;
let angle = 0;
let rollerAngle = 0;
let touring = false;
let tourStart = 0;
let frame = 0;
let last = 0;
let visible = true;
const shown = { key: "", trans: "" };

const follow = (value, target, dt, tau, calm) => {
  if (calm) return target;
  const next = value + (target - value) * (1 - Math.exp(-dt / tau));
  return Math.abs(target - next) < 0.003 ? target : next;
};

function currentView() {
  return { ...solve({ head, o1, o2, load, flood }), angle, rollerAngle, roof: roofAmt, explode };
}

function burstOffset(name, amount) {
  const v = BURST[name] || [0, 0, 0];
  return [v[0] * amount, v[1] * amount, v[2] * amount];
}
function addOffset(a, b) {
  return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
}

function paint(view, calm) {
  const key = [
    Math.round(view.angle * 40),
    Math.round(view.rollerAngle * 40),
    view.open1 ? 1 : 0,
    view.open2 ? 1 : 0,
    view.load,
    Math.round(view.flood * 20),
    Math.round(explode * 40),
    Math.round(roofAmt * 40),
  ].join("|");
  if (shown.key !== key) {
    shown.key = key;
    el.wheel.innerHTML = wheelSvg(P, view);
    el.shaft.innerHTML = shaftSvg(P, view);
    el.arm.innerHTML = armSvg(P, view);
    el.roller.innerHTML = rollerSvg(P, view);
    el.grain.innerHTML = grainSvg(P, view);
    el.southWater.innerHTML = southWaterSvg(P, view);
    el.northWater.innerHTML = northWaterSvg(P, view);
    el.drop.innerHTML = dropSvg(P, view);
    el.jet.innerHTML = jetSvg(P, view);
    el.tail.innerHTML = tailSvg(P, view);
    el.gaugeMark.innerHTML = gaugeFloatSvg(P, view);
  }

  // 拆解 / 洪水位移：折算成一个世界位移再转成屏幕平移
  const fly = 1 - roofAmt;
  const e = explode;
  const offset = (name, extra = [0, 0, 0]) => translateAlong(P, addOffset(burstOffset(name, e), extra));
  const trans = [
    "roof:" + offset("roof", [fly * 26, -fly * 30, fly * 34]),
    "hopper:" + offset("hopper"),
    "chute:" + offset("hopper"),
    "hang:" + offset("hang"),
    "bed:" + offset("bed"),
    "flume1:" + offset("flume"),
    "flume2:" + offset("flume"),
    "arm:" + offset("arm"),
    "roller:" + offset("roller"),
    "wheel:" + offset("wheel"),
    "tail:" + offset("tail"),
    "gate1:" + offset("gate1", [0, 0, gateLift(view.open1)]),
    "gate2:" + offset("gate2", [0, 0, gateLift(view.open2)]),
  ].join(";");
  if (shown.trans !== trans) {
    shown.trans = trans;
    const map = {
      roof: el.roof, hopper: el.hopper, chute: el.chute, hang: el.hang, bed: el.bed, flume1: el.flume1, flume2: el.flume2,
      arm: el.arm, roller: el.roller, wheel: el.wheel, tail: el.tail, gate1: el.gate1, gate2: el.gate2,
    };
    for (const entry of trans.split(";")) {
      const [id, transform] = entry.split(":");
      const target = map[id];
      if (target) target.setAttribute("transform", transform);
    }
  }
  void calm;
}

/** 闸门打开时向上提起多少（世界单位；闭=0）。 */
function gateLift(open) {
  return open ? 8.5 : 0;
}

function say(view) {
  const text = readout(view);
  if (readoutEl.textContent !== text) readoutEl.textContent = text;
  const headEl = tools.querySelector("[data-head]");
  if (headEl) headEl.textContent = `${view.head.toFixed(2)} m`;
  const headIn = tools.querySelector('[data-act="head"]');
  if (headIn && document.activeElement !== headIn) headIn.value = String(view.head);
  const pressed = (act, on) => {
    const button = tools.querySelector(`[data-act="${act}"]`);
    if (button) button.setAttribute("aria-pressed", on ? "true" : "false");
  };
  pressed("i1", view.open1);
  pressed("i2", view.open2);
  pressed("flood", !!view.flood);
  pressed("load", !!view.load);
  pressed("explode", explodeTarget > 0.5);
  pressed("tour", touring);
  stage.setAttribute("aria-valuetext", text);
}

function applyView(v) {
  head = v.head;
  o1 = v.open1;
  o2 = v.open2;
  load = v.load;
  flood = v.flood;
  explodeTarget = v.explode || 0;
  roofTarget = v.roof ?? 1;
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring && !calm) {
    const pose = poseAt(now / 1000 - tourStart);
    applyView(pose);
    angle = pose.angle;
    rollerAngle = pose.angle * (ROLLER.orbit / ROLLER.r);
  } else {
    const v = solve({ head, o1, o2, load, flood });
    angle += v.omega * dt;
    rollerAngle += v.omega * (ROLLER.orbit / ROLLER.r) * dt;
  }
  explode = follow(explode, explodeTarget, dt, 0.14, calm);
  roofAmt = follow(roofAmt, roofTarget, dt, 0.5, calm);
  const view = currentView();
  paint(view, calm);
  say(view);
  const moving = Math.abs(explode - explodeTarget) > 0.005 || Math.abs(roofAmt - roofTarget) > 0.005 || view.rpm > 0.05 || touring;
  frame = visible && moving ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

const stopTour = () => {
  touring = false;
  const button = tools.querySelector('[data-act="tour"]');
  if (button) button.setAttribute("aria-pressed", "false");
};

stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (["1", "2", "f", "F", "e", "E", "l", "L", "ArrowLeft", "ArrowRight", " "].includes(key)) event.preventDefault();
  else return;
  stopTour();
  if (key === "1") o1 = !o1;
  else if (key === "2") o2 = !o2;
  else if (key === " " || key === "f" || key === "F") { flood = flood ? 0 : 1; roofTarget = flood ? 0 : 1; }
  else if (key === "e" || key === "E") explodeTarget = explodeTarget > 0.5 ? 0 : 1;
  else if (key === "l" || key === "L") load = load ? 0 : 1;
  else if (key === "ArrowLeft") head = Math.max(0, head - 0.04);
  else if (key === "ArrowRight") head = Math.min(1.6, head + 0.04);
  run();
});

tools.addEventListener("pointerdown", (event) => event.stopPropagation());
tools.addEventListener("input", (event) => {
  const act = event.target.closest("[data-act]")?.dataset.act;
  stopTour();
  if (act === "head") head = Number(event.target.value);
  run();
});
tools.addEventListener("click", (event) => {
  const act = event.target.closest("[data-act]")?.dataset.act;
  if (!act || act === "head") return;
  if (act === "tour") {
    touring = !touring;
    if (touring) {
      tourStart = performance.now() / 1000;
      roofAmt = 1; roofTarget = 1;
    }
    run();
    return;
  }
  if (act === "theme") {
    const next = document.body.dataset.theme === "dark" ? "light" : "dark";
    document.body.dataset.theme = next;
    event.target.textContent = next === "dark" ? "浅色" : "深色";
    return;
  }
  stopTour();
  if (act === "i1") o1 = !o1;
  else if (act === "i2") o2 = !o2;
  else if (act === "flood") { flood = flood ? 0 : 1; roofTarget = flood ? 0 : 1; }
  else if (act === "load") load = load ? 0 : 1;
  else if (act === "explode") explodeTarget = explodeTarget > 0.5 ? 0 : 1;
  run();
});

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "80px 0px" }).observe(stage);

if (new URLSearchParams(location.search).get("demo") === "1" && !still.matches) {
  touring = true;
  tourStart = performance.now() / 1000;
}

paint(currentView(), true);
say(currentView());
run();

// 追加到 zhongan-water-mills/live.js 末尾后重建（未并入，本文件仅作建议）。
window.__fig = {
  setState(t) {
    stopTour();
    const pose = poseAt(t);
    applyView(pose);
    angle = pose.angle;
    rollerAngle = pose.angle * (ROLLER.orbit / ROLLER.r);
    explode = pose.explode || 0;
    roofAmt = pose.roof ?? 1;
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
    shown.key = "";
    const v = currentView();
    paint(v, true);
    say(v);
  },
  getDuration: () => DEMO_LOOP,
};
</script></body></html>
