</ol><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>正在动作的那一件：发热盘、浮子或限压阀</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>内锅、水与食物</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>外壳、锅盖与控制盒</span></span><span class="iso-caption">示意，不是某一台电压力锅的实测。锅的尺寸、默认设定压力 70 kPa（表压）、升温快慢都是为了把步骤看清楚。水的沸点随压力升高，这是物理事实；页面上的沸点用 Antoine 高段由绝对压力反算，绝对压力 = 101.3 kPa + 表压，标「示意，约±1°C」，对照蒸汽表大约差 1°C。约 70 kPa 表压时沸点约 115–116°C，约 100 kPa 表压约 120°C，约 112 kPa 表压约 122°C。真机的设定压力和控制方式各不相同，有的靠限压阀，有的靠压力传感器关断加热。这里只讲原理：密封后水蒸气出不去，压力升高，沸点跟着升高，所以水能热过 100°C 还不开锅。浮子升起后盖被锁住。限压阀在设定压力抬起，放掉多余蒸汽，压力就停在设定值。泄压要慢慢来。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {

// model.mjs — 电压力锅，纯数字，不含绘制。
// 尺寸、设定压力、沸点都是示意，不是某一台锅的实测。
// 沸点用 Antoine 高段（约 99–374°C）由绝对压力反算，标「示意，约±1°C」。
// 物理事实：水的沸点随压力升高。来源是标准蒸汽表 / Antoine 估算。

const P_ATM = 101.325; // kPa，绝对
const SET_KPA = 70; // 表压，示意默认设定
const LOCK_ON = 28; // 表压高于此，浮子升起，盖锁住（示意，真机更低）
const LOCK_OFF = 6; // 表压回到此以下，浮子落下，才能开盖
const VENT_BAND = 1.6; // 限压阀在设定值附近抬起泄压
const T_AMBIENT = 25;
const T_MAX = 124;
const HEAT_TAU = 10.4; // 秒，满功率时的升温时间常数（示意，放慢给视频看）
const COOL_TAU = 48; // 断电后的冷却（示意）
const RELEASE_RATE = 9; // kPa/s，泄压按钮慢慢放气
const DEMO_LEN = 42;

const A_ANTOINE = 8.14019;
const B_ANTOINE = 1810.94;
const C_ANTOINE = 244.485;

function clamp(v, a, b) {
  return Math.min(b, Math.max(a, Number.isFinite(v) ? v : a));
}

/** 饱和蒸汽压，kPa 绝对。Antoine：log10(P_mmHg) = A − B/(C+T)。 */
function vaporPressureKPa(tC) {
  const t = clamp(tC, 0.01, 373);
  const logMm = A_ANTOINE - B_ANTOINE / (C_ANTOINE + t);
  return (10 ** logMm) * 0.133322368;
}

/**
 * 由绝对压力反算沸点，°C。
 * 把 Antoine 对 T 解开：T = B / (A − log10(P_mmHg)) − C。
 */
function boilingPointC(pAbsKPa) {
  const p = Math.max(0.8, pAbsKPa);
  const mmHg = p / 0.133322368;
  const logMm = Math.log10(mmHg);
  const denom = A_ANTOINE - logMm;
  if (!(denom > 0.05)) return 374;
  return B_ANTOINE / denom - C_ANTOINE;
}

/** 密封时，该水温对应的表压。开口时为 0。 */
function gaugeFromTemp(tC, sealed) {
  if (!sealed) return 0;
  return Math.max(0, vaporPressureKPa(tC) - P_ATM);
}

function initialState() {
  return {
    heat: 0,
    temp: T_AMBIENT,
    pressure: 0,
    sealed: true,
    releasing: false,
    setKPa: SET_KPA,
    floatUp: false,
    locked: false,
    venting: false,
    t: 0,
  };
}

/**
 * 推进一步。input: { dt, heat, sealed, releasing, setKPa }
 * 顺序：功率 → 水温 → 饱和表压 → 限压阀在设定值稳住 → 泄压慢慢下降
 * → 浮子（滞回）→ 锁盖。
 */
function step(state, input = {}) {
  const dt = clamp(input.dt ?? 1 / 60, 0, 0.05);
  const heat = clamp(input.heat ?? state.heat, 0, 1);
  const sealed = input.sealed !== undefined ? !!input.sealed : state.sealed;
  const releasing = !!(input.releasing ?? state.releasing) && sealed;
  const setKPa = clamp(input.setKPa ?? state.setKPa, 20, 120);

  let temp = state.temp;
  const target = T_AMBIENT + heat * (T_MAX - T_AMBIENT);
  const tau = heat > 0.02 ? HEAT_TAU / Math.max(0.25, heat) : COOL_TAU;
  // 限压泄放或手动泄压时，蒸汽带走热量，水温跟着设定沸点走，不再往上冲。
  temp += ((target - temp) / tau) * dt;

  let pressure = gaugeFromTemp(temp, sealed);
  let venting = false;

  if (!sealed) {
    pressure = 0;
    venting = false;
  } else if (releasing) {
    pressure = Math.max(0, Math.min(pressure, state.pressure) - RELEASE_RATE * dt);
    venting = pressure > 0.4;
    // 放气时水温被拉回当前压力下的沸点，汤才不会过热爆沸。
    const cap = boilingPointC(P_ATM + pressure);
    if (temp > cap) temp = cap;
  } else if (pressure >= setKPa - 0.05) {
    pressure = setKPa;
    venting = true;
    const cap = boilingPointC(P_ATM + setKPa);
    if (temp > cap) temp += (cap - temp) * Math.min(1, dt * 2.4);
  }

  // 浮子滞回：升起后要等压力回到近零才落下。
  let floatUp = state.floatUp;
  if (!sealed || pressure <= LOCK_OFF) floatUp = false;
  else if (pressure >= LOCK_ON) floatUp = true;
  const locked = sealed && floatUp;

  return {
    heat,
    temp,
    pressure,
    sealed,
    releasing: releasing && pressure > 0.15,
    setKPa,
    floatUp,
    locked,
    venting,
    t: (state.t || 0) + dt,
  };
}

/** 从初态按固定步长积分到 t 秒。同一 t 得到同一状态。 */
function integrate(t, inputFor) {
  const steps = Math.max(0, Math.round(clamp(t, 0, 600) * 60));
  let s = initialState();
  for (let i = 0; i < steps; i++) {
    const at = i / 60;
    s = step(s, { dt: 1 / 60, ...inputFor(at, s) });
  }
  return s;
}

/**
 * 演示时间轴，与 script.json 同一条（42 s）。
 * 0–4 钩子：温水，未加压。
 * 4–14 ①加热升温：功率拉满，水温往沸点爬，表压仍近零。
 * 14–23 ②密封增压：越过 100°C，蒸汽出不去，表压爬升，浮子还没到锁阈。
 * 23–31 ③浮子阀锁盖：表压过锁阈，浮子升起，盖锁住，限压阀仍关着。
 * 31–38 ④限压阀抬起，压力稳在设定值。
 * 38–42 收束：压力保持，镜头回到全锅。
 */
function demoInput(at) {
  const u = clamp(at, 0, DEMO_LEN);
  let heat = 0.08;
  let releasing = false;
  let explode = 0;
  let stepId = "hook";
  if (u < 4) {
    heat = 0;
    stepId = "hook";
  } else if (u < 14) {
    heat = 1;
    stepId = "heat";
  } else if (u < 23) {
    heat = 1;
    stepId = "seal";
  } else if (u < 31) {
    heat = 1;
    stepId = "lock";
  } else if (u < 38) {
    heat = 1;
    stepId = "hold";
  } else {
    heat = 0.9;
    stepId = "outro";
  }
  return { heat, sealed: true, releasing, setKPa: SET_KPA, explode, stepId };
}

function stateAt(t) {
  const at = clamp(t, 0, DEMO_LEN);
  const s = integrate(at, (u) => demoInput(u));
  const meta = demoInput(Math.max(0, at - 1 / 120));
  return { ...s, explode: meta.explode, stepId: meta.stepId };
}

const STEPS = [
  { id: "heat", mark: "①", title: "加热升温", callout: "发热盘", note: "发热盘给内锅加热，水温上升，盖还松着，表压几乎是零。" },
  { id: "seal", mark: "②", title: "密封增压", callout: "密封圈", note: "盖上的硅胶圈把水蒸气关在锅里，出不去，压力就升。" },
  { id: "lock", mark: "③", title: "浮子阀阻锁盖", callout: "浮子阀", note: "压力把浮子顶起来，锁舌伸进锁盖爪，有压时盖打不开。" },
  { id: "hold", mark: "④", title: "限压阀泄压稳压", callout: "限压阀", note: "压力到了设定值，限压阀抬起放掉多余蒸汽，压力停在设定值。" },
];

function stepOf(id) {
  return STEPS.find((s) => s.id === id) || null;
}

/** 画面上的大标题。钩子和收束不占这行；静帧按它的中间态算作 ①加热升温。 */
function pictureTitle(s) {
  if (!s) return "";
  const step = stepOf(s.poster ? STEPS[0].id : s.stepId);
  return step ? `${step.mark}${step.title}` : "";
}

/**
 * 打开页面时的静帧：已经在加热，表压刚离开零，浮子还没起来。
 * 压力和沸点仍由 Antoine 算出，不手填。演示时间轴不从这里积分。
 */
function posterState() {
  const temp = 102;
  const pressure = gaugeFromTemp(temp, true);
  return {
    heat: 0.66,
    temp,
    pressure,
    sealed: true,
    releasing: false,
    setKPa: SET_KPA,
    floatUp: false,
    locked: false,
    venting: false,
    t: 0.4,
    stepId: "hook",
    poster: true,
  };
}

function readout(s) {
  const p = Math.max(0, s.pressure);
  const boil = boilingPointC(P_ATM + p);
  const pTxt = p.toFixed(1);
  const bTxt = boil.toFixed(1);
  const lock = s.locked ? "盖已锁" : "盖可开";

function arcPts(cx, cy, r, a0, a1, steps = 32) {
  const out = [];
  const n = Math.max(2, steps);
  for (let i = 0; i <= n; i++) {
    const a = a0 + ((a1 - a0) * i) / n;
    out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return out;
}

  return [...arcPts(cx, cy, r, a0, a1, steps), [cx, cy]];

  const outer = arcPts(cx, cy, rOut, 0, Math.PI * 2, steps).slice(0, -1);
  const inner = arcPts(cx, cy, rIn, Math.PI * 2, 0, steps).slice(0, -1);
  return [...outer, ...inner];
}

/** 半环：外弧走到头，内弧折回。两个端口落在剖切面上，能看见壁厚。 */
function halfBand(cx, cy, rIn, rOut, a0, a1, steps = 36) {
  return [...arcPts(cx, cy, rOut, a0, a1, steps), ...arcPts(cx, cy, rIn, a1, a0, steps)];

function disc(cx, cy, r, z, h, P, style = {}, steps = 40) {

function rib(x0, y0, x1, y1, z, h, w, P, style = {}) {

  const dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 1;
  const px = (-dy / len) * w;
  const py = (dx / len) * w;
  const ring = [
    [x0 + px, y0 + py],
    [x1 + px, y1 + py],
    [x1 - px, y1 - py],
    [x0 - px, y0 - py],

  return prism(ring, z, h, P, { convex: true, ...style });

function ellipsePath(cx, cy, r, z, P, steps = 40) {

}

function lightDir(P) {

  const x = -sinA;
  const y = cosA;
  const z = 1.15;
  const L = Math.hypot(x, y, z) || 1;
  return [x / L, y / L, z / L];

  const cls = style.className ? `iso-solid ${style.className}` : "iso-solid";

  const alive = (a) => (keep ? keep(a) : true);
  for (let j = 0; j < rings; j++) {
    const u0 = j / rings;
    const u1 = (j + 1) / rings;

    const zB = z0 + rise * Math.sin(u1 * Math.PI * 0.5);
    const rA = r * Math.cos(u0 * Math.PI * 0.5);
    const rB = r * Math.cos(u1 * Math.PI * 0.5);

      const a0 = (i / steps) * Math.PI * 2 - Math.PI;
      const a1 = ((i + 1) / steps) * Math.PI * 2 - Math.PI;

      const pts = [p(rA, a0, zA), p(rA, a1, zA), p(rB, a1, zB), p(rB, a0, zB)];
      const mid = pts.reduce((s, q) => [s[0] + q[0], s[1] + q[1], s[2] + q[2]], [0, 0, 0]).map((v) => v / 4);
      const normal = [Math.cos(am) * 0.75, Math.sin(am) * 0.75, 0.65];
      const N = Math.hypot(...normal) || 1;
      const n = normal.map((v) => v / N);
      if (n[0] * V[0] + n[1] * V[1] + n[2] * V[2] <= 0.02) continue;
      quads.push({
        d: pathOf(pts.map((q) => iso(q, P)), true),
        tone: toneOf(n, P),
        depth: depthOf(mid, P),

/** 一段圆线，不再切成许多截，省实体。 */
function cordSvg(points, r, P, style = {}) {

function capsule(a, b, r, P, style) {
  const V = viewDir(P);
  const dx = b[0] - a[0];
  const dy = b[1] - a[1];
  const dz = b[2] - a[2];
  const len = Math.hypot(dx, dy, dz) || 1;
  const ax = [dx / len, dy / len, dz / len];
  const ref = Math.abs(ax[2]) < 0.8 ? [0, 0, 1] : [1, 0, 0];
  let ux = [ax[1] * ref[2] - ax[2] * ref[1], ax[2] * ref[0] - ax[0] * ref[2], ax[0] * ref[1] - ax[1] * ref[0]];
  const ul = Math.hypot(...ux) || 1;
  ux = ux.map((v) => v / ul);
  const uy = [ax[1] * ux[2] - ax[2] * ux[1], ax[2] * ux[0] - ax[0] * ux[2], ax[0] * ux[1] - ax[1] * ux[0]];
  const steps = 8;
  const quads = [];
  for (let i = 0; i < steps; i++) {
    const t0 = (i / steps) * Math.PI * 2;
    const t1 = ((i + 1) / steps) * Math.PI * 2;
    const tm = (t0 + t1) / 2;
    const n = [
      ux[0] * Math.cos(tm) + uy[0] * Math.sin(tm),
      ux[1] * Math.cos(tm) + uy[1] * Math.sin(tm),
      ux[2] * Math.cos(tm) + uy[2] * Math.sin(tm),
    ];
    if (n[0] * V[0] + n[1] * V[1] + n[2] * V[2] <= 0.02) continue;
    const ringAt = (p, t) => [
      p[0] + r * (ux[0] * Math.cos(t) + uy[0] * Math.sin(t)),
      p[1] + r * (ux[1] * Math.cos(t) + uy[1] * Math.sin(t)),
      p[2] + r * (ux[2] * Math.cos(t) + uy[2] * Math.sin(t)),
    ];
    const pts = [ringAt(a, t0), ringAt(b, t0), ringAt(b, t1), ringAt(a, t1)];
    const mid = pts.reduce((s, q) => [s[0] + q[0], s[1] + q[1], s[2] + q[2]], [0, 0, 0]).map((v) => v / 4);
    quads.push({ d: pathOf(pts.map((q) => iso(q, P)), true), tone: toneOf(n, P), depth: depthOf(mid, P) });

}

  return stroke(pathOf([a, base]), { tone: "hi", className: "pc-force" })
    + `<path class="pc-arrow" d="${pathOf([b, left, right], true)}"/>`;
}

function arrowCount(view) {
  if (view.poster || view.stepId === "hook" || view.stepId === "heat") return 0;
  const p = Math.max(0, view.pressure || 0);
  if (lidGap(view) > 2 || p < 4) return 0;
  if (p < 16) return 3;
  if (p < 36) return 4;
  if (p < 56) return 5;
  return 6;
}

function steamHintSvg(P, view) {
  const amt = steamAmount(view);
  const p = Math.max(0, view.pressure || 0);
  const heat = view.heat || 0;
  let svg = "";
  const open = lidGap(view) > 2;
  if (amt > 0 && !open) {
    const top = LID_Z - 1.2;
    const bot = WATER_Z + 3 + (1 - amt) * 6;
    const r = POT_R - POT_WALL - 2;
    svg += `<g opacity="${(0.42 + amt * 0.45).toFixed(2)}">${disc(CX, CY, r, bot, Math.max(6, top - bot), P, { tone: "hi", className: "pc-steam", crease: "none" }, 36)}</g>`;
  }
  if ((open && heat > 0.3) || view.poster || heat > 0.45) {
    const n = 4;
    for (let i = 0; i < n; i++) {
      const a = NEAR + (i - 1.5) * 0.22;
      const rad = 7 + i * 3;
      const [sx, sy] = iso([
        CX + Math.cos(a) * rad,
        CY + Math.sin(a) * rad,
        WATER_Z + 8 + i * 5,
      ], P);
      svg += `<ellipse class="pc-puff" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" rx="${(7 + i * 1.4).toFixed(1)}" ry="${(4.2 + i * 0.5).toFixed(1)}" opacity="${(0.72 - i * 0.1).toFixed(2)}"/>`;
    }
  }
  const n = arrowCount(view);
  if (n > 0) {
    const reach = 12 + Math.min(18, p * 0.22);
    for (let i = 0; i < n; i++) {
      const a = A0 + 0.55 + ((A1 - A0 - 1.1) * i) / Math.max(1, n - 1);
      const z = WATER_Z + 8 + (i % 3) * 8;
      const r0 = 8 + (i % 2) * 6;
      svg += arrowHead(
        P,
        [CX + Math.cos(a) * r0, CY + Math.sin(a) * r0, z],
        [CX + Math.cos(a) * (r0 + reach * 0.35), CY + Math.sin(a) * (r0 + reach * 0.15), z + reach],
      );
    }
  }
  return svg;
}

function sealSvg(P, view) {
  const active = view.stepId === "seal" || ((view.pressure || 0) >= 2 && lidGap(view) < 1);
  return prism(halfBand(CX, CY, SEAL_R - 4.6, SEAL_R + 1.6, A0, A1, 48), SEAL_Z, 6.8, P, {
    tone: "hi",
    className: active ? "pc-seal pc-seal-on" : "pc-seal",
    crease: "none",
  });
}

function lidSvg(P) {
  const brim = halfBand(CX, CY, LID_R - 9, LID_R, A0, A1, 52);
  let svg = prism(brim, LID_Z, LID_H, P, { tone: "mid" });
  const cap = halfDisc(CX, CY, LID_R - 7.2, A0, A1, 48);
  svg += prism(cap, LID_Z + LID_H - 2.4, 2.6, P, { tone: "hi" });
  // 盖中心的矮台，免得顶面像一块平板
  svg += disc(CX + Math.cos(FAR_SAFE()) * 6, CY + Math.sin(FAR_SAFE()) * 6, 9, LID_Z + LID_H, 3.2, P, { tone: "hi", bevel: 0.4 }, 24);
  // 盖底的压力传感器，从剖口能看见
  const [px, py] = atR(8, (A0 + A1) / 2);
  svg += disc(px, py, 2.6, LID_Z - 7.5, 7.2, P, { tone: "mid", className: "pc-probe", bevel: 0.2 }, 14);
  svg += disc(px, py, 4.2, LID_Z - 1.6, 2.2, P, { tone: "lo", className: "pc-probe" }, 16);
  return svg;
}

function FAR_SAFE() {
  return (A0 + A1) / 2;
}

function floatSvg(P, view) {
  const up = floatLift(view);
  const rise = up * FLOAT_RISE;
  const stemBase = LID_Z + 2 + rise;
  const stemTop = FLOAT_Z + FLOAT_REST + rise;
  const engaged = up > 0.8;
  const hot = engaged ? "pc-hot" : "";
  let svg = disc(FLOAT_X, FLOAT_Y, 6.4, FLOAT_Z - 1.2, 3.6, P, { tone: "lo", className: "pc-float" }, 20);
  svg += disc(FLOAT_X, FLOAT_Y, 3.3, stemBase, Math.max(8, stemTop - stemBase), P, {
    tone: "mid",
    className: `pc-float ${hot}`,
  }, 16);
  svg += disc(FLOAT_X, FLOAT_Y, 8.4, stemTop, 4.6, P, {
    tone: "hi",
    className: `pc-float ${hot}`,
    bevel: 0.4,
  }, 22);
  const tongueZ = TONGUE_Z0 + rise;
  const reach = engaged ? 1 : 0.28;
  const len = 6 + reach * (POT_R + 2 - FLOAT_RAD);
  const x1 = FLOAT_X + Math.cos(LOCK_A) * len;
  const y1 = FLOAT_Y + Math.sin(LOCK_A) * len;
  svg += rib(FLOAT_X, FLOAT_Y, x1, y1, tongueZ, 3.6, 2.3, P, {
    tone: "hi",
    className: engaged ? "pc-tongue pc-hot" : "pc-tongue",
  });
  return svg;
}

function valveSvg(P, view) {
  const open = valveOpen(view);
  const lift = VALVE_LIFT * open;
  const seatTop = VALVE_Z + 4.2;
  const nozzleTop = seatTop + 7.4;
  const capZ = nozzleTop + lift;
  const hot = open > 0.4 ? "pc-hot" : "";
  let svg = disc(VALVE_X, VALVE_Y, 11.5, VALVE_Z, 4.2, P, { tone: "lo", className: "pc-valve" }, 26);
  svg += disc(VALVE_X, VALVE_Y, 4.2, seatTop, 7.4 + lift, P, { tone: "mid", className: "pc-valve" }, 18);
  svg += disc(VALVE_X, VALVE_Y, 16.4, capZ, 9.2, P, {
    tone: "hi",
    className: `pc-valve ${hot}`,
    bevel: 0.8,
  }, 32);
  svg += disc(VALVE_X, VALVE_Y, 6.4, capZ + 9.2, 3.2, P, { tone: "mid", className: "pc-valve" }, 18);
  if (open > 0.08) {
    for (let i = 0; i < 5; i++) {
      const z = nozzleTop + 2 + i * 2.2;
      const rad = 11 + i * 4.5;
      const [sx, sy] = iso([
        VALVE_X + 8 + i * 7,
        VALVE_Y - 6 - i * 5,
        z,
      ], P);
      const op = (0.62 + open * 0.3) * (1 - i * 0.12);
      svg += `<ellipse class="pc-puff" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" rx="${(rad * 1.35).toFixed(1)}" ry="${(rad * 0.72).toFixed(1)}" opacity="${op.toFixed(2)}"/>`;
    }

  return svg;

/**
 * 表盘上压力对应的角度，度：0 kPa 在左下，100 kPa 在右下，中间从正上方过，
 * 底下留 110° 的空档给中间的读数。表针、刻度、设定标记都用这一条。
 */
function dialAngle(kPa) {
  return -215 + 250 * clamp(Math.max(0, kPa) / GAUGE_MAX, 0, 1);
}

/**
 * 压力表：屏幕空间的圆盘，不跟等轴测走，放在锅左边的空处。
 * 表针角度由 view.pressure 定，设定值画成表壳上的一段彩弧。
 */
function gaugeSvg(view) {
  const p = clamp(Math.max(0, view.pressure || 0), 0, GAUGE_MAX);
  const setK = clamp(view.setKPa ?? 70, 0, GAUGE_MAX);
  const boil = boilingPointC(P_ATM + p);
  const { cx, cy, r } = DIAL;
  const num = (n) => n.toFixed(1);
  const polar = (radius, deg) => {
    const a = (deg * Math.PI) / 180;
    return [cx + Math.cos(a) * radius, cy + Math.sin(a) * radius];
  };
  let svg = "";
  // 表壳与表盘
  svg += `<circle class="pc-dial-case" cx="${cx}" cy="${cy}" r="${r + 9}"/>`;
  svg += `<circle class="pc-dial-bezel" cx="${cx}" cy="${cy}" r="${r}"/>`;
  // 刻度：每 5 kPa 一根，每 25 kPa 一根长的，带数字
  for (let v = 0; v <= GAUGE_MAX; v += 5) {
    const major = v % 25 === 0;
    const a = dialAngle(v);
    const [x0, y0] = polar(r - 6, a);
    const [x1, y1] = polar(r - 6 - (major ? 14 : 7), a);
    svg += `<path class="pc-dial-tick${major ? " pc-dial-tick-major" : ""}" d="M${num(x0)} ${num(y0)}L${num(x1)} ${num(y1)}"/>`;
    if (major) {
      const [lx, ly] = polar(r - 35, a);
      svg += `<text class="pc-dial-num" x="${num(lx)}" y="${num(ly + 4.4)}" text-anchor="middle">${v}</text>`;
    }
  }
  // 设定：表壳上一段彩弧，引一根短线出去写「设定」
  const sa = dialAngle(setK);
  const [ax, ay] = polar(r - 8, sa - 3.4);
  const [bx, by] = polar(r - 8, sa + 3.4);
  svg += `<path class="pc-dial-set" d="M${num(ax)} ${num(ay)}A${num(r - 8)} ${num(r - 8)} 0 0 1 ${num(bx)} ${num(by)}"/>`;
  const [mx, my] = polar(r + 4, sa);
  const [tx, ty] = polar(r + 28, sa);
  svg += `<path class="pc-dial-leader" d="M${num(mx)} ${num(my)}L${num(tx - 6)} ${num(ty + 4)}"/>`;
  svg += `<text class="pc-dial-set-text" x="${num(tx)}" y="${num(ty)}">设定</text>`;
  // 表针：指到刻度内圈，尾巴压在中心轴下面
  const tip = r - 24;
  svg += `<path class="pc-dial-needle" transform="rotate(${(dialAngle(p) + 90).toFixed(2)} ${cx} ${cy})" d="M${cx} ${cy - tip}L${cx + 3.6} ${cy + 15}L${cx - 3.6} ${cy + 15}Z"/>`;
  svg += `<circle class="pc-dial-hub" cx="${cx}" cy="${cy}" r="5.6"/>`;
  // 盘面上的字：当前值在中间，底下标「示意」
  svg += `<text class="pc-dial-label" x="${cx}" y="${cy + 32}" text-anchor="middle">压力 kPa</text>`;
  svg += `<text class="pc-num" x="${cx}" y="${cy + 60}" text-anchor="middle">${p.toFixed(1)} kPa</text>`;
  svg += `<text class="pc-dial-note" x="${cx}" y="${cy + 80}" text-anchor="middle">示意</text>`;
  // 沸点读数：表盘上头那块空处
  svg += `<text class="pc-boil" x="20" y="98">沸点 ≈ ${Math.round(boil)} °C 示意</text>`;
  return svg;
}

/** 一件零件在屏幕上被拆解/抬起后挪到哪儿：等轴测是线性的，位移直接向量算。 */
function shiftOf(P, by) {
  const [ox, oy] = iso([0, 0, 0], P);
  const [nx, ny] = iso(by, P);
  return [nx - ox, ny - oy];
}

function partPoint(P, world, by = [0, 0, 0]) {
  const [sx, sy] = iso(world, P);
  const [dx, dy] = shiftOf(P, by);
  return [sx + dx, sy + dy];
}

/** 小名牌：一根短线指到零件上。字号比大标注小，字号和描边都能在深浅色下看清。 */
function nameTag(tip, at, label) {
  const f = (n) => n.toFixed(1);
  return `<path class="pc-tag-leader" d="M${f(at[0])} ${f(at[1])}L${f(tip[0])} ${f(tip[1])}"/>`
    + `<circle class="pc-tag-dot" cx="${f(tip[0])}" cy="${f(tip[1])}" r="1.7"/>`
    + `<circle class="pc-tag-dot" cx="${f(at[0])}" cy="${f(at[1])}" r="1.7"/>`
    + `<text class="pc-tag" x="${f(at[0] + 7)}" y="${f(at[1] - 5)}">${label}</text>`;
}

/**
 * 两张常驻小名牌，每一步都挂着：盖底的压力传感器、控制盒里的控制板。
 * 引线的头跟着零件走：锅盖抬起、拆解、控制盒挪开都跟得上。
 */
function tagsSvg(P, view) {
  const m = view.explode || 0;
  const gap = lidGap(view);
  const risen = [BURST.lid[0] * m, BURST.lid[1] * m, BURST.lid[2] * m + gap];
  const boxed = [BURST.box[0] * m, BURST.box[1] * m, BURST.box[2] * m];
  const probe = partPoint(P, [...atR(PROBE_RAD, FAR), PROBE_Z + 3.6], risen);
  const pcb = partPoint(P, [BOX.x + 15, BOX.y + 17, BOX.z + 4.6], boxed);
  return nameTag(probe, [392, 220], "压力传感器") + nameTag(pcb, [586, 516], "控制板");
}

// art.mjs — 外壳、内锅、台面、控制盒、锁盖爪。会动的件由 dyn.mjs 填进对应的槽。






const S = (paths, style) => solidSvg(paths, style);
const L = (d, style) => (d ? lineSvg(d, style) : "");
const D = (points, style) => dotsSvg(points, style);
const at = (P, x, y, z) => iso([x, y, z], P);

function rest() {
  return posterState();
}

/** 屏幕上的一条标注。字离开零件，引线两端有点。 */
function callout(P, tip, body, { dx = 36, dy = -28, tone = "hi", anchor = "start" } = {}) {
  const b = iso(tip, P);
  const a = [b[0] + dx, b[1] + dy];
  const tx = anchor === "end" ? a[0] - 8 : anchor === "middle" ? a[0] : a[0] + 8;
  const text = `<text class="pc-call" x="${tx.toFixed(1)}" y="${(a[1] - 6).toFixed(1)}" text-anchor="${anchor}">${body}</text>`;
  return L(pathOf([a, b]), { tone: "hi", className: "pc-leader" }) + D([a, b], { size: 1.35, tone: "hi" }) + text;
}

function titleSvg(text) {
  if (!text) return "";
  return `<text class="pc-title" x="18" y="36">${text}</text>`;
}

/** 锁盖爪：下面两只立柱留在锅沿，上面两块盖帽随锅盖走，中间的缝给锁舌。 */
function lugPostsSvg(P) {
  let svg = "";
  for (const a of [LOCK_A - LUG_SPREAD, LOCK_A + LUG_SPREAD]) {
    const [x0, y0] = atR(POT_R - 1.2, a);
    const [x1, y1] = atR(POT_R + 8, a);
    svg += rib(x0, y0, x1, y1, LUG_Z, 8, 3.4, P, { tone: "hi", className: "pc-lug" });
  }
  return svg;
}

function lugCapsSvg(P) {
  let svg = "";
  for (const a of [LOCK_A - LUG_SPREAD, LOCK_A + LUG_SPREAD]) {
    const [x0, y0] = atR(POT_R + 1.5, a);
    const [x1, y1] = atR(POT_R + 9, a);
    svg += rib(x0, y0, x1, y1, TONGUE_Z1 + 2.8, 6.4, 3.6, P, { tone: "hi", className: "pc-lug" });
  }
  return svg;
}

function pieces(P, view = rest()) {
  const out = [];
  const add = (id, anchor, svg, extra = {}) => out.push({ id, anchor, layer: extra.layer ?? 5, svg, ...extra });

  let bench = `<path class="iso-halo" d="${haloOf(BOARD, -PLATE_H - FOOT_H, PLATE_H, P)}"/>`;
  const feet = [...corners(BOARD, 12)].sort((a, b) => depthOf([a[0], a[1], 0], P) - depthOf([b[0], b[1], 0], P));
  for (const [x, y] of feet) {
    bench += disc(x, y, 5.4, -PLATE_H - FOOT_H, FOOT_H, P, { tone: "lo" }, 16);
  }
  bench += S(slabOf(BOARD, -PLATE_H, PLATE_H, P, 6, 1.1), { tone: "mid" });
  bench += L(planOutline(insetPlan(BOARD, 5), 0.3, P), { tone: "faint" });
  const screws = corners(BOARD, 9);
  bench += L(screws.map(([x, y]) => ring(x, y, 1.7, 0.3, P, 10)).join(""), { tone: "lo" });
  bench += D(screws.map(([x, y]) => at(P, x, y, 0.4)), { size: 0.48 });
  add("bench", [0, 70, -6], bench, { layer: 0 });

  let shell = disc(CX, CY, BODY_R, 0, BASE_H, P, { tone: "lo", bevel: 0.8 }, 48);
  shell += prism(halfBand(CX, CY, BODY_R - BODY_WALL, BODY_R, A0, A1, 48), BODY_Z0, BODY_Z1 - BODY_Z0, P, { tone: "mid" });
  shell += prism(halfBand(CX, CY, BODY_R - 1.2, BODY_R + 1.8, A0, A1, 48), BODY_Z1 - 5, 5, P, { tone: "hi" });
  for (const a of [FAR + 0.85, FAR - 0.85]) {
    const [x0, y0] = atR(BODY_R - 1, a);
    const [x1, y1] = atR(BODY_R + 12, a);
    shell += rib(x0, y0, x1, y1, 36, 8, 3.4, P, { tone: "mid" });
  }
  add("shell", [CX, CY + 20, 40], shell, { layer: 2 });

  const wall = halfBand(CX, CY, POT_R - POT_WALL, POT_R, A0, A1, 48);
  let pot = prism(halfDisc(CX, CY, POT_R - POT_WALL + 0.2, A0, A1, 40), POT_Z0, 2.4, P, { tone: "hi" });
  pot += prism(wall, POT_Z0 + 1.8, POT_Z1 - POT_Z0 - 2, P, { tone: "hi" });
  pot += prism(halfBand(CX, CY, POT_R - 1.4, POT_R + 3.2, A0, A1, 48), POT_Z1 - 3, 4.4, P, { tone: "hi" });
  add("pot", [CX, CY, 48], pot, { layer: 4 });

  add("lugs", [CX + 10, CY, LUG_Z], lugPostsSvg(P), { layer: 5 });
  add("heater", [CX, CY, 14], heaterSvg(P, view), { layer: 3 });
  add("water", [CX, CY - 8, 36], waterSvg(P, view), { layer: 6 });
  add("food", [CX + 6, CY - 16, 28], foodSvg(P), { layer: 7 });
  add("steam", [CX, CY - 10, 64], steamHintSvg(P, view), { layer: 8 });
  add("seal", [CX, CY, 96], sealSvg(P, view), { layer: 9 });
  add("lid", [CX, CY + 6, 108], lidSvg(P), { layer: 10 });
  add("float", [FLOAT_X, FLOAT_Y, 120], floatSvg(P, view), { layer: 11 });
  add("lugcap", [CX + 16, CY, TONGUE_Z1], lugCapsSvg(P), { layer: 12 });
  add("valve", [VALVE_X, VALVE_Y, 130], valveSvg(P, view), { layer: 13 });

  let box = S(slabOf({ x: BOX.x, y: BOX.y, w: BOX.w, d: BOX.d, r: 1.4 }, BOX.z, BOX.h, P, 3, 0.45), { tone: "mid" });
  const win = { x: BOX.x + 3.2, y: BOX.y + 3.4, w: BOX.w - 6.4, d: BOX.d - 7, r: 0.5 };
  box += S(slabOf(win, BOX.z + 3.2, 1.2, P, 2), { tone: "hi", className: "pc-pcb", crease: "none" });
  box += S(slabOf({ x: win.x + 2.2, y: win.y + 3, w: 8, d: 6, r: 0.3 }, BOX.z + 4.4, 1.5, P, 1), { tone: "lo", className: "pc-chip", crease: "none" });
  box += S(slabOf({ x: win.x + 12, y: win.y + 4, w: 6, d: 5, r: 0.3 }, BOX.z + 4.4, 1.3, P, 1), { tone: "lo", className: "pc-chip", crease: "none" });
  box += S(slabOf(win, BOX.z + BOX.h - 1.4, 1.5, P, 2), { tone: "hi", className: "pc-window", crease: "none" });
  add("box", [BOX.x + 14, BOX.y + 14, 22], box, { layer: 8 });

  add("cord", [BOX.x + 20, BOX.y - 2, 3], cordSvg(CORD, 1.45, P, { tone: "lo" }), { layer: 1 });

  const end = CORD[2];
  let plug = S(slabOf({ x: end[0] - 5, y: end[1] - 4, w: 12, d: 8, r: 0.7 }, 0.4, 3.2, P, 2, 0.3), { tone: "mid" });
  plug += S(slabOf({ x: end[0] - 2.2, y: end[1] - 6.5, w: 1.5, d: 3.6, r: 0.2 }, 1.2, 0.8, P, 1), { tone: "hi" });
  plug += S(slabOf({ x: end[0] + 1.5, y: end[1] - 6.5, w: 1.5, d: 3.6, r: 0.2 }, 1.2, 0.8, P, 1), { tone: "hi" });
  add("plug", [end[0], end[1], 2], plug, { layer: 3 });

  add("gauge", [CX - 30, CY - 70, 60], gaugeSvg(view), { layer: 14 });
  add("callout", [CX, CY, LID_Z + 20], "", { layer: 15 });
  add("title", [20, 20, 140], titleSvg(pictureTitle(view)), { layer: 16 });
  add("tags", [CX + 20, CY + 20, LID_Z + 30], tagsSvg(P, view), { layer: 17 });
  return out;
}

// live.js — 加热滑条、泄压、拆解、演示。演示只在按钮或 ?demo=1 时播放。
const BOOT = {"P":{"origin":[616.6582692607448,202.8385405979732],"scale":2.5952253020966425,"azimuth":40,"elevation":35}};

const hintEl = document.querySelector('[data-corner="hint"]');

const follow = (value, target, dt, tau) => {
  if (still.matches) return target;
  const next = value + (target - value) * (1 - Math.exp(-dt / tau));
  return Math.abs(target - next) < 0.004 ? target : next;
};

const CALLOUTS = {
  hook: null,
  heat: { tip: [CX + Math.cos(NEAR) * (PLATE_R - 4), CY + Math.sin(NEAR) * (PLATE_R - 4), PLATE_Z + PLATE_HGT + 1], text: "发热盘", dx: 86, dy: 18, anchor: "start" },
  seal: { tip: [CX + Math.cos(A1) * (SEAL_R - 1), CY + Math.sin(A1) * (SEAL_R - 1), SEAL_Z + 4], text: "密封圈", dx: 78, dy: -6, anchor: "start" },
  lock: { tip: [FLOAT_X, FLOAT_Y, FLOAT_Z + FLOAT_REST], text: "浮子阀", dx: 86, dy: 18, anchor: "start" },
  hold: { tip: [VALVE_X, VALVE_Y, VALVE_Z + 16], text: "限压阀", dx: 96, dy: 28, anchor: "start" },
  outro: null,
};

function calloutFor(view) {
  // 静帧是加热中间的一帧，跟 ① 一样挂发热盘的标注
  const id = view.poster ? "heat" : (view.stepId || (view.venting ? "hold" : view.locked ? "lock" : view.pressure > 2 ? "seal" : view.heat > 0.4 ? "heat" : "hook"));
  const spec = CALLOUTS[id];
  if (!spec) return null;
  const gap = lidGap(view);
  if (id === "seal") return { ...spec, tip: [spec.tip[0], spec.tip[1], spec.tip[2] + gap] };
  if (id === "lock") return { ...spec, tip: [FLOAT_X, FLOAT_Y, FLOAT_Z + gap + FLOAT_REST + (view.floatUp ? FLOAT_RISE + 6 : 4)] };
  if (id === "hold") return { ...spec, tip: [VALVE_X, VALVE_Y, VALVE_Z + gap + (view.venting ? VALVE_LIFT + 24 : 14)] };
  return spec;
}

// 重点件用强调色，其余件压成不透明的灰调（.pc-muted）。全图没有一件是半透明的，
// 后面的零件不会透出来。水是水、蒸汽是蒸汽，留着它们本来的样子。
const FOCUS = {
  heat: ["heater", "water", "steam"],
  seal: ["seal", "steam", "lid"],
  lock: ["float", "lugs", "lugcap", "lid"],
  hold: ["valve", "steam"],
};
// 控制盒留着本色：名牌「控制板」一直指着里面的绿板子
const NEVER_MUTED = new Set(["gauge", "title", "callout", "tags", "pot", "water", "steam", "box"]);

function applyFocus(view) {
  const id = view.poster ? "heat" : (view.stepId || "");
  const focus = FOCUS[id] || null;
  const bright = focus ? new Set([...NEVER_MUTED, ...focus]) : null;
  for (const el of svg.querySelectorAll(":scope > g[id]")) {
    if (el.style.opacity) el.style.opacity = "";
    el.classList.toggle("pc-muted", !!bright && !bright.has(el.id));
  }
  const on = id === "lock" && !!view.locked;
  for (const name of ["lugs", "lugcap", "float"]) {
    const el = node(name);
    if (el) el.classList.toggle("pc-on", on);
  }
}

function paint(view) {
  const key = [
    view.heat.toFixed(2),
    view.pressure.toFixed(1),
    view.floatUp ? 1 : 0,
    view.venting ? 1 : 0,
    view.locked ? 1 : 0,
    explode.toFixed(2),
    view.stepId || "",
    view.poster ? 1 : 0,
    view.releasing ? 1 : 0,
    (view.t || 0).toFixed(1),
  ].join("|");
  if (key === shownKey && explode === 0) return;
  shownKey = key;
  const pose = { ...view, explode };
  node("heater").innerHTML = heaterSvg(P, pose);
  node("water").innerHTML = waterSvg(P, pose);
  node("steam").innerHTML = steamHintSvg(P, pose);
  node("seal").innerHTML = sealSvg(P, pose);
  node("lid").innerHTML = lidSvg(P);
  node("float").innerHTML = floatSvg(P, pose);
  node("valve").innerHTML = valveSvg(P, pose);
  node("gauge").innerHTML = gaugeSvg(pose);
  const c = calloutFor(pose);
  node("callout").innerHTML = c ? callout(P, c.tip, c.text, c) : "";
  node("title").innerHTML = titleSvg(pictureTitle(pose));
  node("tags").innerHTML = tagsSvg(P, pose);
  const gap = lidGap(pose);
  const burst = {
    lid: BURST.lid,
    seal: BURST.seal,
    valve: BURST.valve,
    float: BURST.float,
    lugcap: BURST.lid,
    pot: BURST.pot,
    water: BURST.pot,
    food: BURST.pot,
    steam: BURST.pot,
    lugs: BURST.pot,
    box: BURST.box,
    cord: BURST.cord,
    plug: BURST.cord,
    heater: BURST.plate,
  };
  const rises = { lid: gap, seal: gap, float: gap, valve: gap, lugcap: gap };
  for (const [id, vec] of Object.entries(burst)) {
    const el = node(id);
    if (!el) continue;
    const m = explode;
    const dz = vec[2] * m + (rises[id] || 0);
    const dx = vec[0] * m;
    const dy = vec[1] * m;
    if (m < 0.01 && Math.abs(dz) < 0.05) el.removeAttribute("transform");
    else el.setAttribute("transform", translateAlong(P, [dx, dy, dz]));
  }
  applyFocus(pose);
  void slots;
}

function markStep(id) {
  if (!stepsEl) return;
  for (const li of stepsEl.querySelectorAll("[data-step]")) {
    li.dataset.on = li.dataset.step === id ? "1" : "0";
  }
}

function say(view) {
  const text = readout(view);
  if (readoutEl.textContent !== text) readoutEl.textContent = text;
  const hint = hintOf(view);
  if (hintEl && hintEl.textContent !== hint) hintEl.textContent = hint;
  const heatEl = tools.querySelector("[data-heat]");
  if (heatEl) heatEl.textContent = Math.round(view.heat * 100) + "%";
  const slider = tools.querySelector('[data-act="heat"]');
  if (slider && document.activeElement !== slider) slider.value = String(Math.round(view.heat * 100));
  const setPressed = (act, on) => {
    const button = tools.querySelector('[data-act="' + act + '"]');
    if (button) button.setAttribute("aria-pressed", on ? "true" : "false");
  };
  setPressed("release", !!view.releasing);
  setPressed("explode", explodeTarget > 0.5);
  setPressed("tour", touring);
  markStep(!view.poster && view.stepId && view.stepId !== "hook" && view.stepId !== "outro" ? view.stepId : "");
  stage.setAttribute("aria-valuetext", text);
}

function wake() {
  hold = false;
  if (state.poster) state = { ...state, poster: false };
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (hold && !touring) {
    explode = follow(explode, explodeTarget, calm ? 1 : dt, 0.18);
    if (Math.abs(explode - explodeTarget) > 0.012) {
      shownKey = "";
      paint({ ...state, explode });
      say({ ...state, explode });
      frame = visible ? requestAnimationFrame(tick) : 0;
    } else {
      if (Math.abs(explode - explodeTarget) > 0.001) {
        explode = explodeTarget;
        shownKey = "";
        paint({ ...state, explode });
      }
      frame = 0;
    }
    return;
  }
  if (touring && !calm) {
    tourT += dt;
    if (tourT > DEMO_LEN) tourT = 0;
    const pose = stateAt(tourT);
    state = pose;
    heatCmd = pose.heat;
    releasing = false;
    explodeTarget = pose.explode || 0;
  } else if (!calm) {
    const n = Math.max(1, Math.round(dt / (1 / 60)));
    const slice = dt / n;
    for (let i = 0; i < n; i++) {
      state = step(state, { dt: slice, heat: heatCmd, sealed: true, releasing, setKPa: SET_KPA });
    }
  }
  explode = follow(explode, explodeTarget, dt, 0.18);
  const view = { ...state, explode, stepId: touring ? state.stepId : inferStep(state), poster: false };
  paint(view);
  say(view);
  const moving = touring || Math.abs(explode - explodeTarget) > 0.01 || heatCmd > 0.01 || state.temp > T_AMBIENT + 0.4 || releasing || state.pressure > 0.2;
  frame = visible && moving ? requestAnimationFrame(tick) : 0;
}

function inferStep(s) {
  if (s.venting && !s.releasing) return "hold";
  if (s.locked) return "lock";
  if (s.pressure >= 2) return "seal";
  if (s.heat > 0.15 || s.temp > T_AMBIENT + 8) return "heat";
  return "hook";
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

const stopTour = () => {
  touring = false;
  tourT = 0;
};

stage.addEventListener("pointerdown", (event) => {
  if (event.target.closest("button, input, .pc-tools")) return;
  stopTour();
  wake();
  stage.focus({ preventScroll: true });
  drag = true;
  dragX = event.clientX;
  stage.setPointerCapture?.(event.pointerId);
  run();
});
let drag = false;
let dragX = 0;
stage.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const dx = event.clientX - dragX;
  dragX = event.clientX;
  heatCmd = clamp(heatCmd + dx / 280, 0, 1);
  run();
});
stage.addEventListener("pointerup", () => {
  drag = false;
});
stage.addEventListener("pointercancel", () => {
  drag = false;
});

stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "e", "E", "r", "R"].includes(key)) return;
  event.preventDefault();
  stopTour();
  wake();
  if (key === "ArrowRight" || key === "ArrowUp") heatCmd = clamp(heatCmd + 0.05, 0, 1);
  else if (key === "ArrowLeft" || key === "ArrowDown") heatCmd = clamp(heatCmd - 0.05, 0, 1);
  else if (key === " " || key === "r" || key === "R") releasing = !releasing;
  else if (key === "e" || key === "E") explodeTarget = explodeTarget > 0.5 ? 0 : 1;
  run();
});

tools.addEventListener("pointerdown", (event) => event.stopPropagation());
tools.addEventListener("input", (event) => {
  if (event.target.dataset.act !== "heat") return;
  stopTour();
  wake();
  heatCmd = clamp(Number(event.target.value) / 100, 0, 1);
  run();
});
tools.addEventListener("click", (event) => {
  const act = event.target.closest("[data-act]")?.dataset.act;
  if (!act || act === "heat") return;
  if (act === "theme") {
    const next = document.body.dataset.theme === "dark" ? "light" : "dark";
    document.body.dataset.theme = next;
    event.target.textContent = next === "dark" ? "浅色" : "深色";
    return;
  }
  if (act === "tour") {
    touring = !touring;
    if (touring) {
      tourT = 0;
      state = initialState();
      heatCmd = 0;
      releasing = false;
      explodeTarget = 0;
      hold = false;
    } else {
      hold = true;
    }
    shownKey = "";
    run();
    return;
  }
  stopTour();
  wake();
  if (act === "release") releasing = !releasing;
  else if (act === "explode") explodeTarget = explodeTarget > 0.5 ? 0 : 1;
  run();
});

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "80px 0px" }).observe(stage);

if (new URLSearchParams(location.search).get("demo") === "1" && !still.matches) {
  touring = true;
  tourT = 0;
  state = initialState();
  heatCmd = 0;
  hold = false;
}

paint({ ...state });
say({ ...state });
if (touring) run();

window.__fig = {
  setState(t) {
    stopTour();
    touring = false;
    hold = true;
    const pose = stateAt(clamp(t, 0, DEMO_LEN));
    state = pose;
    heatCmd = pose.heat;
    releasing = false;
    explodeTarget = pose.explode || 0;
    explode = pose.explode || 0;
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
    shownKey = "";
    const view = { ...pose, explode };
    paint(view);
    say(view);
  },
  get duration() {
    return DEMO_LEN;
  },
  getDuration: () => DEMO_LEN,
};

window.__pc = {
  get state() {
    return { ...state, explode: explodeTarget, heat: state.heat, heatCmd, releasing, touring };
  },
  get text() {
    return readout(state);
  },
  setHeat(v) {
    stopTour();
    wake();
    heatCmd = clamp(v, 0, 1);
    run();
  },
  release(on) {
    stopTour();
    wake();
    releasing = !!on;
    run();
  },
  explodeTo(v) {
    explodeTarget = v ? 1 : 0;
    run();
  },
  step(seconds) {
    stopTour();
    hold = true;
    let left = seconds;
    while (left > 0) {
      state = step(state, { dt: Math.min(1 / 60, left), heat: heatCmd, sealed: true, releasing, setKPa: SET_KPA });
      left -= 1 / 60;
    }
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
    shownKey = "";
    const view = { ...state, explode, stepId: inferStep(state), poster: false };
    paint(view);
    say(view);
  },
  touring: () => touring,
};
</script></body></html>
